<style>
/* VOICE work: a clinical reference for young gastroenterologists, calm and exact
   IDEA a pocket guideline card set, every CQ a card, coloured by its GRADE like a printed evidence table
   PICTURE the evidence map: all 96 CQs as tiles in 18 domain rows, fill = certainty, shape = strength

   TYPE Zen Kaku Gothic New 700 display + Noto Sans JP text
   LAYOUT laptop: title band with counts, map in two columns below, sticky filter bar, card grid by domain. phone: title, map, filters, cards in one column */
#iap25{color-scheme:light dark;--bg:light-dark(#ffffff,#140a10);--ink:light-dark(#1d1418,#f3e9ec);--mute:light-dark(#6b5a61,#b9a6ad);--line:light-dark(#eadfe3,#3a2630);--soft:light-dark(#fbf5f6,#1e1018);--band:light-dark(#4a0f2b,#2a0818);--bandInk:#fff4f6;--q4:light-dark(#6b0f2e,#ff8fa3);--q3:light-dark(#b8354f,#e86a7f);--q2:light-dark(#e9806e,#b65a55);--q1:light-dark(#f7c6b5,#6e3a3a);--gps:light-dark(#8a7d83,#9c8c93);--accent:light-dark(#b8354f,#ff8fa3);--sheet:light-dark(#ffffff,#1a0d14)}
:root[data-theme=light] #iap25{color-scheme:light}

#iap25.lightonly{color-scheme:light}
#iap25,#iap25 *{box-sizing:border-box;min-width:0}
#iap25{background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}

#iap25 .top{background:var(--band);color:var(--bandInk);padding-block:clamp(28px,4vw,52px) 0}
#iap25 .head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 40px;align-items:end}

#iap25 .foot a{color:var(--accent)}

</style>

const byQ = DATA.slice().sort((a,b)=>a.q-b.q);
const domOf = q => DOMAINS.find(d=>q>=d[1]&&q<=d[2]);
const subOf = q => SUBS.find(s=>q>=s[0]&&q<=s[1]);
function lead(it){ // representative statement: strongest, then highest certainty
  const st = it.statements||[];
  const recs = st.filter(s=>s.kind==='rec');
  if (!recs.length) return {kind:'gps'};
  return recs.slice().sort((a,b)=>((b.strength==='strong')-(a.strength==='strong'))||((QL[b.quality]||0)-(QL[a.quality]||0)))[0];
}
function cls(s){ if (s.kind!=='rec') return 's-gps'; return (s.strength==='strong'?'s-strong':'s-cond')+' q'+(QL[s.quality]||1); }
function kindOf(it){ const l = lead(it); return l.kind!=='rec'?'g':(l.strength==='strong'?'s':'c'); }
const L = k => T[lang][k];
const pick = (it,k) => it[k+'_'+lang] ?? it[k+'_en'] ?? '';

function match(it){
  if (filt!=='all' && !(it.statements||[]).some(s=> filt==='g'?s.kind!=='rec':(s.kind==='rec'&&(filt==='s'?s.strength==='strong':s.strength==='conditional')))) return false;
  if (!term) return true;
  const hay = [it.q,it.question_en,it.question_ja,...(it.statements||[]).flatMap(s=>[s.text_en,s.text_ja]),...(it.summary_ja||[]),...(it.summary_en||[])].join(' ').toLowerCase();
  return term.split(/\s+/).every(w=>hay.includes(w));
}

function renderStatic(){
  root.lang = lang;
  root.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = L(el.dataset.t); });
  root.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang===lang)));
  const all = byQ.flatMap(it=>it.statements||[]);
  const n = k => byQ.filter(it=>kindOf(it)===k).length;
  $('tally').innerHTML = [[byQ.length,L('tq')],[n('s'),L('ts')],[n('c'),L('tc')],[n('g'),L('tg')]].map(([v,l])=>`<div><b>${v}</b><span>${esc(l)}</span></div>`).join('');
  $('legend').innerHTML = `<span><i class="s-strong q3" style="background:var(--q3)"></i>${esc(L('lgS'))}</span><span><i style="box-shadow:inset 0 0 0 3px var(--q3)"></i>${esc(L('lgC'))}</span><span><i class="s-gps"></i>${esc(L('lgG'))}</span><span><i style="background:linear-gradient(90deg,var(--q1),var(--q2),var(--q3),var(--q4))"></i>${esc(L('lgQ'))}</span>`;
  $('q').placeholder = L('ph');
  $('chips').innerHTML = [['all','fAll'],['s','fS'],['c','fC'],['g','fG']].map(([k,l])=>`<button type="button" class="chip" data-f="${k}" aria-pressed="${filt===k}">${esc(L(l))}</button>`).join('');
  $('foot').innerHTML = L('foot').map(p=>`<p>${p}</p>`).join('');
  $('prev').textContent = '← '+L('prev'); $('next').textContent = L('next')+' →';
  $('close').setAttribute('aria-label', L('close'));
}

function render(){
  const vis = new Set(byQ.filter(match).map(it=>it.q));
  $('map').innerHTML = DOMAINS.map(d=>{
    const items = byQ.filter(it=>it.q>=d[1]&&it.q<=d[2]);
    return `<div class="mrow"><span><b>${d[0]}</b>${esc(lang==='ja'?d[5]:d[6])}</span><div class="cells">${items.map(it=>`<button type="button" class="cell ${cls(lead(it))}${vis.has(it.q)?'':' dim'}" data-q="${it.q}" aria-label="CQ ${it.q}">${it.q}</button>`).join('')}</div></div>`;
  }).join('');
  let html = '';
  DOMAINS.forEach(d=>{
    const items = byQ.filter(it=>it.q>=d[1]&&it.q<=d[2]&&vis.has(it.q));
    if (!items.length) return;
    html += `<section class="dom" id="iap25-d${d[0]}"><div class="domh"><em>${d[0]}</em><h3>${esc(lang==='ja'?d[3]:d[4])}</h3></div>`;
    let lastSub = null, open = false;
    items.forEach(it=>{
      const s = subOf(it.q);
      if (s!==lastSub){ if (open) html += '</div>'; if (s) html += `<p class="sub">${esc(lang==='ja'?s[2]:s[3])}</p>`; html += '<div class="grid">'; open = true; lastSub = s; }
      if (!open){ html += '<div class="grid">'; open = true; }
      const tags = (it.statements||[]).map(st=>st.kind==='rec'?`${L(st.strength)} · ${L('q')[st.quality]||''}`:L('tg'));
      html += `<button type="button" class="card" data-q="${it.q}"><span class="cell ${cls(lead(it))}" aria-hidden="true">${it.q}</span><p>${esc(pick(it,'question'))}</p><span class="tags">${[...new Set(tags)].map(t=>`<span>${esc(t)}</span>`).join('')}</span></button>`;
    });
    if (open) html += '</div>';
    html += '</section>';
  });
  $('list').innerHTML = html || `<p class="empty">${esc(L('none'))}</p>`;
  $('count').textContent = L('cnt')(vis.size);
}

function stmtHTML(s){
  const isRec = s.kind==='rec';
  const qn = QL[s.quality]||0;
  const meta = isRec ? `<span class="pill str">${esc(L(s.strength))}</span><span>${esc(L('ql'))}：${esc(L('q')[s.quality]||'')}</span><span class="meter" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<=qn?'f':''}"></i>`).join('')}</span>` : '';
  const brk = t => String(t||'').replace(/\s+(?=(?:\(?(?:i{1,3}|iv|v|vi)[.)])\s)/g,'\n')
  const txt = brk(lang==='ja' ? (s.text_ja||s.text_en) : s.text_en);
  const orig = lang==='ja' && s.text_ja ? `<details class="orig"><summary>${esc(L('orig'))}</summary><p>${esc(brk(s.text_en))}</p></details>` : '';
  return `<div class="stmt ${isRec?'q'+(qn||1):''}"><div class="k"><span class="pill kind">${esc(isRec?L('rec'):L('gps'))}</span>${meta}</div><p>${esc(txt)}</p>${orig}</div>`;
}

function openQ(idx, push){
  if (idx<0||idx>=byQ.length) return;
  cur = idx; const it = byQ[idx]; const d = domOf(it.q);
  $('shmeta').textContent = `${d[0]} · ${lang==='ja'?d[3]:d[4]}`;
  const sum = pick(it,'summary'), ev = it.evidence||[], note = pick(it,'note'), pt = pick(it,'patients');
  $('shbody').innerHTML =
    `<div class="sh-q"><span class="cell ${cls(lead(it))}">${it.q}</span><h4 id="shq">${esc(pick(it,'question'))}</h4></div>` +
    (it.statements||[]).map(stmtHTML).join('') +
    (sum&&sum.length ? `<h5>${esc(L('sum'))}</h5><div class="txt">${sum.map(p=>`<p>${esc(p)}</p>`).join('')}</div>` : '') +
    (ev.length ? `<h5>${esc(L('ev'))}</h5><ul class="ev">${ev.map(e=>`<li>${esc(e[lang]||e.en)}</li>`).join('')}</ul>` : '') +
    (note ? `<div class="note"><b>${esc(L('note'))}</b>${esc(note)}</div>` : '') +
    (pt ? `<div class="note"><b>${esc(L('pt'))}</b>${esc(pt)}</div>` : '');
  $('shbody').scrollTop = 0;
  $('prev').disabled = idx===0; $('next').disabled = idx===byQ.length-1;
  const sh = $('sheet'), sc = $('scrim');
  if (sh.hidden){ sh.hidden = false; sc.hidden = false; requestAnimationFrame(()=>{ sh.classList.add('on'); sc.classList.add('on'); }); document.documentElement.style.overflow='hidden'; $('close').focus({preventScroll:true}); }
  if (push!==false && location.hash!=='#q'+it.q) history.replaceState(null,'','#q'+it.q);
}
function closeSheet(){
  const sh = $('sheet'), sc = $('scrim');
  if (sh.hidden) return;
  sh.classList.remove('on'); sc.classList.remove('on');
  setTimeout(()=>{ sh.hidden = true; sc.hidden = true; }, 260);
  document.documentElement.style.overflow='';
  if (/^#q\d+$/.test(location.hash)) history.replaceState(null,'',location.pathname+location.search);
  const card = root.querySelector(`.card[data-q="${byQ[cur]?.q}"]`); if (card) card.focus({preventScroll:true});
}

root.addEventListener('click', e=>{
  const l = e.target.closest('[data-lang]'); if (l){ lang = l.dataset.lang; try{localStorage.setItem('iap25-lang',lang);}catch(err){} renderStatic(); render(); if (!$('sheet').hidden) openQ(cur,false); return; }
  const f = e.target.closest('[data-f]'); if (f){ filt = f.dataset.f; renderStatic(); render(); return; }
  const c = e.target.closest('[data-q]'); if (c && !c.closest('.sheet')){ openQ(byQ.findIndex(it=>it.q===+c.dataset.q)); }
});
$('q').addEventListener('input', e=>{ term = e.target.value.trim().toLowerCase(); render(); });
$('scrim').addEventListener('click', closeSheet);
$('close').addEventListener('click', closeSheet);
$('prev').addEventListener('click', ()=>openQ(cur-1));
$('next').addEventListener('click', ()=>openQ(cur+1));
document.addEventListener('keydown', e=>{
  if ($('sheet').hidden) return;
  if (e.key==='Escape') closeSheet();
  else if (e.key==='ArrowRight' && !e.target.closest('input')) openQ(cur+1);
  else if (e.key==='ArrowLeft' && !e.target.closest('input')) openQ(cur-1);
});
function fromHash(){ const m = location.hash.match(/^#q(\d+)$/); if (m){ const i = byQ.findIndex(it=>it.q===+m[1]); if (i>=0) openQ(i,false); } }
window.addEventListener('hashchange', fromHash);
renderStatic(); render(); fromHash();
}
</script>

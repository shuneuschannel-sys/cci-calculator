染性壊死性膵炎の初期管理は、十分な栄養補給と広域抗菌薬の静脈内投与を確保したうえで、内科的な「保存的治療優先」（非介入）とすべきである。","strength":"strong","quality":"low"}],"summary_ja":["感染が疑われても初期治療は保存的に行い、多くの症例はこれで改善する。壊死巣が被包化される発症3〜4週以降まで保存的治療を続け、その後に内視鏡的、経皮的、外科的なドレナージを検討する。","ここでいう「保存的」は外科的ネクロセクトミーを避けるという意味で用いられることが多く、ネクロセクトミーを伴わないドレナージなどの低侵襲介入を含みうる。集中治療、抗菌薬、栄養療法の組み合わせで、感染性膵壊死疑い例の約3分の2が手術を要さず低い死亡率で治療できる。","即時ドレナージと延期ドレナージを比較したRCTでは主要評価項目に差はなく、早期群で処置回数が多かった。延期群では一部が抗菌薬のみで治癒した。"],"summary_en":["Initial treatment of suspected infected necrosis is conservative, and many cases resolve this way. Conservative care should continue until the collection walls off, usually after 3 to 4 weeks, when endoscopic, percutaneous or surgical drainage can be considered.","In this setting conservative often means avoiding surgical necrosectomy and may include minimally invasive drainage without necrosectomy. Intensive care, antimicrobials and nutrition, with or without drainage, can succeed in about two thirds of patients with suspected infected necrosis, with low mortality.","An RCT comparing immediate with postponed drainage found similar primary outcomes, with more procedures in the early group. Some patients in the postponed group were cured with antibiotics alone."],"evidence":[{"en":"RCT of immediate drainage (within 24 hours of diagnosis) vs postponed drainage (over 4 weeks): similar comprehensive complication index, more procedures in the immediate group","ja":"即時ドレナージ（診断後24時間以内）と延期ドレナージ（4週以降）のRCT：comprehensive complication indexは同等、即時群で処置回数が多い"},{"en":"Same RCT: necrosectomy required in 51% (immediate) vs 22% (postponed), and 39% of the postponed group treated with antibiotics alone","ja":"同RCT：ネクロセクトミー施行は即時群51%対延期群22%、延期群の39%は抗菌薬のみで治癒"},{"en":"Conservative strategy with or without drainage: successful in about two thirds of suspected infected necrosis with low mortality","ja":"ドレナージの有無を問わない保存的戦略：感染性膵壊死疑い例の約3分の2で成功し、死亡率は低い"}],"note_ja":"介入の適応と時期はQ36〜Q38で扱われる。全身状態が悪化する場合は早期介入も検討される。","note_en":"Indications and timing of intervention are covered in Q36 to Q38. Earlier intervention may be considered if the patient deteriorates.","patients_ja":"","patients_en":""},{"q":33,"section":"X","question_en":"What is the role of antibiotic therapy in suspected infected necrotizing pancreatitis?","question_ja":"感染性壊死性膵炎が疑われる場合、抗菌薬治療の役割は何か？","statements":[{"kind":"gps","text_en":"Broad-spectrum antibiotic therapy should be administered initially in patients with suspected infected necrotizing pancreatitis.","text_ja":"感染性壊死性膵炎が疑われる患者には、初期治療として広域抗菌薬を投与すべきである。","strength":null,"quality":null}],"summary_ja":["抗菌薬投与の時期を直接検討した研究はないが、感染は予後を悪化させるため、Surviving Sepsisガイドラインに準じて感染性壊死を疑った時点でできるだけ早く開始する。","第3、第4世代セフェム、カルバペネム、ウレイドペニシリン、キノロンは腸内細菌に有効で膵組織への移行もよい。選択は地域の感受性データに基づき、微生物の専門家と相談して行う。培養結果が得られたら感受性に応じて変更する。","1剤か2剤かを示す前向き研究はないが、緑膿菌が疑われる場合を除き単剤の広域抗菌薬が一般に推奨される。プロカルシトニンに基づく投与調整は抗菌薬使用を減らしうるが、中等症から重症例での適用にはさらなる研究が必要である。"],"summary_en":["No study has directly examined antibiotic timing, but infection worsens outcome, so following the Surviving Sepsis guidelines antibiotics should start as soon as infected necrosis is suspected.","Third and fourth generation cephalosporins, carbapenems, ureidopenicillins and quinolones cover gut bacteria and penetrate the pancreas. Choice should reflect local susceptibility data in consultation with microbiologists, and therapy should be adjusted to culture results.","Prospective data on one versus two agents are lacking. A single broad-spectrum agent is generally preferred unless Pseudomonas is suspected. Procalcitonin guided therapy may reduce antibiotic use, but more research is needed before applying it to moderate to severe AP."],"evidence":[{"en":"Single-center RCT of 260 patients with mostly mild AP: procalcitonin guidance reduced antibiotic use from 63% to 45% without increasing infection or harm","ja":"主に軽症例260例の単施設RCT：プロカルシトニンに基づく管理で抗菌薬使用が63%から45%へ減少し、感染や有害事象は増えなかった"}],"note_ja":"Q19の予防投与否定とは異なり、感染が疑われる段階での早期治療的投与を求める立場である。","note_en":"Unlike the rejection of prophylaxis in Q19, this statement calls for early therapeutic antibiotics once infection is suspected.","patients_ja":"","patients_en":""},{"q":34,"section":"X","question_en":"What is the role of antifungal therapy in infected necrotizing pancreatitis?","question_ja":"感染性壊死性膵炎において抗真菌薬治療の役割は何か？","statements":[{"kind":"rec","text_en":"Prophylactic and empirical administration of antifungal agents for infected necrotizing pancreatitis is not recommended.","text_ja":"感染性壊死性膵炎に対する抗真菌薬の予防投与および経験的投与は推奨しない。","strength":"conditional","quality":"low"}],"summary_ja":["壊死性膵炎では侵襲性真菌感染が起こりやすく、予後不良と関連する。一方、長期の経皮ドレナージ後などでは定着（colonization）も多く、侵襲性感染との区別が必要である。Candida colonization indexは検証されておらず、投与判断は多くの因子を考慮して行う。","抗菌薬治療とドレナージ、ネクロセクトミーを行っても改善しない重症例では、真菌培養が陰性でも補助療法として抗真菌薬を考慮しうる。カンジダ症を疑う場合の初期薬はエキノキャンディン系が望ましい。","真菌感染が証明された場合はドレナージやネクロセクトミーによる感染源コントロールを行い、感受性に基づいて薬剤を選ぶ。投与期間は確立していない。予防投与は耐性真菌の出現を招き死亡を増やす可能性があるため行わない。"],"summary_en":["Invasive fungal infection is common in necrotizing AP and is linked to poor outcomes. Colonization is also frequent, for example after prolonged percutaneous drainage, and must be distinguished from invasive infection. The Candida colonization index has not been validated, so decisions must weigh several factors.","Antifungal therapy may be considered as an adjunct in critically ill patients who do not respond to antibiotics, drainage and necrosectomy, even with negative fungal cultures. An echinocandin is the preferred initial agent for suspected candidiasis.","Proven fungal infection requires source control by drainage or necrosectomy and drug selection by susceptibility. Treatment duration is not well defined. Prophylaxis is not indicated because it may select resistant fungi and increase mortality."],"evidence":[{"en":"Meta-analysis of 22 studies (2151 patients with necrotizing AP): mean incidence of fungal infection 26.6%, with higher in-hospital mortality (OR 3.95, 95% CI 2.6 to 5.8)","ja":"22研究（壊死性膵炎2151例）のメタ解析：真菌感染の平均発生率26.6%、院内死亡が高い（OR 3.95、95%CI 2.6〜5.8）"}],"note_ja":"推奨しないのは予防投与と経験的投与のルーチン使用であり、治療抵抗性の重症例では抗真菌薬の追加を個別に検討する。","note_en":"What is discouraged is routine prophylactic or empirical use. In refractory critically ill patients, adding an antifungal can be considered case by case.","patients_ja":"","patients_en":""},{"q":35,"section":"X","question_en":"How should failure of medical conservative therapy for infected necrotizing pancreatitis be defined?","question_ja":"感染性壊死性膵炎に対する内科的保存的治療の不成功はどのように定義すべきか？","statements":[{"kind":"gps","text_en":"Failure of medical conservative therapy should be defined if, despite the application of broad-spectrum or targeted antibiotic therapy and supportive therapy, the clinical condition of patients with suspected infected necrotizing pancreatitis does not improve (persistent fever and leukocytosis) or worsens with the development of sepsis.","text_ja":"広域または標的抗菌薬治療と支持療法を行っても、感染性壊死性膵炎が疑われる患者の臨床状態が改善しない（発熱と白血球増多の持続）、または敗血症の発症により悪化する場合に、内科的保存的治療の不成功と定義する。","strength":null,"quality":null}],"summary_ja":["全身状態が安定した感染性膵壊死では抗菌薬を継続し、可能であれば介入を少なくとも4週間遅らせる。一方、敗血症と進行性の（多）臓器不全を伴い急速に悪化する患者もあり、この場合は介入しても死亡率が高い。","保存的治療の不成功を一定期間内に予測できる画像所見や血清マーカーは現時点でない。体温、白血球数、CRPまたはプロカルシトニン、臓器機能を定期的に評価する。","新規または持続する発熱、頻脈、白血球数の増加、プロカルシトニン上昇、臓器不全は感染の持続を示す。最大限の保存的治療でも悪化する場合は、全身状態とCTによるドレナージ可能性の評価をもとに、ドレナージやネクロセクトミーへのステップアップを判断する。"],"summary_en":["In stable patients with infected necrosis, antibiotics should continue and intervention should be delayed for at least 4 weeks if possible. Some patients deteriorate quickly with sepsis and progressive (multi) organ failure, and mortality remains high despite intervention.","No imaging or serological marker currently predicts failure of conservative treatment within a defined period. Temperature, leukocyte count, CRP or procalcitonin, and organ function should be monitored regularly.","New or persistent fever, tachycardia, rising leukocyte count, increasing procalcitonin and organ dysfunction indicate persistent infection. If the patient worsens despite maximal conservative therapy, step-up to drainage and necrosectomy is decided on clinical status and CT assessment of whether the collections can be drained."],"evidence":[{"en":"No radiologic or serologic marker predicts failure of conservative therapy within a defined period","ja":"保存的治療の不成功を一定期間内に予測する画像や血清マーカーは存在しない"},{"en":"Indicators of persistent infection: new or persistent fever, tachycardia, rising leukocyte count, increased procalcitonin and organ dysfunction","ja":"感染持続の指標：新規または持続する発熱、頻脈、白血球数増加、プロカルシトニン上昇、臓器不全"}],"note_ja":"この定義はstep-up approachへ移行する判断の基準となる。介入の詳細はQ36以降を参照する。","note_en":"This definition is the trigger for moving to the step-up approach. See Q36 onward for intervention details.","patients_ja":"患者は、本ガイドラインが可能な限り丁寧かつ効果的な管理を目指していることを評価し、適切な場合には保存的治療を選ぶ方針を歓迎している。","patients_en":"Patients praise the effort to ensure care that is as considerate and effective as possible, and welcome conservative management when it is appropriate."},{"q":36,"section":"XI","question_en":"What are the indications for intervention in acute necrotizing pancreatitis?","question_ja":"急性壊死性膵炎における介入の適応は何か？","statements":[{"kind":"rec","text_en":"Common indications for intervention (either radiological, endoscopic, or surgical) in acute necrotizing pancreatitis are: i. Clinical suspicion of, or documented, infected necrotizing pancreatitis with clinical deterioration, preferably when the necrotic collection has become walled off. ii. Prolonged symptomatic sterile walled-off necrosis, e.g., abdominal pain, gastrointestinal luminal or biliary obstruction, or nutritional failure, even without signs of infection. iii. Less common indications for intervention are pancreatic hemorrhage, and bowel ischemia and fistula.","text_ja":"急性壊死性膵炎における介入（放射線学的、内視鏡的、外科的のいずれか）の一般的な適応は以下のとおりである。i. 臨床的に感染性膵壊死が疑われる、または確認され、臨床的に増悪している場合。可能であれば壊死性貯留が被包化してから行う。ii. 遷延する有症状の無菌性被包化壊死（WON）。例として腹痛、消化管内腔や胆道の閉塞、栄養障害などで、感染徴候がなくても適応となる。iii. 頻度は低いが、膵出血、腸管虚血および瘻孔も介入の適応である。","strength":"strong","quality":"low"}],"summary_ja":["壊死性膵炎の治療は保存的治療、内視鏡、経皮的手技、外科を組み合わせた多職種連携が基本である。抗菌薬に反応しない感染性膵壊死は介入の明確な適応となる。","無菌性WONでも、大きな貯留による胃排出路閉塞、膵頭部腫大による閉塞性黄疸、経口摂取不良による栄養障害、体重減少、全身倦怠の遷延などがあれば介入を考える。前向きコホートでは、こうした「持続する不調」を示す例は発症後6〜8週で介入が必要になることが多いと示唆されている。","まれな適応として出血、腸管虚血、消化管瘻があり、膵胸膜瘻や膵性腹水は非外科的介入の対象となる。感染の有無ではなく、臨床経過と症状で判断する姿勢が求められる。"],"summary_en":["Necrotizing pancreatitis is managed by a multidisciplinary team combining conservative, endoscopic, percutaneous and surgical options. Infected necrosis that does not respond to antibiotics is a clear indication for intervention.","Sterile WON also warrants intervention when it causes gastric outlet obstruction, obstructive jaundice, nutritional failure, weight loss or persistent unwellness. Prospective cohorts suggest that such persistently unwell patients often need intervention around 6 to 8 weeks after onset.","Rarer indications include hemorrhage, bowel ischemia and fistula, while pancreato-pleural fistula and pancreatic ascites are handled non-surgically. Decisions rest on clinical course and symptoms, not on infection status alone."],"evidence":[{"en":"Observational study (n=639): about 1% of patients with necrotizing pancreatitis had obstructive symptoms requiring intervention during the index admission","ja":"観察研究（n=639）：壊死性膵炎の約1%が初回入院中に閉塞症状を呈し介入を要した"},{"en":"Prospective cohort studies: persistently unwell patients with necrotizing pancreatitis probably need intervention 6 to 8 weeks after onset","ja":"前向きコホート研究：持続的に不調な壊死性膵炎患者は発症後6〜8週で介入を要する可能性が高い"}],"note_ja":"感染の確定は必須ではなく、臨床的疑いと増悪があれば介入を検討する。無菌性でも症状が持続すれば適応となる点に注意。","note_en":"Confirmed infection is not mandatory. Clinical suspicion with deterioration suffices, and symptomatic sterile WON is also an indication.","patients_ja":"","patients_en":""},{"q":37,"section":"XI","question_en":"What is the optimal timing of intervention for suspected or confirmed infected necrotizing pancreatitis?","question_ja":"感染が疑われる、または確認された壊死性膵炎に対する介入の最適なタイミングはいつか？","statements":[{"kind":"rec","text_en":"Interventional treatment should be delayed in patients with suspected or confirmed infected necrotizing pancreatitis, if possible, to allow for the collection to become 'walled-off' (Walled off necrosis, WON) with better demarcation and liquefaction of the necrosis, which generally takes around 4 weeks.","text_ja":"感染が疑われる、または確認された壊死性膵炎では、可能であれば介入治療を遅らせ、貯留が被包化（被包化壊死：WON）し、壊死の境界が明瞭化し液状化するのを待つべきである。これには通常約4週間を要する。","strength":"strong","quality":"low"}],"summary_ja":["介入は壊死が被包化され液状化した時期、すなわちWONの段階まで待つのが原則である。被包化が進むとドレナージやネクロセクトミーが安全かつ有効に行いやすくなる。","WON形成には通常約4週を要するが、多くの症例ではそれより早く被包化し、有効なドレナージが可能となることもある。","一方で臨床的増悪のため早期介入（多くはカテーテルドレナージ）が必要な症例もあり、一律に4週を待つことはできない。詳細はQ38を参照。"],"summary_en":["The principle is to postpone intervention until the necrosis is encapsulated and liquefied, that is, the WON stage. Encapsulation makes drainage and necrosectomy safer and more effective.","WON usually takes about 4 weeks to form, although many collections encapsulate earlier and can be drained effectively before that.","Some patients deteriorate and need earlier intervention, usually catheter drainage, so the 4 week rule cannot be applied rigidly. See Q38."],"evidence":[{"en":"Current evidence supports deferring intervention until wall formation and liquefaction (WON stage)","ja":"現時点のエビデンスは、壁形成と液状化（WON期）まで介入を遅らせることを支持する"}],"note_ja":"本文の推奨は「約4週」、Table 1では「3〜4週」と記載されている。","note_en":"The body text says about 4 weeks, whereas Table 1 says 3 to 4 weeks.","patients_ja":"","patients_en":""},{"q":38,"section":"XI","question_en":"Can subgroups of patients with necrotizing pancreatitis be defined that require early intervention?","question_ja":"早期介入を要する壊死性膵炎の患者サブグループを定義できるか？","statements":[{"kind":"rec","text_en":"Early (<4 weeks) intervention such as transluminal or percutaneous drainage may be appropriate for patients with suspected or confirmed infected necrotizing pancreatitis who have failed conservative medical management (including antibiotics), provided they have at least partial encapsulation of the necrotic collections.","text_ja":"感染が疑われる、または確認された壊死性膵炎で、抗菌薬を含む保存的内科治療が奏効しない患者では、壊死性貯留が少なくとも部分的に被包化されていれば、経消化管的または経皮的ドレナージなどの早期（4週未満）介入が適切な場合がある。","strength":"conditional","quality":"low"}],"summary_ja":["介入はWON形成まで待つのが理想だが、発症3週以内に43%で被包化がみられ、感染も発症2週以内に約4分の1で生じる。持続性または新規の臓器不全を伴う感染性膵壊死では、4週まで待てないことがある。","こうした例では全身状態を安定させるための早期介入が必要となり、低侵襲手技の有用性が示されている。早期介入の手段は経皮的ドレナージか内視鏡的経消化管ドレナージであり、ネクロセクトミーは状態が安定するまで延期するのが望ましい。","壊死や感染の有無にかかわらず、出血、消化管穿孔、腸管虚血などの腹腔内カタストロフィーは即時の介入を要する。"],"summary_en":["Waiting for WON is ideal, but 43% of collections show encapsulation within the first 3 weeks, and infection develops within 2 weeks of onset in about a quarter of patients. In those with persistent or new organ failure due to infected necrosis, waiting until 4 weeks may not be feasible.","Early intervention may then be needed to stabilize the patient, and minimally invasive procedures have proven useful. Early intervention should be percutaneous or endoscopic transmural drainage, and necrosectomy should still be deferred until the patient stabilizes.","Intra-abdominal catastrophes such as hemorrhage, perforated viscus or ischemic bowel require immediate intervention regardless of necrosis or infection."],"evidence":[{"en":"Encapsulation (wall formation) seen in 43% of patients within the first 3 weeks","ja":"発症3週以内に43%で被包化（壁形成）がみられる"},{"en":"Infection of necrotic collections occurs within 2 weeks of onset in about a quarter of patients","ja":"壊死性貯留の感染は約4分の1の患者で発症2週以内に生じる"}],"note_ja":"早期介入はドレナージにとどめ、ネクロセクトミーは安定化後に行う。","note_en":"Limit early intervention to drainage and defer necrosectomy until stabilization.","patients_ja":"","patients_en":""},{"q":39,"section":"XI","question_en":"What is the role of abdominal paracentesis drainage (APD) in acute necrotizing pancreatitis?","question_ja":"急性壊死性膵炎における腹腔穿刺ドレナージ（APD）の役割は何か？","statements":[{"kind":"rec","text_en":"Abdominal paracentesis drainage (APD) may be done in patients with severe AP with abdominal or pelvic fluid (ascites) in the acute stage.","text_ja":"急性期に腹腔内または骨盤内の液体（腹水）を伴う重症急性膵炎患者では、腹腔穿刺ドレナージ（APD）を行ってもよい。","strength":"conditional","quality":"moderate"}],"summary_ja":["洗浄の有無にかかわらず、腹腔ドレナージをルーチンに行う適応はない。","相対的な適応は、発症2週以内に膵および膵周囲の強い炎症により、アミラーゼや蛋白に富む炎症性滲出液が腹腔内に漏出し、無菌性貯留や腹水を形成した症例である。穿刺や持続カテーテルドレナージにより炎症性メディエーターを除去し、全身炎症を軽減できる可能性がある。","後ろ向きコホート研究と、3件のRCTを含むメタアナリシスで、中等症から重症例における早期APDの有益性が示されている。"],"summary_en":["There is no indication for routine peritoneal drainage, with or without lavage.","A relative indication is marked pancreatic and peripancreatic inflammation within the first 2 weeks, with leakage of amylase-rich and protein-rich exudate into the peritoneal cavity forming sterile collections or ascites. Paracentesis or continuous catheter drainage may remove inflammatory mediators and ameliorate systemic inflammation.","Several retrospective cohorts and a meta-analysis that included 3 RCTs showed benefit of early APD in moderate to severe AP."],"evidence":[{"en":"Meta-analysis including 3 RCTs plus retrospective cohorts: beneficial effects of early APD in moderate to severe AP","ja":"3件のRCTを含むメタアナリシスと後ろ向きコホート研究：中等症から重症急性膵炎で早期APDの有益性"}],"note_ja":"対象は急性期の腹水を伴う重症例に限られ、ルーチンの腹腔洗浄やドレナージは推奨されない。","note_en":"APD is limited to severe AP with ascites in the acute stage. Routine peritoneal drainage or lavage is not recommended.","patients_ja":"","patients_en":""},{"q":40,"section":"XI","question_en":"What is the optimal interventional strategy (percutaneous, minimally invasive retroperitoneal, endoscopic, laparoscopic, or open surgery) for suspected or confirmed infected necrotizing pancreatitis?","question_ja":"感染が疑われる、または確認された壊死性膵炎に対する最適な介入戦略（経皮的、低侵襲後腹膜的、内視鏡的、腹腔鏡的、開腹手術）は何か？","statements":[{"kind":"rec","text_en":"The step-up approach consisting of initial antibiotics, then percutaneous drainage or endoscopic transluminal drainage followed, if necessary, by minimally invasive necrosectomy via the retroperitoneal route or per-oral endoscopic necrosectomy is recommended for suspected or confirmed infected necrotizing pancreatitis.","text_ja":"感染が疑われる、または確認された壊死性膵炎には、まず抗菌薬を投与し、次に経皮的ドレナージまたは内視鏡的経消化管ドレナージを行い、必要に応じて後腹膜経路による低侵襲ネクロセクトミーまたは経口的内視鏡的ネクロセクトミーへ進むstep-up approachが推奨される。","strength":"strong","quality":"high"}],"summary_ja":["感染性膵壊死の治療は、早期の外科的ネクロセクトミーから、遅延させた低侵襲のstep-up approachへと移行した。感染が疑われればまず支持療法、栄養、適切な抗菌薬による保存的治療を行い、「待機、ドレナージ、デブリードマン」の順に段階的に進める。","経皮的または内視鏡的ドレナージのみで40〜60%が治癒し、ネクロセクトミーを回避できる。オランダの多施設RCTでも、ドレナージ単独で解決した割合は内視鏡的step-up群43%、外科的step-up群51%であった。ただし壊死量の評価法が統一されておらず、データには不均一性がある。","開腹手術は低侵襲手技が無効または適応外の患者や、消化管穿孔、腸管虚血などの急性病態に限定される。"],"summary_en":["Management of infected necrosis has shifted from early surgical necrosectomy to a delayed, minimally invasive step-up strategy. Conservative care with support, nutrition and antibiotics comes first, followed by delay, drainage and then debridement only if needed.","Percutaneous or endoscopic drainage alone resolves 40 to 60% of infected collections. In a Dutch multicenter RCT, drainage alone sufficed in 43% of the endoscopic and 51% of the surgical step-up arm. The data are heterogeneous because necrosis extent is not reported in a standardized way.","Open surgery is reserved for failure of or ineligibility for less invasive techniques and for acute problems such as perforated viscus or ischemic bowel."],"evidence":[{"en":"Drainage alone (percutaneous or endoscopic) is sufficient in 40 to 60% of patients with infected necrotic collections","ja":"経皮的または内視鏡的ドレナージ単独で感染性壊死性貯留の40〜60%が治癒"},{"en":"Dutch multicenter RCT (n=98): endoscopic step-up (n=51) vs minimally invasive surgical step-up (n=47), resolution with drainage alone 43% vs 51%","ja":"オランダ多施設RCT（n=98）：内視鏡的step-up（n=51）対低侵襲外科的step-up（n=47）、ドレナージ単独での治癒は43%対51%"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":41,"section":"XI","question_en":"Which drainage modality (percutaneous or endoscopic transluminal) should be the first line for suspected or confirmed infected necrotizing pancreatitis?","question_ja":"感染が疑われる、または確認された壊死性膵炎の第一選択となるドレナージ法（経皮的か内視鏡的経消化管的か）はどれか？","statements":[{"kind":"rec","text_en":"Either percutaneous catheter or endoscopic transluminal drainage is recommended for treating patients with suspected or confirmed infected necrotizing pancreatitis, depending on the location of infected necrotic collections and available expertise.","text_ja":"感染が疑われる、または確認された壊死性膵炎の治療には、感染性壊死性貯留の部位と施設の専門性に応じて、経皮的カテーテルドレナージまたは内視鏡的経消化管ドレナージのいずれかが推奨される。","strength":"strong","quality":"high"}],"summary_ja":["経皮的カテーテルドレナージ（PCD）と内視鏡的経消化管ドレナージはいずれもWONに対する第一選択の非外科的手技である。選択は部位、壁の成熟度、貯留の数、施設の専門性で決まる。","内視鏡の利点は内瘻化で外瘻を避けられること。PCDの利点は普及度が高く、後腹膜経路で左右の腹部や骨盤に到達でき、複数本の留置や洗浄が可能なことである。胃や十二指腸に近い網嚢の貯留は内視鏡、結腸より背側の傍結腸溝や骨盤の貯留はPCDの適応となる。","2件のRCTでは内視鏡的step-upと低侵襲外科的step-upの成功率は同等だったが、内視鏡群で入院期間が短く膵瘻が少なかった。多発性や広範な貯留では両者を組み合わせることも多い。"],"summary_en":["PCD and endoscopic transluminal drainage are both first-line non-surgical options for WON. The choice depends on location, wall maturity, number of collections and local expertise.","Endoscopy provides internal drainage and avoids external fistulas. PCD is widely available, reaches both sides of the abdomen and pelvis through the retroperitoneum, and allows multiple catheters and flushing. Lesser sac collections near the stomach and duodenum suit endoscopy, while retrocolic paracolic and pelvic collections need PCD.","Two RCTs found similar success for endoscopic and minimally invasive surgical step-up, but the endoscopic route gave shorter hospital stay and fewer pancreatic fistulas. Multiple or extensive collections often need a combined approach."],"evidence":[{"en":"Two RCTs: endoscopic vs minimally invasive surgical step-up, similar success, shorter hospital stay and less pancreatic fistula with endoscopy","ja":"2件のRCT：内視鏡的step-upと低侵襲外科的step-upで成功率は同等、内視鏡群で入院期間短縮と膵瘻減少"},{"en":"Meta-analysis of 3 RCTs (n=184): endoscopic step-up reduced new-onset organ failure and pancreatic fistula","ja":"3件のRCTのメタアナリシス（n=184）：内視鏡的step-upで新規臓器不全と膵瘻が減少"}],"note_ja":"両アプローチが可能な貯留では内視鏡が優先されるが、広範な壊死では複数手技の併用が必要になる。","note_en":"Endoscopy is preferred when both routes are feasible, but extensive necrosis often requires combined procedures.","patients_ja":"","patients_en":""},{"q":42,"section":"XI","question_en":"What type of stent (multiple plastic or LAMS) should be used for endoscopic transluminal drainage of walled-off necrosis?","question_ja":"被包化壊死（WON）の内視鏡的経消化管ドレナージにはどのステント（複数のプラスチックステントかLAMSか）を用いるべきか？","statements":[{"kind":"rec","text_en":"Multiple plastic stents or LAMS can be used for endoscopic transluminal drainage of walled-off necrosis. However, LAMS may be preferred in those with infected WON or if the extent of necrosis is >30 % of the WON.","text_ja":"WONの内視鏡的経消化管ドレナージには、複数のプラスチックステントまたはLAMSを使用できる。ただし、感染性WONや、壊死がWONの30%を超える場合はLAMSが優先されうる。","strength":"strong","quality":"high"}],"summary_ja":["従来は7〜10 Frの両端ピッグテール型プラスチックステント（DPPS）を複数留置していたが、固形壊死物のドレナージに優れ、LAMS越しの直接内視鏡的ネクロセクトミーが可能なLAMSが普及した。","観察研究のメタアナリシスではLAMSで必要なネクロセクトミー回数が少なかったが、2件のRCTでは差がなかった。一方、28研究2974例のネットワークメタアナリシスではLAMSが複数DPPSに優った。感染性WONや壊死成分が30%を超える例ではLAMSが選ばれる。","LAMSは壊死物で閉塞することがあり、LAMS内にDPPSを同軸留置すると閉塞と感染のリスクが下がる。LAMS抜去後にDPPSを留置すると再発が減る。"],"summary_en":["Multiple 7 to 10 F double pigtail plastic stents (DPPS) were the traditional choice, but LAMS have gained popularity because they drain solid debris better and allow direct endoscopic necrosectomy through the stent.","A meta-analysis of observational studies suggested fewer necrosectomy sessions with large-caliber metal stents, while two RCTs found no difference. A network meta-analysis of 28 studies with 2974 patients favored LAMS over multiple DPPS. LAMS are preferred for infected WON or when necrotic debris exceeds 30% of the WON.","LAMS may occlude with debris. A coaxial DPPS through the LAMS lowers occlusion and infection, and placing a DPPS after LAMS removal lowers recurrence."],"evidence":[{"en":"Network meta-analysis (28 studies, n=2974): LAMS superior to multiple DPPS","ja":"ネットワークメタアナリシス（28研究、n=2974）：LAMSは複数DPPSより優れる"},{"en":"Two RCTs: no difference in number of necrosectomy sessions between LAMS and plastic stents","ja":"2件のRCT：LAMSとプラスチックステントでネクロセクトミー回数に差なし"},{"en":"Meta-analysis (9 studies, n=709): coaxial DPPS through LAMS reduced stent occlusion and infection, overall adverse events unchanged","ja":"メタアナリシス（9研究、n=709）：LAMS内同軸DPPSでステント閉塞と感染が減少、全有害事象は差なし"},{"en":"Meta-analysis of 3 RCTs: DPPS after LAMS removal lowered recurrence without changing reintervention","ja":"3件のRCTのメタアナリシス：LAMS抜去後のDPPS留置で再発が減少、再介入は差なし"}],"note_ja":"本文は「LAMS may be preferred」、Table 1は「LAMS should be preferred」と表現が異なる。","note_en":"The body text reads 'LAMS may be preferred', whereas Table 1 reads 'LAMS should be preferred'.","patients_ja":"","patients_en":""},{"q":43,"section":"XI","question_en":"What are the indications for necrosectomy in patients who are managed with step-up approach for acute necrotizing pancreatitis?","question_ja":"step-up approachで管理されている急性壊死性膵炎患者におけるネクロセクトミーの適応は何か？","statements":[{"kind":"rec","text_en":"During the step-up approach, necrosectomy is recommended in: i. Patients who continue to have persistent fever or signs of sepsis despite optimal utilization of sensitive antibiotics and adequate drainage (either percutaneous or endoscopic). ii. Patients with infected necrotizing pancreatitis who fail to improve clinically despite adequate antibiotic treatment and cannot undergo drainage either percutaneously or endoscopically.","text_ja":"step-up approachの過程で、ネクロセクトミーは以下の場合に推奨される。i. 感受性のある抗菌薬の最適な使用と適切なドレナージ（経皮的または内視鏡的）にもかかわらず、発熱や敗血症徴候が持続する患者。ii. 適切な抗菌薬治療にもかかわらず臨床的に改善せず、経皮的にも内視鏡的にもドレナージができない感染性膵壊死患者。","strength":"strong","quality":"high"}],"summary_ja":["抗菌薬と十分なドレナージで改善しなければ、次の段階はネクロセクトミーである。膵実質壊死が50%を超える広範な貯留や固形壊死物が多い貯留では、ドレナージ単独の成功率は低い。","PCDはカテーテルのサイズアップ、追加留置、洗浄、出納の厳密な管理などを積極的に行うと成功率が上がる。感染制御の指標は解熱、プロカルシトニン、CRP、白血球数の低下、臓器不全の改善である。新規または増悪する臓器不全はstep-upの判断基準として使われてきた。","PCDで初期に改善しても、発熱が続き栄養状態が悪化する例ではネクロセクトミーの判断が難しい。患者の全身状態と栄養状態、step-up治療への耐容性を常に評価する。ネクロセクトミーは壊死が被包化し液状化する発症4週以降に行うと、境界が明瞭で出血合併症が少ない。"],"summary_en":["If infection is not controlled by antibiotics and adequate drainage, necrosectomy is the next step. Drainage is less likely to succeed in extensive collections with more than 50% parenchymal necrosis or large amounts of solid debris.","Proactive PCD management with upsizing, extra catheters, irrigation and strict input and output monitoring improves success. Infection control is judged by resolution of fever, falling procalcitonin, CRP and leukocyte count, and reversal of organ failure. New or worsening organ failure has served as a trigger to step up.","Patients who improve initially after PCD but remain febrile and nutritionally compromised are a gray zone. Clinical and nutritional status and tolerance of the step-up pathway should guide decisions. Necrosectomy beyond 4 weeks, when necrosis is walled off and liquefied, offers clearer demarcation and fewer bleeding complications."],"evidence":[{"en":"Drainage less likely to succeed with >50% pancreatic parenchymal necrosis and large amounts of necrotic debris","ja":"膵実質壊死が50%超で壊死物が多い場合、ドレナージ単独は成功しにくい"},{"en":"Studies including a meta-analysis support postponing necrosectomy beyond 4 weeks from onset","ja":"メタアナリシスを含む研究で、ネクロセクトミーを発症4週以降に延期する利点が示されている"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":44,"section":"XI","question_en":"What interventional necrosectomy strategy should be chosen for infected necrotizing pancreatitis?","question_ja":"感染性膵壊死に対してどのネクロセクトミー戦略を選択すべきか？","statements":[{"kind":"rec","text_en":"The following interventional necrosectomy strategy should be chosen for infected necrotizing pancreatitis: i. Minimally invasive approaches are preferred to open approaches and recommended for necrosectomy once the (peri) pancreatic necrotic collection is walled-off. ii. Minimally invasive retroperitoneal pancreatic necrosectomy is recommended through the PCD tract in patients who have undergone percutaneous drainage using a retroperitoneal route. iii. Per-oral endoscopic necrosectomy is recommended in patients who have undergone endoscopic transluminal drainage. iv. Trans-gastric surgical necrosectomy (laparoscopic or open) is also an effective single-stage procedure ensuring wide stoma with durable internal drainage in patients with WON mainly localized to the lesser sac. v. Open debridement is rarely indicated and should be reserved for patients with predominantly solid collections and other intra-abdominal complications such as bowel fistula.","text_ja":"感染性膵壊死には以下のネクロセクトミー戦略を選択すべきである。i. 膵および膵周囲の壊死性貯留が被包化した後のネクロセクトミーには、開腹より低侵襲アプローチが優先され推奨される。ii. 後腹膜経路で経皮的ドレナージを受けた患者では、PCD瘻孔を通じた低侵襲後腹膜的膵ネクロセクトミーが推奨される。iii. 内視鏡的経消化管ドレナージを受けた患者では、経口的内視鏡的ネクロセクトミーが推奨される。iv. 主に網嚢に限局するWONでは、経胃的外科的ネクロセクトミー（腹腔鏡下または開腹）も、広い吻合口により持続的な内瘻化が得られる有効な一期的手術である。v. 開腹デブリードマンの適応はまれであり、主に固形成分からなる貯留や、消化管瘻などの腹腔内合併症を伴う患者に限るべきである。","strength":"strong","quality":"high"}],"summary_ja":["開腹ネクロセクトミー、特に早期の手術は予後不良である。低侵襲ネクロセクトミーは炎症反応を抑え、新規臓器不全、集中治療の必要性、死亡率を低下させる。手技の選択は貯留の種類、数、部位、全身状態、チームの経験と資源で決まり、先行したドレナージの経路を利用するのが基本である。","左前腎傍腔経路でPCDを行った例では、瘻孔を30 Frまで拡張して内視鏡や腎盂鏡で行う後腹膜的ネクロセクトミーやVARDに進む。PCD瘻孔を使う経皮的内視鏡的ネクロセクトミー（PEN）は鎮静と局所麻酔で施行できる。VARDは他の低侵襲手技より死亡率が高い傾向がある。EUS下ドレナージ後は直接内視鏡的ネクロセクトミーを行い、全体として内視鏡アプローチが第一選択、次いで後腹膜アプローチとなる。","網嚢に限局し胃後壁を圧排するWONでは、経胃的外科的ネクロセクトミーにより一期的に壊死をほぼ除去でき、胆石例では胆嚢摘出も同時に行える。開腹ネクロセクトミーは出血や消化管瘻を伴う複雑例や緊急時に限られる。"],"summary_en":["Open necrosectomy, especially early, carries poor outcomes. Minimally invasive necrosectomy reduces the inflammatory response, new-onset organ failure, ICU need and mortality. The technique depends on collection type, number and site, the patient's condition and team expertise, and it usually follows the tract of the preceding drainage.","After left anterior pararenal PCD, the tract can be dilated to 30 Fr for retroperitoneal necrosectomy with an endoscope or nephroscope, or for VARD. Percutaneous endoscopic necrosectomy (PEN) through the PCD tract can be done under sedation and local anesthesia. VARD appears to carry higher mortality than other less invasive options. After EUS-guided drainage, direct endoscopic necrosectomy follows, and overall endoscopy is the method of choice followed by the retroperitoneal route.","For WON confined to the lesser sac and bulging into the posterior gastric wall, transgastric surgical necrosectomy removes nearly all necrosis in a single stage and allows simultaneous cholecystectomy in gallstone cases. Open necrosectomy is kept for complex cases with bleeding or bowel fistula and for emergencies."],"evidence":[{"en":"RCT (n=70): upfront endoscopic necrosectomy (n=37) vs endoscopic step-up (n=33), significantly fewer reinterventions with upfront necrosectomy in stable patients","ja":"RCT（n=70）：早期内視鏡的ネクロセクトミー（n=37）対内視鏡的step-up（n=33）、安定例では早期ネクロセクトミーで再介入回数が有意に減少"},{"en":"Series of 178 selected WON cases: 96% treated by single-stage transgastric surgical necrosectomy, mortality 2%, morbidity 38%, concurrent cholecystectomy in 57% of biliary cases","ja":"選択された178例のWON：96%が一期的経胃的外科的ネクロセクトミーで治療、死亡率2%、合併症率38%、胆石性の57%で胆嚢摘出を同時施行"},{"en":"Open necrosectomy after 28 days from onset: about 10% mortality, rising above 50% with multiple risk factors","ja":"発症28日以降の開腹ネクロセクトミー：死亡率約10%、複数のリスク因子があると50%超"}],"note_ja":"ネクロセクトミーは可能なら発症4〜6週まで遅らせる。早期ネクロセクトミーは状態が安定し、貯留の境界が明瞭な例に限る。","note_en":"Necrosectomy should ideally wait until 4 to 6 weeks after onset. Upfront necrosectomy is only for stable patients with well-demarcated collections.","patients_ja":"患者側からは、壊死性膵炎で4週間治療せずに待つ理由を本人と家族に必ず説明してほしいという声が強い。説明がないと強い不安を生み、適切な治療を受けていないと誤解されかねない。","patients_en":"Patients stress that the reason for waiting up to 4 weeks without intervention must be explained to them and their families. Without explanation the delay causes great anxiety and may look like inadequate care."},{"q":45,"section":"XII","question_en":"How to define intra-abdominal hypertension and abdominal compartment syndrome?","question_ja":"腹腔内圧上昇（IAH）と腹部コンパートメント症候群（ACS）はどのように定義されるか？","statements":[{"kind":"gps","text_en":"Intra-abdominal hypertension (IAH) is defined by sustained or repeated elevation in Intra-abdominal pressure (IAP) of ≥12 mmHg. Abdominal compartment syndrome (ACS) is defined as a sustained IAP of >20 mmHg (with or without abdominal arterial perfusion pressure <60 mmHg) that is associated with new onset or progressive organ dysfunction.","text_ja":"腹腔内圧上昇（IAH）は、腹腔内圧（IAP）が12 mmHg以上に持続的または反復的に上昇した状態と定義される。腹部コンパートメント症候群（ACS）は、IAPが20 mmHgを超えて持続し（腹部灌流圧60 mmHg未満の有無を問わない）、新規発症または進行性の臓器障害を伴う状態と定義される。","strength":null,"quality":null}],"summary_ja":["腹腔内圧の上昇は腹腔内臓器の灌流を低下させ、腸管虚血と細菌トランスロケーションを促進しうる。","実験的重症急性膵炎では、持続する高IAPが肺障害を増悪させ、腎機能と心機能を低下させる。定義は世界腹部コンパートメント症候群学会（WSACS）の基準に基づく。"],"summary_en":["Raised intra-abdominal pressure reduces perfusion of abdominal organs and may contribute to intestinal ischemia and bacterial translocation.","In experimental severe AP, sustained high IAP worsens lung injury and impairs renal and cardiovascular function. The definitions follow the World Society of Abdominal Compartment Syndrome (WSACS)."],"evidence":[{"en":"Experimental severe AP: sustained high IAP increases lung injury and decreases renal and cardiovascular function","ja":"実験的重症急性膵炎：持続する高IAPは肺障害を増悪させ、腎機能と心血管機能を低下させる"}],"note_ja":"本文ではIAHを「≥12 mmHg」、Table 1では「>12 mmHg」と記載している。","note_en":"The body defines IAH as IAP ≥12 mmHg, whereas Table 1 shows >12 mmHg.","patients_ja":"","patients_en":""},{"q":46,"section":"XII","question_en":"Should IAP be measured routinely in AP?","question_ja":"急性膵炎では腹腔内圧（IAP）をルーチンに測定すべきか？","statements":[{"kind":"gps","text_en":"It is recommended to measure IAP in patients with severe AP. If IAP is >12 mmHg, the IAP should be monitored periodically in patients with severe AP.","text_ja":"重症急性膵炎ではIAPの測定が推奨される。IAPが12 mmHgを超える場合は、定期的にIAPをモニタリングすべきである。","strength":null,"quality":null}],"summary_ja":["IAHは急性膵炎の17%に生じ、重症例ではさらに高頻度である。病初期に発症し、臓器障害と死亡に相関する。","IAHとACSの診断には客観的な測定が必要で、WSACSガイドラインに従い、最大25 mLの滅菌生理食塩水を注入して膀胱内圧として測定する。ただし、IAPの測定自体が死亡率を改善するという明確なエビデンスはない。"],"summary_en":["IAH develops in 17% of AP patients and more often in severe disease. It appears early and correlates with organ dysfunction and death.","Diagnosis requires objective measurement, done via the urinary bladder with a maximal instillation of 25 mL sterile saline as in the WSACS guidelines. There is no definite evidence that measuring IAP itself improves mortality."],"evidence":[{"en":"IAH develops in 17% of patients with AP, more often in severe disease","ja":"IAHは急性膵炎の17%に発生し、重症例ではさらに多い"},{"en":"WSACS method: bladder pressure with maximal instillation of 25 mL sterile saline","ja":"WSACSの方法：最大25 mLの滅菌生理食塩水を注入して膀胱内圧を測定"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":47,"section":"XII","question_en":"How should patients with AP and IAH be treated?","question_ja":"急性膵炎とIAHを有する患者はどのように治療すべきか？","statements":[{"kind":"rec","text_en":"Patients with IAH should be treated with percutaneous catheter drainage of ascites and fluid collections, adequate pain relief, enteral decompression with nasogastric or rectal tubes, and avoidance of a positive cumulative fluid balance.","text_ja":"IAHを有する患者には、腹水および液体貯留の経皮的カテーテルドレナージ、十分な鎮痛、経鼻胃管や直腸管による腸管減圧、累積水分バランスがプラスにならないようにする管理を行うべきである。","strength":"conditional","quality":"low"}],"summary_ja":["これらの治療はWSACSのコンセンサスガイドラインで提案されている非手術的手段である。","急性期の腹水に対する経皮的カテーテルドレナージによるIAPの低下は約2 mmHgとわずかだが、ACSで腹水が多い例ではより大きな効果が期待できる。もっとも、ドレナージを要するほどの腹水はAPとIAHを有する患者の半数未満にしかみられない。","初期輸液後は累積水分バランスのプラスを避ける。重症急性膵炎とACSでは早期の持続的静静脈血液濾過がIAP低下に有効な可能性があるが、臨床的利益を示すRCTはない。"],"summary_en":["These measures are the non-operative options proposed in the WSACS consensus guidelines.","Percutaneous drainage of ascites early in AP lowers IAP only modestly, by about 2 mmHg, but the effect can be greater in ACS with substantial ascites. Drainable ascites, however, is present in fewer than half of patients with AP and IAH.","After initial resuscitation, a positive cumulative fluid balance should be avoided. Early continuous veno-venous hemofiltration may lower IAP in severe AP with ACS, but randomized evidence of clinical benefit is lacking."],"evidence":[{"en":"Percutaneous catheter drainage of ascites in early AP: modest IAP decrease of about 2 mmHg","ja":"急性期の腹水に対する経皮的カテーテルドレナージ：IAP低下は約2 mmHgとわずか"},{"en":"Substantial ascites for drainage present in fewer than half of patients with AP and IAH","ja":"ドレナージ可能な量の腹水はAPとIAHを有する患者の半数未満"}],"note_ja":"過剰輸液はIAHの誘因となるため、初期輸液後の水分バランス管理が要となる。","note_en":"Fluid overload drives IAH, so fluid balance after initial resuscitation is central.","patients_ja":"","patients_en":""},{"q":48,"section":"XII","question_en":"Should surgical decompression be used for the treatment of ACS?","question_ja":"ACSの治療に外科的減圧を用いるべきか？","statements":[{"kind":"rec","text_en":"Surgical decompression may be considered to treat ACS if a patient has worsening organ dysfunctions and non-operative modalities have failed.","text_ja":"臓器障害が増悪し、非手術的治療が奏効しない場合は、ACSの治療として外科的減圧を考慮してもよい。","strength":"conditional","quality":"very low"}],"summary_ja":["虚血性合併症と死亡を防ぐためACSには迅速な対応が必要である。初期治療は非手術的に行うが、IAPが下がらず臓器障害が進行すれば外科的減圧を考慮する。","後ろ向き研究ではACSを伴う急性膵炎の死亡率は49%であったが、早期に外科的減圧を行った例では18%であった。悪化するACS患者で腸管虚血を除外する確実な方法は開腹のみである。","開放腹部は腸管皮膚瘻や巨大腹壁瘢痕ヘルニアのリスクがあり、一時的閉腹で管理する。持続的筋膜牽引を併用した陰圧閉鎖療法が筋膜閉鎖率が最も高く瘻孔率が最も低い。他の膵または膵周囲合併症がないACSでの開腹はかえって有害となりうる。"],"summary_en":["ACS needs prompt treatment to prevent ischemic complications and death. Initial therapy is non-operative, but decompression is considered when IAP does not fall and organ dysfunction progresses.","In retrospective studies, AP with ACS had a mortality of 49%, versus 18% with early surgical decompression. Laparotomy is the only definite way to exclude intestinal ischemia in a deteriorating patient.","An open abdomen risks entero-atmospheric fistula and giant ventral hernia and should be managed with temporary closure. Negative pressure wound therapy with continuous fascial traction gives the highest delayed fascial closure and lowest fistula rate. Laparotomy in ACS without another pancreatic or peripancreatic complication may be harmful."],"evidence":[{"en":"Retrospective studies: mortality of AP with ACS 49%, 18% with early surgical decompression","ja":"後ろ向き研究：ACSを伴う急性膵炎の死亡率49%、早期外科的減圧例では18%"},{"en":"Open abdomen: negative pressure wound therapy with continuous fascial traction achieves the highest delayed fascial closure and lowest fistula rate","ja":"開放腹部：持続的筋膜牽引併用の陰圧閉鎖療法で遅延筋膜閉鎖率が最も高く、瘻孔率が最も低い"}],"note_ja":"ガイドライン作成委員のうち1名（JN）がこの推奨に反対意見を表明している。","note_en":"One panel member (JN) disagreed with this recommendation.","patients_ja":"","patients_en":""},{"q":49,"section":"XII","question_en":"What is the best way to treat bleeding complications associated with AP?","question_ja":"急性膵炎に伴う出血性合併症の最善の治療法は何か？","statements":[{"kind":"rec","text_en":"Angioembolization is recommended to treat arterial pseudoaneurysms and other arterial bleeding complications in patients with AP.","text_ja":"急性膵炎患者の動脈性仮性動脈瘤およびその他の動脈性出血性合併症の治療には、血管塞栓術が推奨される。","strength":"strong","quality":"low"},{"kind":"rec","text_en":"Percutaneous embolization with thrombin or gelfoam and glue under ultrasound guidance or surgical management can be used when angioembolization is not possible or unsuccessful.","text_ja":"血管塞栓術が不可能または不成功の場合は、超音波ガイド下のトロンビンまたはゼルフォームと接着剤による経皮的塞栓術、あるいは外科的治療を用いてよい。","strength":"conditional","quality":"low"}],"summary_ja":["急性膵炎の出血性合併症は0.5〜1.2%とまれだが致死的である。動脈性出血の約60%は仮性動脈瘤、20%は仮性動脈瘤を伴わない仮性嚢胞内出血、20%は小血管からの出血による。仮性動脈瘤は脾動脈（35〜50%）に最も多く、次いで胃十二指腸動脈と膵十二指腸動脈である。","診断は造影3相CTが第一選択で、DSAも用いられる。治療の第一選択は血管塞栓術で、コイル塞栓の成功率は88〜100%と高い。カテーテルが到達できない場合は超音波ガイド下の直接穿刺塞栓術やEUS下塞栓術が選択肢となる。","非外科的止血が失敗した場合、特に壊死性膵炎例では早期手術を行う。びまん性静脈性出血では約3分の1でパッキングを伴う開腹ネクロセクトミーが必要となる。動脈性出血の死亡率は11〜38%で、ショック、手術の必要性、壊死性膵炎が死亡のリスク因子である。"],"summary_en":["Bleeding complicates 0.5 to 1.2% of AP but is life-threatening. About 60% of arterial bleeding comes from pseudoaneurysms, 20% from hemorrhage into pseudocysts without pseudoaneurysm and 20% from small vessels. The splenic artery is the most common site (35 to 50%), followed by gastroduodenal and pancreaticoduodenal arteries.","Triple-phase contrast CT is the imaging method of choice, with DSA as an alternative. Angioembolization is first-line, and coil embolization succeeds in 88 to 100% of cases. Ultrasound-guided percutaneous or EUS-guided embolization helps when the vessel cannot be catheterized.","When non-surgical methods fail, early surgery is advised, especially with necrotizing pancreatitis. About a third of patients with diffuse venous ooze need open necrosectomy with packing. Mortality of arterial bleeding is 11 to 38%, and shock, need for surgery and necrotizing pancreatitis are risk factors."],"evidence":[{"en":"Prospective study (n=363): 9% developed pancreatic hemorrhage at a median of 59 days, risk factors persistent organ failure (HR 2.3), large-bore >20 Fr initial catheter (HR 3.9), >50% necrosis (HR 3.1)","ja":"前向き研究（n=363）：9%が中央値59日で膵出血を発症、リスク因子は持続性臓器不全（HR 2.3）、初回20 Fr超の太径カテーテル（HR 3.9）、50%超の壊死（HR 3.1）"},{"en":"Hemorrhage in patients with PCD reported in 4 to 16%","ja":"PCD施行例の出血は4〜16%と報告"},{"en":"Angioembolization with microcoils successful in 88 to 100% of cases","ja":"マイクロコイルによる血管塞栓術の成功率は88〜100%"},{"en":"Mortality of arterial bleeding complications in AP 11 to 38%","ja":"急性膵炎の動脈性出血性合併症の死亡率は11〜38%"}],"note_ja":"太径カテーテルによる初回ドレナージは出血のリスク因子である。","note_en":"Large-bore catheters for initial drainage are a risk factor for hemorrhage.","patients_ja":"","patients_en":""},{"q":50,"section":"XII","question_en":"How can splanchnic venous (SVT) thrombosis in AP be diagnosed?","question_ja":"急性膵炎における内臓静脈血栓症（SVT）はどのように診断するか？","statements":[{"kind":"gps","text_en":"Contrast-enhanced computed tomography (CECT) is the most appropriate test to diagnose splanchnic venous thrombosis in AP.","text_ja":"急性膵炎における内臓静脈血栓症の診断には、造影CT（CECT）が最も適切な検査である。","strength":null,"quality":null}],"summary_ja":["SVTの診断と範囲の評価は主に造影CTに依存する。ドプラ超音波、CT、MRIの診断精度を比較した前向き研究はない。","膵炎に伴うSVTの頻度は1〜24%と幅があり、前向きコホートの事後解析では432例中97例（22%）に発生した。リスク因子は広範な壊死、感染性膵壊死、再発性急性膵炎、喫煙、高トリグリセリド血症である。","SVTは画像で偶然見つかることが多いが、門脈閉塞による肝不全、上腸間膜静脈閉塞による小腸虚血、左側門脈圧亢進症による胃静脈瘤出血など重大な帰結をもたらすことがある。SVT予防目的の抗凝固療法に関する前向き試験はない。"],"summary_en":["Diagnosis and extent of SVT rely mainly on contrast CT. No prospective study has compared Doppler ultrasound, CT and MRI.","Reported incidence ranges from 1% to 24%, and in a post-hoc analysis of a prospective cohort 97 of 432 patients (22%) developed SVT. Risk factors include extensive necrosis, infected necrosis, recurrent AP, smoking and hypertriglyceridemia.","SVT is often incidental but can cause hepatic failure from portal vein occlusion, small bowel ischemia from superior mesenteric vein occlusion, or variceal bleeding from gastric varices. No prospective trials address prophylactic anticoagulation."],"evidence":[{"en":"Incidence of pancreatitis-induced SVT 1% to 24%","ja":"膵炎関連SVTの頻度は1〜24%"},{"en":"Post-hoc analysis of a prospective cohort: SVT in 97 of 432 patients (22%)","ja":"前向きコホートの事後解析：432例中97例（22%）にSVT"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":51,"section":"XII","question_en":"What is the best way to treat splanchnic venous thrombosis associated with AP?","question_ja":"急性膵炎に伴う内臓静脈血栓症の最善の治療法は何か？","statements":[{"kind":"rec","text_en":"Anticoagulation is not recommended in patients with isolated splenic vein thrombosis. Anticoagulation may be used in more extensive venous thrombosis involving portal or mesenteric vein.","text_ja":"孤立性脾静脈血栓症の患者には抗凝固療法は推奨されない。門脈や腸間膜静脈に及ぶより広範な静脈血栓症では抗凝固療法を用いてもよい。","strength":"conditional","quality":"low"}],"summary_ja":["急性膵炎に伴うSVTに対する予防的または治療的抗凝固療法を支持する決定的なエビデンスはない。早期発見で側副血行路がなければ全例に抗凝固を行うべきとする報告もある。","孤立性脾静脈血栓症では、膵炎の消退や周囲貯留のドレナージに伴い抗凝固なしでも再開通率が高いため、抗凝固は不要である。","16研究698例のシステマティックレビューとメタアナリシスでは、抗凝固による再開通率は44.3%であったが、出血リスクがやや増加し、生存などのアウトカムに差はなかった。門脈や腸間膜静脈に及ぶ例に限って抗凝固を検討する。"],"summary_en":["There is no definitive evidence supporting prophylactic or therapeutic anticoagulation for SVT in AP. One study proposed anticoagulation for all early-detected SVT without collaterals.","Isolated splenic vein thrombosis does not need anticoagulation, as recanalization is frequent once pancreatitis resolves or adjacent collections are drained.","A systematic review and meta-analysis of 16 studies with 698 patients showed a recanalization rate of 44.3% with anticoagulation, a marginal rise in bleeding, and no difference in survival or other outcomes. Anticoagulation should be reserved for thrombosis extending to the portal or mesenteric veins."],"evidence":[{"en":"Systematic review and meta-analysis (16 studies, n=698): recanalization 44.3% with anticoagulation, marginally higher bleeding risk, no difference in survival","ja":"システマティックレビューとメタアナリシス（16研究、n=698）：抗凝固で再開通率44.3%、出血リスクはやや増加、生存に差なし"}],"note_ja":"出血リスクを考慮し、孤立性脾静脈血栓では抗凝固を行わない。","note_en":"Given the bleeding risk, isolated splenic vein thrombosis should not be anticoagulated.","patients_ja":"","patients_en":""},{"q":52,"section":"XII","question_en":"What are the incidence and most common sites of bowel fistulas in AP?","question_ja":"急性膵炎における消化管瘻の頻度と好発部位は何か？","statements":[{"kind":"gps","text_en":"Bowel fistula may occur in 10-15 % of patients with acute necrotizing pancreatitis. The most common sites of bowel fistula are the colon and duodenum, followed by the stomach and small intestine.","text_ja":"消化管瘻は急性壊死性膵炎患者の10〜15%に発生しうる。最も多い部位は結腸と十二指腸で、次いで胃と小腸である。","strength":null,"quality":null}],"summary_ja":["急性膵炎における消化管瘻の頻度と形態は研究により異なるが、壊死性膵炎の1割強にみられる。","部位は結腸と十二指腸が多く、結腸瘻が最多とする報告もある。リスク因子は広範な壊死、感染性膵壊死、血管血栓症、経皮的カテーテルによる医原性損傷である。"],"summary_en":["The incidence and pattern of bowel fistula vary across studies but affect a little over 10% of patients with necrotizing pancreatitis.","The colon and duodenum are the most common sites, with some series reporting the colon as most frequent. Risk factors include extensive necrosis, infected necrosis, vascular thrombosis and percutaneous catheter-related iatrogenic injury."],"evidence":[{"en":"Retrospective study (n=344): bowel fistula in 52 patients (15.1%)","ja":"後ろ向き研究（n=344）：52例（15.1%）に消化管瘻"},{"en":"Cohort (n=928): bowel fistula in 119 patients (12.8%), colonic fistula 60.5% of all fistulas","ja":"コホート（n=928）：119例（12.8%）に消化管瘻、そのうち結腸瘻が60.5%"},{"en":"Prospective cohort (n=896): GI perforation or fistula in 16%, stomach 14%, duodenum 35%, small intestine 11%, colon 40%","ja":"前向きコホート（n=896）：16%に消化管穿孔または瘻、胃14%、十二指腸35%、小腸11%、結腸40%"}],"note_ja":"経皮的カテーテルによる医原性損傷もリスク因子であり、ドレーン留置時に注意する。","note_en":"Percutaneous catheters can cause iatrogenic fistulas, so care is needed during drain placement.","patients_ja":"","patients_en":""},{"q":53,"section":"XII","question_en":"When should bowel fistulas be suspected in AP?","question_ja":"急性膵炎ではどのような場合に消化管瘻を疑うべきか？","statements":[{"kind":"gps","text_en":"Bowel fistulas should be suspected if there is worsening infection, gastrointestinal bleeding, or percutaneous drain showing intestinal/feculent material. Gas in or around the pancreas may also be due to a bowel perforation or fistula.","text_ja":"感染の増悪、消化管出血、経皮的ドレーンからの腸内容や便汁の排出がある場合は消化管瘻を疑うべきである。膵内または膵周囲のガス像も消化管穿孔や瘻孔によることがある。","strength":null,"quality":null}],"summary_ja":["消化管瘻は無症状で偶然見つかることもあるが、症状が出るのは通常後期である。WONが大きい患者ほど瘻孔を生じやすい。","瘻孔は感染の増悪、消化管出血、新規臓器不全の原因となる。特に結腸瘻は膵液体貯留の感染を起こし、新規または増悪する敗血症として現れる。","CTでの貯留内のガス像やドレーンからの便汁排出が手がかりとなる。上部消化管瘻は内視鏡で、下部消化管瘻はCTやドレーンからの造影で診断できる。"],"summary_en":["Bowel fistula may be asymptomatic and incidental, but symptoms usually appear late. Patients with large WON may be more prone to it.","Fistulas can cause worsening infection, GI bleeding and new organ failure. Colonic fistula in particular infects pancreatic fluid collections and presents as new or worsening sepsis.","Gas bubbles in collections on CT or feculent drain output are clues. Upper GI fistula can be diagnosed endoscopically, and lower GI fistula by CT or contrast study through the drain."],"evidence":[{"en":"Pooled analysis (n=97): median interval from symptom onset to detection of colonic fistula 25 days (range 1 to 55)","ja":"プール解析（n=97）：症状出現から結腸瘻診断までの期間中央値25日（範囲1〜55日）"}],"note_ja":"感染性膵壊死の経過中のガス像は必ずしも感染によるものではなく、瘻孔も鑑別に挙げる。","note_en":"Gas in a collection is not always due to infection, and fistula belongs in the differential.","patients_ja":"","patients_en":""},{"q":54,"section":"XII","question_en":"What is the optimal strategy for treating bowel fistulas associated with AP?","question_ja":"急性膵炎に伴う消化管瘻の最適な治療戦略は何か？","statements":[{"kind":"rec","text_en":"Upper gastrointestinal fistula do not require treatment and may be beneficial by providing internal drainage of PFCs, they usually close spontaneously over time.","text_ja":"上部消化管瘻は治療を要さず、膵液体貯留の内瘻化として有益な場合もある。通常は時間とともに自然閉鎖する。","strength":"conditional","quality":"low"},{"kind":"rec","text_en":"For colonic fistula, conservative management with control of infection may suffice, but surgical treatment is required if there are signs of persistent or worsening infection or peritonitis or fecal discharge from a peripancreatic collection.","text_ja":"結腸瘻では感染制御を伴う保存的治療で十分な場合もあるが、感染の持続や増悪、腹膜炎、膵周囲貯留からの便汁排出がみられる場合は外科的治療が必要である。","strength":"conditional","quality":"low"}],"summary_ja":["胃瘻や十二指腸瘻などの上部消化管瘻の多くは経過中に自然閉鎖する。感染性膵壊死121例のコホートでは10例に十二指腸瘻が生じ、うち9例が感染制御のみで自然閉鎖した。","結腸瘻は十分なドレナージと栄養療法による保存的治療が第一選択で、手術はバックアップとなる。報告により手術率は大きく異なり、保存的に管理できる例も多い。","持続または増悪する感染、腹膜炎、貯留からの便汁排出があれば、回腸瘻や人工肛門造設などの外科的治療を行う。"],"summary_en":["Most upper GI fistulas, such as gastric and duodenal fistulas, close spontaneously. In a cohort of 121 patients with infected necrosis, 10 developed duodenal fistula and 9 closed spontaneously with infection control.","For colonic fistula, conservative treatment with adequate drainage and nutritional support is first choice, with surgery as backup. Reported surgery rates vary widely, and many patients can be managed conservatively.","Persistent or worsening infection, peritonitis or feculent discharge from a collection calls for surgery such as ileostomy or colostomy."],"evidence":[{"en":"Cohort of 121 infected necrosis patients: 10 duodenal fistulas, 9 closed spontaneously with infection control","ja":"感染性膵壊死121例のコホート：十二指腸瘻10例、うち9例が感染制御で自然閉鎖"},{"en":"Pooled analysis (n=97): 36 developed colonic fistula, only 9 needed surgery for it","ja":"プール解析（n=97）：36例が結腸瘻を発症、手術を要したのは9例のみ"},{"en":"Study of 72 patients with colonic fistula and infected necrosis: 47 (65%) ileostomy or colostomy, 25 (35%) conservative","ja":"結腸瘻と感染性膵壊死の72例：47例（65%）が回腸瘻または人工肛門、25例（35%）が保存的治療"},{"en":"Another study: 59% of patients with colonic fistula required surgery","ja":"別の研究：結腸瘻患者の59%が手術を要した"}],"note_ja":"本文の推奨は「do not require treatment」、Table 1は「generally do not require treatment」と表現が異なる。","note_en":"The body text says upper GI fistulas 'do not require treatment', whereas Table 1 says they 'generally do not require treatment'.","patients_ja":"患者側からは、まれな合併症も含めて本人と家族に十分な情報提供をしてほしいという要望がある。救命のための処置に集中するあまり、何をするのかの説明が後回しにならないよう求めている。","patients_en":"Patients ask that they and their families be properly informed about complications and their management. Rarer, life-threatening complications should not lead clinicians to skip explaining what is planned."},{"q":55,"section":"XIII","question_en":"Do the criteria for the diagnosis of AP in children differ from those for adults?","question_ja":"小児の急性膵炎の診断基準は成人と異なるか？","statements":[{"kind":"gps","text_en":"The criteria for diagnosing AP in children are the same as in adults, but these criteria may be less accurate in children.","text_ja":"小児の急性膵炎の診断基準は成人と同じであるが、小児ではこれらの基準の精度が低い可能性がある。","strength":null,"quality":null}],"summary_ja":["小児でも成人と同じく3項目中2項目を満たせば急性膵炎と診断する。ただし小児特有の注意点がある。","腹痛は主症状として成人ほど一般的ではなく、報告により29〜100%と幅がある。3歳未満では腹痛を呈したのは29%のみで、不機嫌を腹痛の代替とみなしても46%にとどまった。発熱が主訴となる例もある。","リパーゼとアミラーゼは発達とともに発現が増えるため乳児では低値である。このため標準的な診断基準を小児、特に乳幼児に適用すると精度が下がる可能性がある。"],"summary_en":["As in adults, AP in children is diagnosed when two of three criteria are met, but there are caveats.","Abdominal pain is less consistently the main symptom, ranging from 29% to 100% across reports. Among children under 3 years only 29% presented with abdominal pain, and counting irritability as a surrogate raised this only to 46%. Fever may be the presenting complaint.","Lipase and amylase have a developmental expression pattern and are low in infancy. Standard criteria may therefore be less accurate in children, especially infants."],"evidence":[{"en":"Abdominal pain as predominant symptom in children ranges from 29% to 100%","ja":"小児で腹痛が主症状となる割合は29〜100%"},{"en":"Children under 3 years: abdominal pain in 29%, 46% if irritability counted as pain, 43% in another study","ja":"3歳未満：腹痛は29%、不機嫌を含めても46%、別の研究では43%"},{"en":"Fever was the presenting complaint in 40% of young children","ja":"年少児の40%で発熱が主訴"}],"note_ja":"乳幼児では膵酵素が生理的に低値であり、酵素値のみで否定しない。","note_en":"Pancreatic enzymes are physiologically low in infants, so normal values do not exclude AP.","patients_ja":"","patients_en":""},{"q":56,"section":"XIII","question_en":"Does the etiology of AP differ between children and adults?","question_ja":"小児と成人で急性膵炎の成因は異なるか？","statements":[{"kind":"gps","text_en":"Etiologies of AP are diverse and differ substantially between children and adults. Most cases are idiopathic. Gallstone disease, multi-system illnesses, medications, viral infection, developmental abnormalities, trauma and genetic causes are common etiologies in children.","text_ja":"急性膵炎の成因は多様であり、小児と成人で大きく異なる。大部分は特発性である。胆石症、多臓器にわたる全身疾患、薬剤、ウイルス感染、発生異常、外傷、遺伝的要因が小児における一般的な成因である。","strength":null,"quality":null}],"summary_ja":["成人との最大の違いはアルコール性膵炎がほとんどないことである。一方で胆石症は想定以上に多く、小児例の約30%を占めうる。","全身性・多臓器疾患に伴うものが最大40%、遺伝的リスク因子を持つものが約20%と報告されている。L-アスパラギナーゼなど成人ではあまり使わない薬剤による膵炎も重要な位置を占める。","膵管癒合不全、膵・胆管合流異常、輪状膵、先天性胆道拡張症などの構造異常は小児期に初めて見つかることが多いが、膵炎との直接の因果関係は確立していない。かつて最多とされた外傷は、近年の報告では10%以下に減っている。","遺伝学的評価は、18歳未満で複数回の膵炎発作がある場合や慢性膵炎の所見がある場合に行うのが通常である。"],"summary_en":["The main difference from adults is that alcohol-related pancreatitis is rare in children. Gallstone disease is more frequent than once believed and may account for about 30% of pediatric cases.","Systemic or multi-system illness explains up to 40% of cases, and nearly 20% of children carry genetic risk factors. Drug-induced pancreatitis, often from agents such as L-asparaginase that are uncommon in adult practice, is another relevant cause.","Structural anomalies such as pancreas divisum, pancreaticobiliary maljunction, annular pancreas and choledochal cyst are usually first found in childhood, but whether they directly cause pancreatitis is uncertain. Trauma, once considered the leading cause, now accounts for 10% or less in recent series.","Genetic testing is generally reserved for children with more than one episode or with features of chronic pancreatitis before age 18."],"evidence":[{"en":"Gallstone disease may account for about 30% of pediatric AP","ja":"胆石症は小児急性膵炎の約30%を占めうる"},{"en":"Systemic or multi-system illness in up to 40% of cases, genetic risk factors in almost 20%","ja":"全身性・多臓器疾患が最大40%、遺伝的リスク因子が約20%"},{"en":"Trauma accounts for 10% or less of cases in recent series","ja":"外傷は近年の報告で10%以下"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":57,"section":"XIII","question_en":"How should severity be assessed in children with AP?","question_ja":"小児急性膵炎の重症度はどのように評価すべきか？","statements":[{"kind":"gps","text_en":"Severe AP in children is defined if there is a presence of persistent organ failure similar to adults but utilizing the International Pediatric Sepsis Consensus definitions of organ failure.","text_ja":"小児の重症急性膵炎は、成人と同様に持続性臓器不全の存在によって定義するが、臓器不全の判定には International Pediatric Sepsis Consensus の定義を用いる。","strength":null,"quality":null}],"summary_ja":["NASPGHAN の膵臓委員会は、改訂アトランタ分類に準じて小児急性膵炎を軽症・中等症・重症に分類した。成人との違いは、臓器不全の評価に modified Marshall スコアではなく International Pediatric Sepsis Consensus の定義を用いる点である。","SIRS は臓器不全のリスクを高めるため小児でも評価すべきであり、白血球数、心拍数、呼吸数に年齢別のカットオフを設けた小児用 SIRS 基準を使う。","重症例は成人より少なく、死亡率は成人同様5%未満である。ただし急性リンパ性白血病の治療に用いる L-アスパラギナーゼによる膵炎は例外で、中等症以上となる割合が高い。"],"summary_en":["The NASPGHAN Pancreas Committee adapted the revised Atlanta classification (mild, moderately severe, severe) for children. The key difference is that organ failure is graded by the International Pediatric Sepsis Consensus definitions rather than the modified Marshall score.","SIRS raises the risk of organ failure and should be assessed using pediatric SIRS criteria with age-based thresholds for leukocyte count, heart rate and respiratory rate.","Severe disease is less common than in adults, and overall mortality is below 5%. Asparaginase-associated pancreatitis in acute lymphoblastic leukemia is an exception, with a large share of cases being at least moderately severe."],"evidence":[{"en":"Overall mortality of pediatric AP is below 5%","ja":"小児急性膵炎の全体死亡率は5%未満"},{"en":"Pooled raw data from 26 ALL trials: one-quarter to two-thirds of asparaginase-associated pancreatitis was at least moderately severe","ja":"ALL の26試験の個票統合解析：アスパラギナーゼ関連膵炎の4分の1から3分の2が中等症以上"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":58,"section":"XIII","question_en":"What is the optimal imaging modality to diagnose AP in children?","question_ja":"小児急性膵炎の診断に最適な画像検査は何か？","statements":[{"kind":"gps","text_en":"Trans-abdominal ultrasonography (USG) is the preferred first-line imaging modality in children, while CT and MRI/MRCP should be reserved for patients in whom USG is not diagnostic and ideally delayed at least 96 hours after the onset of symptoms.","text_ja":"小児では経腹壁超音波検査（US）が第一選択の画像検査である。CT および MRI/MRCP は US で診断がつかない患者に限定し、可能であれば症状発現から少なくとも96時間以降に行う。","strength":null,"quality":null}],"summary_ja":["小児で画像検査を行う目的は、膵炎の診断と他疾患の除外、危険因子の同定、合併症の評価である。","US は放射線被曝の累積を避けられ、腹壁が薄い小児では描出もしやすい。診断が不確かな場合や処置を予定する場合に CT または MRI を追加する。","原因不明の膵炎でも、初回発作だけで膵管癒合不全などの構造異常を精査する必要はない。再発した場合には MRCP を考慮する。"],"summary_en":["Imaging in children aims to confirm pancreatitis, exclude other causes of pain, identify risk factors and assess complications.","Ultrasound avoids cumulative radiation and works well because children usually have a thin abdominal wall. CT or MRI is added when the diagnosis is uncertain or an intervention is planned.","A search for structural anomalies is not needed after a single unexplained episode. MRCP may be advised when pancreatitis recurs."],"evidence":[],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":59,"section":"XIII","question_en":"Does the optimal therapy for AP in children differ from that in adults?","question_ja":"小児急性膵炎の最適な治療は成人と異なるか？","statements":[{"kind":"rec","text_en":"Therapies for AP, including fluid resuscitation, nutrition support, analgesics, and the use of antibiotics, are similar in children as those for adults.","text_ja":"輸液蘇生、栄養療法、鎮痛薬、抗菌薬の使用を含む急性膵炎の治療は、小児でも成人と同様である。","strength":"strong","quality":"low"}],"summary_ja":["小児膵炎を対象とした治療試験は乏しく、成人のエビデンスを準用しているのが現状である。","輸液は維持量の1.5〜2倍で行うと ICU 入室の減少や入院期間短縮につながる可能性がある。最近の多施設 RCT では、診断後48時間以内の乳酸リンゲル液投与で入院期間が短縮した。","栄養は耐えられれば早期に経腸で開始する。24〜48時間以内に経腸栄養を始めた小児は軽症で経過しやすい。72時間以内に経口摂取できなければ経鼻胃管または経鼻空腸管による経管栄養を行う。","鎮痛は非麻薬性鎮痛薬から始め、必要に応じてオピオイドを用いる。抗菌薬は全身感染、胆管炎、感染性膵壊死が疑われる場合に限る。"],"summary_en":["Pediatric treatment trials are scarce, so practice largely follows adult evidence.","Fluids at 1.5 to 2 times maintenance may reduce ICU admission and shorten hospital stay. A recent multicenter randomized trial found that lactated Ringer's given within 48 hours of diagnosis was linked to a shorter stay.","Enteral feeding should start as soon as tolerated. Children fed within 24 to 48 hours tend to have a milder course. If they cannot eat by 72 hours, nasogastric or nasojejunal tube feeding is advised.","Analgesia starts with non-narcotic agents, adding opioids when needed. Antibiotics are given only for suspected systemic infection, cholangitis or infected necrosis."],"evidence":[{"en":"Fluid resuscitation at 1.5 to 2 times maintenance may reduce ICU admission and length of stay","ja":"維持量の1.5〜2倍の輸液で ICU 入室減少と入院期間短縮の可能性"},{"en":"Multicenter RCT in children: lactated Ringer's within 48 hours of diagnosis associated with shorter hospital stay","ja":"小児の多施設 RCT：診断後48時間以内の乳酸リンゲル液で入院期間短縮"},{"en":"Enteral feeding within 24 to 48 hours associated with a milder course","ja":"24〜48時間以内の経腸栄養開始で軽症の経過と関連"}],"note_ja":"ブドウ糖含有晶質液を初期輸液に推奨する意見もあるが、小児を対象とした輸液試験はまだ少ない。","note_en":"Dextrose-containing crystalloid has been suggested as the initial fluid, but pediatric fluid trials remain limited.","patients_ja":"","patients_en":""},{"q":60,"section":"XIII","question_en":"What are the complications of AP that occur in children?","question_ja":"小児急性膵炎で生じる合併症は何か？","statements":[{"kind":"gps","text_en":"The complications of AP in children are similar to those in adults, with similar interventional management approaches.","text_ja":"小児急性膵炎の合併症は成人と同様であり、インターベンションによる管理方針も同様である。","strength":null,"quality":null}],"summary_ja":["NASPGHAN 分類では、合併症は中等症または重症の膵炎に伴うものとされる。","胆石性膵炎の小児では、胆管炎を合併した場合や、全身状態が安定していて総胆管結石と持続する黄疸がある場合に早期 ERCP の適応となる。合併症のない胆石性膵炎では同一入院中の胆嚢摘出術が推奨され、重症例では合併症の処理後に行う。","膵周囲液体貯留の多くは自然に消退する。症状がある、または消退しない場合は EUS ガイド下の内瘻化が望ましい。"],"summary_en":["Under the NASPGHAN classification, complications occur with moderately severe or severe disease.","In biliary pancreatitis, early ERCP is indicated for cholangitis or for choledocholithiasis with ongoing jaundice once the child is stable. Cholecystectomy is advised during the index admission for uncomplicated cases and after complications are handled in severe cases.","Many pancreatic fluid collections resolve on their own. Symptomatic or persistent collections are best drained internally under EUS guidance."],"evidence":[],"note_ja":"","note_en":"","patients_ja":"患者側は、小児でも外傷を一般的な成因に含めるべきとし、重症度評価には成人と同じ SIRS、CRP、IL-6 などを使えると考えている。鎮痛や輸液量など、小児と成人で治療が異なる点を明示してほしいと求めている。","patients_en":"Patients list trauma as a common cause in children and feel that the same severity tests as in adults, such as SIRS, CRP and IL-6, could be used. They ask that treatment differences between children and adults, such as analgesia and fluid needs, be spelled out."},{"q":61,"section":"XIII","question_en":"When should AP due to hyperparathyroidism be suspected?","question_ja":"副甲状腺機能亢進症による急性膵炎はどのような場合に疑うべきか？","statements":[{"kind":"gps","text_en":"Acute pancreatitis due to hyperparathyroidism should be suspected in patients with elevated calcium levels and those with other clinical features suggestive of hyperparathyroidism.","text_ja":"血清カルシウム値が上昇している患者、および副甲状腺機能亢進症を示唆するその他の臨床所見を有する患者では、副甲状腺機能亢進症による急性膵炎を疑うべきである。","strength":null,"quality":null}],"summary_ja":["原発性副甲状腺機能亢進症（PHPT）を膵炎の原因として捉えるには、意識して疑うことが必要である。腎結石、腎機能障害、骨粗鬆症や病的骨折などの既往が手がかりになる。","膵炎の急性期には、特に重症例でカルシウム値が正常化していることがあるため、疑いが残る場合は回復後に再検する。高カルシウム血症の判定にはアルブミン補正カルシウムまたはイオン化カルシウムを用いる。","PHPT は高カルシウム血症の最多原因だが、急性膵炎の原因としてはまれで1%未満である。地域住民を対象とした研究では PHPT 患者で膵炎の発生は増えておらず、因果関係そのものに疑問も残る。"],"summary_en":["Recognizing primary hyperparathyroidism (PHPT) as a cause requires active suspicion. A history of renal stones, renal dysfunction, osteoporosis or pathological fractures can be a clue.","Calcium may be normal during the attack, especially in severe disease, so it should be rechecked after recovery when suspicion persists. Use albumin-adjusted or ionized calcium to confirm hypercalcemia.","PHPT is the commonest cause of hypercalcemia but explains fewer than 1% of AP cases. A population-based study found no increase in AP among community patients with PHPT, so a causal link is not certain."],"evidence":[{"en":"PHPT underlies fewer than 1% of AP cases","ja":"PHPT が背景にある急性膵炎は1%未満"},{"en":"Population-based study: AP incidence not increased in community patients with PHPT","ja":"住民ベース研究：PHPT 患者で急性膵炎の発生率は増加せず"}],"note_ja":"Table 1 では「primary hyperparathyroidism（PHPT）」と記載されており、本文の推奨文とは表現がわずかに異なる。","note_en":"Table 1 words this statement as primary hyperparathyroidism (PHPT), slightly different from the body text.","patients_ja":"","patients_en":""},{"q":62,"section":"XIII","question_en":"What is the optimal testing approach to document AP due to hyperparathyroidism?","question_ja":"副甲状腺機能亢進症による急性膵炎を確認するための最適な検査方法は何か？","statements":[{"kind":"gps","text_en":"Patients with AP and elevated serum calcium levels should be further evaluated by measuring serum parathyroid hormone (PTH). An inappropriately elevated serum PTH confirms the diagnosis of PHPT.","text_ja":"血清カルシウム値が上昇している急性膵炎患者では、血清副甲状腺ホルモン（PTH）を測定して追加評価を行うべきである。血清 PTH が不適切に高値であれば PHPT と確定診断できる。","strength":null,"quality":null}],"summary_ja":["PHPT の診断は、高カルシウム血症があるにもかかわらず PTH が抑制されていないことに基づく。","PTH は第2世代（intact PTH）または第3世代（whole PTH）アッセイで測定でき、両者の診断性能は同等である。","ビタミンD欠乏でも PTH は上昇するため、PHPT を疑う全例で 25(OH)D を測定する。高カルシウム血症下で PTH が正常範囲にあることも「不適切に高い」と解釈し、専門医による評価につなげる。"],"summary_en":["PHPT is diagnosed when PTH is not suppressed despite hypercalcemia.","PTH can be measured with a second-generation (intact) or third-generation (whole) assay, and both perform similarly.","Vitamin D deficiency also raises PTH, so 25(OH)D should be measured in every suspected case. A normal PTH in the face of high calcium is inappropriately high and warrants specialist evaluation."],"evidence":[],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":63,"section":"XIII","question_en":"What is the optimal strategy for treating patients with PHPT-related AP?","question_ja":"PHPT 関連急性膵炎の患者に対する最適な治療戦略は何か？","statements":[{"kind":"gps","text_en":"Standard treatment is recommended for PHPT-related AP. In addition, patients with serum calcium levels >14 mg/dL or hypercalcemia accompanied by altered sensorium require emergent measures to reduce serum calcium levels, including volume expansion with isotonic saline (and not lactated Ringer's solution), and avoidance of calcium supplements and Vitamin D.","text_ja":"PHPT 関連急性膵炎には標準治療を推奨する。加えて、血清カルシウム値が14 mg/dL を超える患者、または意識変容を伴う高カルシウム血症の患者では、血清カルシウム値を下げるための緊急処置が必要である。これには等張食塩水（乳酸リンゲル液ではない）による容量負荷、カルシウム製剤およびビタミンDの回避が含まれる。","strength":null,"quality":null}],"summary_ja":["膵炎そのものの治療は他の成因と同じである。生命を脅かす高カルシウム血症への対応は、消化器内科、集中治療医、内分泌内科の連携で行う。","乳酸リンゲル液はカルシウムを含むため、容量負荷には等張食塩水を使う。カルシウム製剤とビタミンDは避ける。","多くの患者は高カルシウム血症による急性症状がなく、急いでカルシウムを下げる必要はない。膵炎が落ち着いた後、再発と長期的な高カルシウム血症の害を防ぐために副甲状腺摘出術などの根治治療を行う。手術でカルシウムと PTH は正常化し、膵炎の再発を防げる。"],"summary_en":["The pancreatitis itself is managed as for any other cause. Life-threatening hypercalcemia needs joint care by gastroenterologists, intensivists and endocrinologists.","Volume expansion should use isotonic saline because lactated Ringer's contains calcium. Calcium supplements and vitamin D should be stopped.","Most patients have no acute symptoms from hypercalcemia and do not need urgent lowering. After recovery, definitive treatment such as parathyroidectomy normalizes calcium and PTH and prevents further attacks."],"evidence":[],"note_ja":"通常の急性膵炎では乳酸リンゲル液が推奨されるが、高カルシウム血症を伴う場合は生理食塩水を選ぶ点に注意する。","note_en":"Although lactated Ringer's is the usual fluid in AP, isotonic saline is preferred when hypercalcemia is present.","patients_ja":"","patients_en":""},{"q":64,"section":"XIII","question_en":"What is the optimal medical therapy to reduce triglyceride levels in hypertriglyceridemia-associated AP?","question_ja":"高トリグリセリド血症性膵炎（HTGP）でトリグリセリド値を下げるための最適な薬物療法は何か？","statements":[{"kind":"rec","text_en":"Besides the standard care for AP, Insulin is recommended in diabetics and may be considered in non-diabetic patients as the first-line therapy to reduce serum triglyceride (TG) levels for hypertriglyceridemia-associated acute pancreatitis (HTGP).","text_ja":"高トリグリセリド血症性急性膵炎（HTGP）では、急性膵炎の標準治療に加え、血清トリグリセリド（TG）値を下げる第一選択治療として、糖尿病患者にはインスリンを推奨し、非糖尿病患者でもインスリンを考慮してよい。","strength":"strong","quality":"moderate"},{"kind":"rec","text_en":"Short-term (<3 days) use of low molecular weight heparin (LMWH) may also be considered.","text_ja":"低分子量ヘパリン（LMWH）の短期間（3日未満）使用も考慮してよい。","strength":"conditional","quality":"moderate"}],"summary_ja":["HTGP は急性膵炎の最大10%を占め、中国では第2位の成因である。他の成因に比べ、SIRS、持続性臓器不全、局所合併症、死亡が多く、重症化しやすい。","機序として、カイロミクロンによる膵毛細血管の虚血とアシドーシス、脂肪分解で生じた遊離脂肪酸による腺房細胞障害が想定されている。","初期治療は他の膵炎と同じで、絶食と輸液だけでも TG は下がる。特異的治療ではインスリンとヘパリンが最も有効とするメタ解析がある。インスリンはリポ蛋白リパーゼ（LPL）を活性化し、非糖尿病患者にも安全に使えるとする報告がある。","ヘパリンの長期単独使用は LPL を枯渇させ TG のリバウンドを招くため、短期間にとどめる。出血傾向や腎不全など禁忌がある場合はヘパリン類を使わない。"],"summary_en":["HTGP causes up to 10% of AP and is the second leading cause in China. It tends to be more severe, with more SIRS, persistent organ failure, local complications and deaths than other etiologies.","Proposed mechanisms are chylomicron-related capillary ischemia with acidosis and acinar injury from free fatty acids released by lipolysis.","Initial care is the same as for other causes, and fasting with IV fluids alone lowers TG. Meta-analyses point to insulin and heparin as the most effective specific therapies. Insulin activates lipoprotein lipase (LPL) and appears safe even without diabetes.","Prolonged heparin alone can deplete LPL and cause TG rebound, so use should be brief. Heparins are avoided with bleeding disorders or renal failure."],"evidence":[{"en":"HTGP accounts for up to 10% of AP cases","ja":"HTGP は急性膵炎の最大10%"},{"en":"Systematic review and meta-analysis: insulin and/or heparin are the most effective specific therapy","ja":"系統的レビュー・メタ解析：インスリンおよび/またはヘパリンが最も有効な特異的治療"},{"en":"One comparative study: similar TG reduction with insulin and conservative treatment","ja":"比較研究1件：インスリンと保存的治療で TG 低下は同程度"},{"en":"RCT: insulin/LMWH had lower organ failure incidence than plasmapheresis, without significant TG rebound","ja":"RCT：インスリン/LMWH は血漿交換より臓器不全の発生が少なく、有意な TG リバウンドなし"}],"note_ja":"インスリンとヘパリンの併用は症例集積で相乗効果が報告され、重症 HTGP の第一選択として用いられうる。","note_en":"Case series report a synergistic effect of insulin plus heparin, which may be used first line in severe HTGP.","patients_ja":"","patients_en":""},{"q":65,"section":"XIII","question_en":"Should plasmapheresis be used for HTGP?","question_ja":"HTGP に血漿交換を行うべきか？","statements":[{"kind":"rec","text_en":"In patients with HTGP, plasmapheresis may be considered in case of persistent organ failure with high TG levels, particularly in patients with acute renal failure.","text_ja":"HTGP 患者で TG 高値を伴う持続性臓器不全がある場合、特に急性腎不全を伴う患者では、血漿交換を考慮してよい。","strength":"conditional","quality":"low"}],"summary_ja":["血漿交換は TG を速やかに下げるが、臨床転帰の改善は示されていない。系統的レビューでも明確な利益は確認されず、多施設前向きコホート研究では臓器不全の発生や持続期間は減らず、ICU 滞在が延びた。","腎不全を伴う重症 HTGP では利益が見込まれ、血液濾過との併用も可能である。抗凝固には出血リスクを抑えるためヘパリンではなくクエン酸ナトリウムを用いる。","高コスト、侵襲性、不確かな効果、有害事象を考えると、適応を絞って使うべき治療である。"],"summary_en":["Plasmapheresis lowers TG quickly, but better clinical outcomes have not been shown. A systematic review found no clear benefit, and a multicenter prospective cohort found no reduction in organ failure but a longer ICU stay.","Patients with severe HTGP and renal failure are the most likely to benefit, and plasmapheresis can be combined with hemofiltration. Sodium citrate rather than heparin should be used for anticoagulation to limit bleeding.","Given cost, invasiveness, uncertain benefit and adverse events, it should be used selectively."],"evidence":[{"en":"Case-control study: double filtration plasmapheresis shortened hospitalization when TG >5000 mg/dL","ja":"症例対照研究：TG 5000 mg/dL 超で二重濾過血漿交換（DFPP）により入院期間短縮"},{"en":"Multicenter prospective cohort: no reduction in organ failure incidence or duration, longer ICU stay","ja":"多施設前向きコホート：臓器不全の発生・持続は減らず、ICU 滞在は延長"},{"en":"Prospective trial: short-term high-volume hemofiltration may reduce complications and mortality in severe HTGP","ja":"前向き試験：短期高容量血液濾過（HVHF）で重症 HTGP の合併症と死亡が減る可能性"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":66,"section":"XIII","question_en":"What is the optimal nutritional approach for patients with hypertriglyceridemia-associated AP?","question_ja":"HTGP 患者に対する最適な栄養管理は何か？","statements":[{"kind":"rec","text_en":"Patients with HTGP should fast for the first 48 hours, followed by an oral low-fat soft diet. If oral intake is not tolerated, enteral nutrition (EN) via nasogastric or nasojejunal tube should be initiated.","text_ja":"HTGP 患者は最初の48時間は絶食とし、その後は経口の低脂肪軟食を開始する。経口摂取が困難な場合は、経鼻胃管または経鼻空腸管による経腸栄養（EN）を開始する。","strength":"strong","quality":"low"},{"kind":"rec","text_en":"If parenteral nutrition is required, intravenous fat emulsion should not be given in patients with TG ≥ 400 mg/dL","text_ja":"静脈栄養が必要な場合、TG 400 mg/dL 以上の患者には脂肪乳剤を投与すべきではない。","strength":"strong","quality":"low"}],"summary_ja":["48時間の絶食で多くの患者の TG は速やかに低下する。絶食中は TG に富むカイロミクロンが速やかに代謝され、低カロリー輸液により肝臓からの VLDL 分泌も減る。","その後は重症度に応じて低脂肪の経口食または経管栄養に移行する。","静脈栄養を行う場合は脂肪乳剤を一時的に抜くと TG が有意に下がる。静脈栄養中の許容 TG は400 mg/dL 未満であり、これ以上なら脂肪乳剤を中止する。"],"summary_en":["A 48-hour fast lowers TG rapidly in most patients. TG-rich chylomicrons are cleared quickly during fasting, and low-calorie IV infusion reduces hepatic VLDL output.","A low-fat oral diet or tube feeding then follows, depending on severity.","During parenteral nutrition, briefly withholding the lipid component lowers TG significantly. The acceptable TG on PN is below 400 mg/dL, and lipid emulsion should be stopped at or above that level."],"evidence":[{"en":"Retrospective study in severe HTG: IV insulin plus 24-hour fasting lowered TG by 87% vs 40% with insulin alone","ja":"重症 HTG の後ろ向き研究：静注インスリン＋24時間絶食で TG 87%低下、インスリン単独では40%低下"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":67,"section":"XIII","question_en":"What level of TGs should be maintained after discharge to prevent relapse of hypertriglyceridemic associated AP?","question_ja":"HTGP の再発予防のため、退院後に TG 値をどの程度に維持すべきか？","statements":[{"kind":"rec","text_en":"The levels of serum TG should be maintained below 500 mg/dL after discharge to prevent relapse of HTGP.","text_ja":"HTGP の再発を予防するため、退院後の血清 TG 値は500 mg/dL 未満に維持すべきである。","strength":"conditional","quality":"low"}],"summary_ja":["退院後も TG を継続的に500 mg/dL 未満に保つことが再発予防の目標となる。大規模コホートでは、TG が500 mg/dL 以上で推移した患者は膵炎発症リスクが高かった。","HTGP 患者の前向きコホートでは、12か月と18か月の累積再発率がそれぞれ8%と22%であり、再発は少なくない。","フェノフィブラートが最も広く使われるが、膵炎再発予防効果を示した臨床試験はない。家族性高 TG 血症で TG が著明に高い患者では、APOC3 を標的とするアンチセンス核酸（volanesorsen、olezarsen）が膵炎の再発を減らしたと報告されている。"],"summary_en":["TG should be kept consistently below 500 mg/dL after discharge. In a large cohort, patients whose TG stayed at or above 500 mg/dL had more pancreatitis episodes.","Relapse is common: a prospective HTGP cohort showed cumulative recurrence of 8% at 12 months and 22% at 18 months.","Fenofibrate is the most used agent, but no trial has shown that it prevents recurrence. In familial hypertriglyceridemia with very high TG, antisense oligonucleotides against APOC3 (volanesorsen, olezarsen) have reduced recurrent pancreatitis."],"evidence":[{"en":"Cohort of 41,210 patients with severe HTG: higher pancreatitis risk when TG remained ≥500 mg/dL","ja":"重症 HTG 41,210例のコホート：TG 500 mg/dL 以上が続くと膵炎リスク上昇"},{"en":"Study of 3091 individuals with severe HTG: 171 (6%) developed AP, TG >500 mg/dL independently associated with recurrence","ja":"重症 HTG 3091例の研究：171例（6%）が急性膵炎を発症、TG 500 mg/dL 超は再発の独立因子"},{"en":"Prospective cohort of 317 HTGP patients: cumulative recurrence 8% at 12 months and 22% at 18 months","ja":"HTGP 317例の前向きコホート：累積再発率は12か月で8%、18か月で22%"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":68,"section":"XIII","question_en":"What is the recommendation for peri-procedure intravenous fluids to prevent post-ERCP-pancreatitis (PEP)?","question_ja":"ERCP 後膵炎（PEP）を予防するための周術期輸液に関する推奨は何か？","statements":[{"kind":"rec","text_en":"Moderate intravenous fluids with Lactated Ringer's solution should be given to patients undergoing ERCP during the periprocedural period in addition to rectal NSAIDs to prevent PEP.","text_ja":"PEP 予防のため、ERCP を受ける患者には周術期に NSAIDs 坐剤に加えて乳酸リンゲル液による中等量の輸液を行うべきである。","strength":"strong","quality":"moderate"}],"summary_ja":["周術期の輸液は PEP の発生や重症化を抑える可能性がある。後ろ向き研究で中等症以上の PEP の減少と入院期間短縮が示され、その後の RCT とメタ解析でも効果が確認された。","乳酸リンゲル液とインドメタシン坐剤の併用は、プラセボや生理食塩水と比べて PEP と再入院を減らした RCT がある。","一方、多施設 FLUYT 試験では NSAIDs 坐剤を併用する条件下で積極的輸液は標準輸液に勝らなかった。最適量は不明だが、ERCP 中に少なくとも1 L を投与する施設が多い。"],"summary_en":["Periprocedural fluids may prevent PEP or reduce its severity. Retrospective studies linked fluids to fewer moderate to severe PEP cases and shorter stays, and later RCTs and meta-analyses confirmed the benefit.","One RCT showed that lactated Ringer's plus rectal indomethacin lowered PEP and readmissions compared with placebo and normal saline.","The multicenter FLUYT trial, however, found no added benefit of aggressive over standard fluids when rectal NSAIDs were given. The ideal volume is unknown, but many centers give at least 1 L during ERCP."],"evidence":[{"en":"Two retrospective studies: periprocedural IV fluids protective against moderate to severe PEP and shorter hospital stay","ja":"後ろ向き研究2件：周術期輸液は中等症以上の PEP を抑制し、入院期間を短縮"},{"en":"RCT: lactated Ringer's plus rectal indomethacin reduced PEP and readmission vs placebo and normal saline","ja":"RCT：乳酸リンゲル液＋インドメタシン坐剤はプラセボ・生理食塩水に比べ PEP と再入院を減少"},{"en":"FLUYT trial (multicenter): aggressive fluids no better than standard fluids on top of rectal NSAIDs","ja":"FLUYT 試験（多施設）：NSAIDs 坐剤併用下で積極的輸液は標準輸液に優らず"}],"note_ja":"推奨は「積極的」ではなく「中等量」の輸液である。心不全や腎不全など体液過剰のリスクがある患者では量を調整する。","note_en":"The recommendation is for moderate, not aggressive, fluids. Volume should be adjusted in patients at risk of fluid overload.","patients_ja":"","patients_en":""},{"q":69,"section":"XIII","question_en":"What are the indications for rectal NSAIDs to prevent post-ERCP pancreatitis?","question_ja":"ERCP 後膵炎予防のための NSAIDs 坐剤の適応は何か？","statements":[{"kind":"rec","text_en":"Prophylactic rectal indomethacin or diclofenac is recommended for patients undergoing ERCP who are at high risk of post-ERCP pancreatitis.","text_ja":"ERCP 後膵炎の高リスク患者で ERCP を行う場合、予防的にインドメタシンまたはジクロフェナクの坐剤を投与することを推奨する。","strength":"strong","quality":"high"},{"kind":"rec","text_en":"Prophylactic rectal indomethacin or diclofenac is recommended for average-risk patients undergoing ERCP.","text_ja":"平均的リスクの患者で ERCP を行う場合も、予防的にインドメタシンまたはジクロフェナクの坐剤を投与することを推奨する。","strength":"strong","quality":"moderate"}],"summary_ja":["高リスク患者における NSAIDs 坐剤の PEP 予防効果は、複数の RCT とメタ解析で確立している。平均的リスクの集団でもインドメタシン坐剤で PEP が減ることが複数の研究で示されている。","患者側の高リスク因子は若年、PEP の既往、Oddi 括約筋機能不全の疑いである。手技側の高リスク因子は挿管困難、膵管への反復挿管、膵管造影、プレカットや針状ナイフによる乳頭切開である。","投与は処置前30分以内が望ましい。作用機序は十分に解明されていないが、ホスホリパーゼ A2 の阻害が関与すると考えられている。"],"summary_en":["Multiple RCTs and meta-analyses establish the benefit of rectal NSAIDs in high-risk patients. Several studies also show fewer PEP cases with rectal indomethacin in average-risk patients.","Patient-related risk factors are young age, prior PEP and suspected sphincter of Oddi dysfunction. Procedure-related factors are difficult cannulation, repeated pancreatic duct cannulation, pancreatic duct injection and precut or needle-knife sphincterotomy.","The drug is ideally given within 30 minutes before the procedure. The mechanism is unclear but may involve inhibition of phospholipase A2."],"evidence":[{"en":"Multiple RCTs and meta-analyses: rectal diclofenac or indomethacin reduces PEP in high-risk patients","ja":"複数の RCT・メタ解析：ジクロフェナクまたはインドメタシン坐剤は高リスク患者の PEP を減少"},{"en":"Multiple studies in average-risk populations: rectal indomethacin decreases PEP","ja":"平均的リスク集団の複数研究：インドメタシン坐剤で PEP 減少"}],"note_ja":"高リスク患者は high quality、平均的リスク患者は moderate quality と、エビデンスの質が分けて評価されている。","note_en":"Evidence quality is graded high for high-risk patients and moderate for average-risk patients.","patients_ja":"","patients_en":""},{"q":70,"section":"XIII","question_en":"What are the indications for Pancreatic Duct stent placement to prevent PEP?","question_ja":"PEP 予防のための膵管ステント留置の適応は何か？","statements":[{"kind":"rec","text_en":"A prophylactic pancreatic duct stent should be placed in patients with inadvertent multiple pancreatic duct cannulation or injection of contrast into the pancreatic duct during ERCP.","text_ja":"ERCP 中に意図せず膵管への複数回挿管または膵管への造影剤注入が生じた患者には、予防的膵管ステントを留置すべきである。","strength":"conditional","quality":"moderate"}],"summary_ja":["膵管ステントは膵管内圧を下げ、膵液のドレナージを助けることで PEP を予防する。RCT とメタ解析で PEP の有意な減少が示されている。","主な適応は、胆管挿管困難例での膵管造影や膵管への反復挿管である。Oddi 括約筋機能不全疑いなどの高リスク例でのルーチン留置もありうるが、利益と害を比較して判断する。","留置の失敗はかえって PEP のリスクを上げ、膵

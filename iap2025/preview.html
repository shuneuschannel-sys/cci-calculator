<style>
/* VOICE work: a clinical reference for young gastroenterologists, calm and exact
   IDEA a pocket guideline card set, every CQ a card, coloured by its GRADE like a printed evidence table
   PICTURE the evidence map: all 96 CQs as tiles in 18 domain rows, fill = certainty, shape = strength
   COLOUR white ground, deep blue #0b2a66 band, blue scale for certainty, grey hatch for GPS
   TYPE Zen Kaku Gothic New 700 display + Noto Sans JP text
   LAYOUT laptop: title band with counts, map in two columns below, sticky filter bar, card grid by domain. phone: title, map, filters, cards in one column */
#iap25{color-scheme:light dark;--bg:light-dark(#ffffff,#0a1222);--ink:light-dark(#0f1a2e,#e8eef9);--mute:light-dark(#566278,#a3b0c6);--line:light-dark(#dfe6f1,#24324b);--soft:light-dark(#f4f7fc,#101b30);--band:light-dark(#0b2a66,#0d1f45);--bandInk:#f2f6ff;--q4:light-dark(#0a3a8c,#8fb8ff);--q3:light-dark(#2563d0,#5b8fe6);--q2:light-dark(#7aa6ea,#355f9e);--q1:light-dark(#cfe0fa,#22385c);--gps:light-dark(#8592a8,#8a97ad);--accent:light-dark(#2563d0,#8fb8ff);--sheet:light-dark(#ffffff,#0e182b)}
:root[data-theme=light] #iap25{color-scheme:light}
:root[data-theme=dark] #iap25{color-scheme:dark}
#iap25.lightonly{color-scheme:light}
#iap25,#iap25 *{box-sizing:border-box;min-width:0}
#iap25 [hidden]{display:none!important}
#iap25{background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
#iap25 button{font:inherit;color:inherit}
#iap25 .pad{padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
#iap25 .wrap{max-width:1240px;margin:0 auto}
#iap25 .top{background:var(--band);color:var(--bandInk);padding-block:clamp(24px,3.4vw,44px)}
#iap25 .head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 40px;align-items:end}
#iap25 .src{font-size:14px;opacity:.8;margin:0 0 10px}
#iap25 h1{font:700 clamp(28px,3.8vw,44px)/1.15 "Zen Kaku Gothic New","Noto Sans JP",sans-serif;letter-spacing:-.01em;margin:0;text-wrap:balance;word-break:keep-all}
#iap25 .about{margin:14px 0 0;max-width:46em;font-size:14px;line-height:1.7;opacity:.78;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--bandInk) 35%,transparent)}
#iap25 .lead{margin:14px 0 0;max-width:42em;font-size:16px;opacity:.9}
#iap25 .lang{display:inline-flex;border:1px solid color-mix(in srgb,var(--bandInk) 45%,transparent);border-radius:999px;padding:3px;margin-bottom:18px}
#iap25 .lang button{border:0;background:none;color:var(--bandInk);padding:6px 16px;border-radius:999px;cursor:pointer;font-size:14px;min-height:36px}
#iap25 .lang button[aria-pressed=true]{background:var(--bandInk);color:var(--band);font-weight:700}
#iap25 .tally{display:grid;grid-template-columns:repeat(4,auto);gap:4px 28px;text-align:left}

#iap25 .tally span{font-size:13px;opacity:.85;white-space:nowrap}
#iap25 h2{font:700 18px/1.3 "Zen Kaku Gothic New",sans-serif;margin:0}
#iap25 .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute);align-items:center}
#iap25 .legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:5px}
#iap25 .homeh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;align-items:baseline;margin:26px 0 14px}
#iap25 .panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#iap25 .panel{display:grid;grid-template-rows:auto 1fr auto;gap:6px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:16px 18px 16px;cursor:pointer;min-height:132px;transition:border-color .15s,transform .15s,box-shadow .15s}

#iap25 .s-strong{background:var(--qc);color:var(--qt)}

#iap25 .s-gps{background:repeating-linear-gradient(135deg,var(--soft) 0 4px,var(--line) 4px 6px);color:var(--mute);box-shadow:inset 0 0 0 1px var(--gps)}

#iap25 .q3{--qc:var(--q3);--qt:light-dark(#fff,#0a1222)}

#iap25 .q1{--qc:var(--q1);--qt:light-dark(#0b2a66,#fff)}
#iap25 .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:12px}

#iap25 .search{flex:1 1 320px;font-size:16px;padding:11px 14px 11px 40px;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2718%27 height=%2718%27 fill=%27none%27 stroke=%27%23768299%27 stroke-width=%272%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27/%3E%3Cpath d=%27m12.5 12.5 4 4%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:13px 50%;border:1px solid var(--line);border-radius:10px;background-color:var(--soft);color:var(--ink);min-height:44px}
#iap25 .search:focus{outline:2px solid var(--accent);outline-offset:0;background-color:var(--bg)}
#iap25 .chips{display:flex;flex-wrap:wrap;gap:6px}
#iap25 .chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer;min-height:38px;white-space:nowrap}
#iap25 .chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#iap25 .count{font-size:14px;color:var(--mute);white-space:nowrap}
#iap25 .list{padding-block:4px 56px;scroll-margin-top:72px}

#iap25 .domh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:14px}
#iap25 .domh em{font:700 15px/1 "Zen Kaku Gothic New",sans-serif;font-style:normal;color:var(--accent);font-variant-numeric:tabular-nums}
#iap25 .domh h3{font:700 clamp(19px,2vw,23px)/1.35 "Zen Kaku Gothic New",sans-serif;margin:0}

#iap25 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
#iap25 .card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px 14px 14px;cursor:pointer;transition:border-color .15s,background .15s}

#iap25 .lang.sm button[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
#iap25 .x{border:0;background:var(--soft);width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:22px;line-height:1;flex:none}

#iap25 .sh-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#iap25 .sh-nav button{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:46px;cursor:pointer;font-size:14px;padding:6px 12px}

#iap25 .sh-nav .nx{text-align:right}
#iap25.embed .bar{position:static;backdrop-filter:none}
#iap25.embed .sheet{position:relative;inset:auto;width:auto;max-width:1240px;margin:8px auto 24px;transform:none;box-shadow:none;border:1px solid var(--line);border-radius:14px;display:block;transition:none;z-index:auto}

@media(max-width:900px){#iap25 .head{grid-template-columns:minmax(0,1fr)}#iap25 .panel strong{font-size:15px}}

#iap25 .lead{font-size:15px}#iap25 .about{font-size:13px}#iap25 .lang{margin-bottom:12px}#iap25 .top{padding-top:22px}#iap25 .panels{gap:8px}#iap25 .panel{padding:12px 10px;min-height:112px;border-radius:12px}#iap25 .panel .full{display:none}#iap25 .panel .short{display:inline}#iap25 .panel strong{font-size:14px}#iap25 .panel small{font-size:13px}#iap25 .mini i{width:9px;height:9px;border-radius:2px}#iap25 .mini{gap:2px}#iap25 .kbdh{display:none}#iap25 .sh-body{padding:18px 16px 24px}#iap25 .chip{padding:6px 11px}}

<script>
{
const DATA = [{"q":1,"section":"I","question_en":"How should a diagnosis of acute pancreatitis be made?","question_ja":"急性膵炎の診断はどのように行うべきか","statements":[{"kind":"rec","text_en":"Acute pancreatitis (AP) should be diagnosed based on the fulfillment of two out of three criteria: (i) clinical- acute upper abdominal pain, (ii) biochemical- elevated pancreatic enzymes (serum lipase or amylase concentration >3 times upper limit of normal) and (iii) imaging- features of acute pancreatic inflammation with or without necrosis on abdominal imaging, typically computed tomography (CT) or ultrasonography (USG).","text_ja":"急性膵炎（AP）は、3項目のうち2項目を満たすことで診断すべきである。(i) 臨床所見：急性の上腹部痛、(ii) 生化学所見：膵酵素上昇（血清リパーゼまたはアミラーゼが基準値上限の3倍超）、(iii) 画像所見：腹部画像検査（通常はCTまたは超音波検査）で壊死の有無を問わず急性膵炎症の所見を認める。","strength":"strong","quality":"low"}],"summary_ja":["改訂アトランタ分類と同じ「3項目中2項目」の診断基準を踏襲している。慢性膵炎の急性増悪も同じ基準を満たしうるため、背景に慢性膵炎がないかを意識して鑑別する。","膵酵素の「基準値上限の3倍」というカットオフには限界がある。3倍未満でも急性膵炎は否定できず、3倍超でも膵外の原因で上昇することがある。Cochraneレビューでは、この閾値での感度はアミラーゼ0.72、リパーゼ0.79、特異度は0.93と0.89であった。","膵酵素は3〜5日で低下し、リパーゼのほうが長く高値を保つ。酵素値は臨床経過と相関しないため、経時的に追跡する意味はない。","画像では、超音波は膵の評価には感度が低いが胆道系の評価として必須である。造影CTは診断に最も適するが全例に必要ではない。MRIは経過後半の局所合併症評価で有用となる。"],"summary_en":["The two out of three rule follows the revised Atlanta classification. An acute flare of chronic pancreatitis can also meet these criteria, so underlying chronic disease should be kept in mind.","The enzyme cut-off of three times the upper limit of normal is imperfect. Lower values do not exclude AP, and higher values can arise from non-pancreatic causes. In a Cochrane review, sensitivity at this threshold was 0.72 for amylase and 0.79 for lipase, with specificity of 0.93 and 0.89.","Enzyme levels fall over 3 to 5 days, lipase staying high longer. They do not track the clinical course and should not be followed serially.","Ultrasound has poor sensitivity for the pancreas but is mandatory to look for a biliary cause. CECT is the best diagnostic scan yet is not needed in every patient. MRI is mainly useful later for complications."],"evidence":[{"en":"Cochrane systematic review of serum amylase and lipase (>3x ULN): sensitivity 0.72 (amylase) and 0.79 (lipase), specificity 0.93 and 0.89","ja":"血清アミラーゼ・リパーゼ（基準値上限3倍超）のCochraneレビュー：感度はアミラーゼ0.72、リパーゼ0.79、特異度は0.93と0.89"},{"en":"At a median AP prevalence of 22.6 %, false positive rates were 26 % (amylase) and 32 % (lipase), and false negative rates 8 % and 7 %","ja":"急性膵炎の有病率中央値22.6%の条件で、偽陽性率はアミラーゼ26%、リパーゼ32%、偽陰性率は8%と7%"}],"note_ja":"酵素値の推移で重症度や経過を判断しないこと。全例に診断目的のCTを撮る必要はない。","note_en":"Do not use serial enzyme levels to judge severity or course. Diagnostic CT is not required in every patient.","patients_ja":"","patients_en":""},{"q":2,"section":"I","question_en":"What should be done during hospitalization to determine the etiology of AP?","question_ja":"入院中に急性膵炎の成因を明らかにするために何を行うべきか","statements":[{"kind":"gps","text_en":"During hospitalization, the etiology of AP should be determined using a detailed history of previous episode(s) of acute pancreatitis, gallstone disease, alcohol intake, medication intake, known hypertriglyceridemia, trauma, recent invasive procedures such as endoscopic retrograde cholangiopancreatography (ERCP), and family history of pancreatic disease(s). Laboratory tests for liver function tests, calcium and triglycerides, and abdominal USG of the gallbladder and biliary system should be performed.","text_ja":"入院中に、急性膵炎の既往、胆石症、飲酒、服薬、既知の高トリグリセリド血症、外傷、ERCPなど最近の侵襲的処置、膵疾患の家族歴について詳細な病歴を聴取し、急性膵炎の成因を明らかにすべきである。肝機能、カルシウム、トリグリセリドの血液検査と、胆嚢および胆道系の腹部超音波検査を行うべきである。","strength":null,"quality":null}],"summary_ja":["成因の特定は再発予防に直結する。最多は胆石で、46研究・234万人超を対象としたメタアナリシスでは急性膵炎の最大42%を占めた。アルコール性は研究対象集団によって約25〜40%である。","発症48時間以内のALT>150 U/Lは胆石性膵炎に対して陽性的中率85%超を示す。肝機能異常があるのに超音波で胆嚢が正常な場合は、回復後にEUSで胆道微小結石の有無を確認する。","入院中に成因が特定できず特発性とされる例は約20%ある。喫煙が急性膵炎のリスクを高めることも2つのシステマティックレビューで示されている。"],"summary_en":["Finding the cause is the key to preventing recurrence. Gallstones are the leading cause, up to 42 % of AP in a meta-analysis of 46 studies with over 2.3 million patients. Alcohol accounts for roughly 25 to 40 % depending on the population.","An ALT above 150 U/L within 48 hours of onset has a positive predictive value over 85 % for gallstone pancreatitis. If liver tests are abnormal but ultrasound shows a normal gallbladder, EUS after recovery is advised to look for biliary microlithiasis.","About 20 % of cases remain without a clear cause during admission and are labelled idiopathic. Two systematic reviews show that smoking raises the risk of AP."],"evidence":[{"en":"Systematic review and meta-analysis of 46 studies (2,341,007 patients, 36 countries): gallstones cause up to 42 % of AP","ja":"46研究（2,341,007例、36か国）のシステマティックレビュー・メタアナリシス：胆石が急性膵炎の最大42%を占める"},{"en":"ALT >150 U/L within 48 hours of symptom onset: PPV >85 % for gallstone-induced pancreatitis","ja":"発症48時間以内のALT>150 U/L：胆石性膵炎の陽性的中率85%超"},{"en":"Alcohol-related AP accounts for about 25-40 % of cases, and about 20 % are idiopathic","ja":"アルコール性は約25〜40%、特発性は約20%"}],"note_ja":"胆嚢が正常に見えても肝機能異常があれば胆道微小結石を疑い、回復後のEUSを検討する。","note_en":"Abnormal liver tests with a normal-looking gallbladder should prompt EUS after recovery to look for microlithiasis.","patients_ja":"","patients_en":""},{"q":3,"section":"I","question_en":"What further investigations are indicated in patients after a first or second attack of idiopathic AP?","question_ja":"特発性急性膵炎の初回または2回目の発作後に、どのような追加検査が適応となるか","statements":[{"kind":"rec","text_en":"A repeat transabdominal ultrasound should be performed in patients with idiopathic AP after discharge. If this does not confirm an etiology, an endoscopic ultrasonography (EUS) should be performed. If the EUS does not reveal an etiology, an MRI with MRCP should be done.","text_ja":"特発性急性膵炎の患者では、退院後に経腹壁超音波検査を再度行うべきである。それで成因が確認できなければEUSを行うべきである。EUSでも成因が明らかにならなければ、MRCPを含むMRIを行うべきである。","strength":"strong","quality":"moderate"},{"kind":"rec","text_en":"Genetic testing should be considered if the etiology remains unidentified, especially after a recurrent episode.","text_ja":"成因が特定できない場合、特に再発後には遺伝子検査を考慮すべきである。","strength":"conditional","quality":"low"}],"summary_ja":["特発性とされた例の多くに胆道微小結石や慢性膵炎が隠れている。EUSとMRI/MRCPは互いに補完的だが、胆道疾患と慢性膵炎の検出ではEUSが優れ、膵胆管の解剖学的異常の検出ではMRIが優れる。","特発性急性膵炎416例を含む5研究のレビューでは、EUSの診断率は32〜88%であった。直接比較した7研究（249例）では診断率はEUS 64%、MRCP 34%であった。一方で陰性のEUSでも胆道原因は完全には否定できない。","膵管癒合不全などの解剖学的異常は関連が示されているが因果関係は確立しておらず、単独原因というより補助因子と考えられる。50歳超（家族歴などのリスクがあればより若年でも）で明らかな原因がない場合は、膵癌除外のため造影CTまたはMRIとEUSを行う。","特発性再発性膵炎では最大66%に遺伝子変異が見つかるとされ、特に若年者では遺伝カウンセリングへの紹介を考慮する。"],"summary_en":["Many idiopathic cases hide biliary microlithiasis or chronic pancreatitis. EUS and MRI/MRCP are complementary. EUS is better for biliary disease and chronic pancreatitis, and MRI for anatomical variants of the ducts.","In a review of 5 studies with 416 idiopathic patients, EUS found a cause in 32 to 88 %. In 7 head-to-head studies (249 patients) the yield was 64 % for EUS and 34 % for MRCP. A negative EUS still does not fully exclude a biliary cause.","Anatomical variants such as pancreas divisum are associated with AP but causality is unproven, so they are more likely co-factors. Patients over 50 (or younger with risk factors such as family history) without an obvious cause should have CECT or MRI plus EUS to exclude malignancy.","Up to 66 % of idiopathic recurrent cases carry a genetic mutation, so referral for genetic counselling is worth considering, especially in younger patients."],"evidence":[{"en":"Systematic review of 5 studies (416 idiopathic AP patients): EUS diagnostic yield 32-88 % for microlithiasis or chronic pancreatitis","ja":"5研究（特発性急性膵炎416例）のシステマティックレビュー：微小結石または慢性膵炎に対するEUSの診断率32〜88%"},{"en":"Systematic review of 34 studies: pooled sensitivity EUS 60 %, secretin MRCP 43 %, MRCP 24 %","ja":"34研究のシステマティックレビュー：統合感度はEUS 60%、セクレチンMRCP 43%、MRCP 24%"},{"en":"7 studies directly comparing EUS with MRI/MRCP (249 patients): diagnostic yield 64 % vs 34 %","ja":"EUSとMRI/MRCPを直接比較した7研究（249例）：診断率64%対34%"},{"en":"Up to 66 % of presumed idiopathic recurrent AP cases have a genetic mutation identified","ja":"特発性とされた再発性急性膵炎の最大66%で遺伝子変異が同定される"}],"note_ja":"検査の順序は経腹壁超音波の再検、EUS、MRI/MRCPの段階的アプローチである。50歳超では膵癌の除外を忘れない。","note_en":"The work-up is stepwise: repeat transabdominal ultrasound, then EUS, then MRI/MRCP. In patients over 50, remember to exclude pancreatic cancer.","patients_ja":"患者は成因、経過、検査、治療について各段階で説明を受けることを重視し、MRIのような低侵襲な選択肢を含めた話し合いを望んでいる。遺伝子検査は保険加入などへの影響があるため、十分な説明と選択の機会が必要であり、遺伝性の場合は膵癌リスクとスクリーニングについても話し合うべきとしている。","patients_en":"Patients want to be informed about cause, course, tests and treatment at each step and to discuss options, including less invasive tests such as MRI. Genetic testing needs counselling and a real choice because it can affect insurance or mortgages, and hereditary cases should be told about pancreatic cancer risk and screening."},{"q":4,"section":"II","question_en":"What is the most appropriate marker to predict severe acute pancreatitis within 48 hours of onset of AP?","question_ja":"急性膵炎発症48時間以内に重症急性膵炎を予測する最も適切なマーカーは何か","statements":[{"kind":"rec","text_en":"Systemic inflammatory response syndrome (SIRS) at admission and persistent SIRS at 48 hours from the onset of abdominal pain, either alone or in combination with a high C-reactive protein (CRP) or Interleukin-6 (IL-6), should be used to predict severe AP.","text_ja":"入院時の全身性炎症反応症候群（SIRS）と腹痛発症から48時間時点での持続するSIRSを、単独で、または高値のCRPもしくはIL-6と組み合わせて、重症急性膵炎の予測に用いるべきである。","strength":"strong","quality":"moderate"}],"summary_ja":["入院時に中等症以上や重症への進展を高い陽性的中率で予測できる方法は現時点で存在しない。SIRSは感度・特異度が高いが陽性的中率は低く、改訂アトランタ分類の重症は48時間超の臓器不全で定義されるため、発症48時間以内の予測は本質的に難しい。","181研究・29バイオマーカーのメタアナリシスでは、IL-6（>50 pg/ml）の感度87%、特異度88%はCRP（>150 mg/l）やAPACHE-II（8以上）を上回った。IL-6>160 pg/mlを加えると、持続SIRSの陽性的中率が56%から85%に改善した。","スコアリングでは、APACHE IIが死亡予測で最も高いAUC（0.91）を示した。HAPSは重症の除外に、HAPS、SIRS、BISAPはいずれも多臓器不全の除外に高い陰性的中率（98%超）を示した。","高齢（65歳以上）、重い併存症（Charlson併存疾患指数3以上）、BMI>25、内臓脂肪の多さ、高トリグリセリド血症は重症化の危険因子である。"],"summary_en":["No tool reliably predicts moderately severe or severe AP at admission with a high positive predictive value. SIRS is sensitive and specific but has a low PPV, and because severe AP is defined by organ failure lasting over 48 hours, prediction within the first 48 hours is inherently hard.","In a meta-analysis of 181 studies on 29 biomarkers, IL-6 above 50 pg/ml had 87 % sensitivity and 88 % specificity, outperforming CRP above 150 mg/l and APACHE-II of 8 or more. Adding IL-6 above 160 pg/ml raised the PPV of persistent SIRS from 56 % to 85 %.","Among scores, APACHE II had the highest AUC for mortality (0.91). HAPS helps rule out severe AP, and HAPS, SIRS and BISAP all had negative predictive values above 98 % for excluding multiple organ failure.","Age 65 or older, a Charlson comorbidity index of 3 or more, BMI above 25, high visceral fat and hypertriglyceridemia are risk factors for severe disease."],"evidence":[{"en":"Meta-analysis of 181 studies (29 biomarkers): IL-6 >50 pg/ml sensitivity 87 %, specificity 88 %, vs CRP >150 mg/l 53 % and 82 %, APACHE-II >=8 72 % and 76 %","ja":"181研究（29バイオマーカー）のメタアナリシス：IL-6>50 pg/mlは感度87%、特異度88%。CRP>150 mg/lは53%と82%、APACHE-II 8以上は72%と76%"},{"en":"IL-6 >160 pg/ml improved the PPV of persistent SIRS for severe AP from 56 % to 85 %","ja":"IL-6>160 pg/mlの併用で、持続SIRSによる重症予測の陽性的中率が56%から85%に改善"},{"en":"Meta-analysis of 30 studies (5988 patients): APACHE II had the highest AUC for mortality (0.91, 95 % CI 0.88-0.93)","ja":"30研究（5988例）のメタアナリシス：死亡予測のAUCはAPACHE IIが最高（0.91、95%CI 0.88〜0.93）"},{"en":"Prospective multicenter study (1544 cases): HAPS, SIRS and BISAP had NPV >98 % for ruling out multiple organ failure","ja":"前向き多施設研究（1544例）：HAPS、SIRS、BISAPはいずれも多臓器不全除外の陰性的中率98%超"}],"note_ja":"SIRSは簡便でベッドサイドで繰り返し評価できる点が利点である。陽性的中率が低いため、CRPやIL-6と組み合わせて解釈する。","note_en":"SIRS is simple and can be reassessed at the bedside. Because its PPV is low, interpret it together with CRP or IL-6.","patients_ja":"","patients_en":""},{"q":5,"section":"II","question_en":"What is the best strategy to predict the outcome of AP during hospitalization?","question_ja":"入院中に急性膵炎の転帰を予測する最良の方法は何か","statements":[{"kind":"rec","text_en":"Persistent (>48 hours) organ failure is the most important clinical determinant of the outcome of AP in terms of mortality and should be used for predicting outcomes.","text_ja":"持続性（48時間超）臓器不全は、死亡率の観点から急性膵炎の転帰を左右する最も重要な臨床的決定因子であり、転帰の予測に用いるべきである。","strength":"strong","quality":"high"}],"summary_ja":["急性膵炎の転帰予測は動的かつ多面的な過程である。大規模コホートでは、持続性臓器不全を伴う例の死亡率は39〜42%に達する。","重症度と転帰は主に臓器不全で決まり、改訂アトランタ分類も持続性臓器不全で重症を定義している。持続性臓器不全は膵壊死やその感染と関連する。","感染性膵壊死は合併症、入院期間、インターベンションの必要性を増やすが、臓器不全を伴わなければそれ自体で死亡率を上げるわけではない。"],"summary_en":["Outcome prediction in AP is dynamic and multidimensional. In large cohorts, mortality with persistent organ failure is 39 to 42 %.","Severity and outcome are driven mainly by organ failure, which is why the revised Atlanta classification defines severe AP by persistent organ failure. Persistent organ failure is linked to necrosis and infected necrosis.","Infected necrotizing pancreatitis increases morbidity, hospital stay and the need for intervention, but by itself does not raise mortality unless organ failure is present."],"evidence":[{"en":"Large cohorts: mortality of 39-42 % in patients with persistent organ failure","ja":"大規模コホート：持続性臓器不全例の死亡率は39〜42%"},{"en":"Infected necrotizing pancreatitis without organ failure increases morbidity and length of stay but not mortality","ja":"臓器不全を伴わない感染性膵壊死は、合併症と入院期間を増やすが死亡率は上げない"}],"note_ja":"入院後は臓器不全の有無と持続時間を経時的に評価することが転帰予測の中心となる。","note_en":"After admission, serial assessment of whether organ failure is present and how long it lasts is the core of outcome prediction.","patients_ja":"","patients_en":""},{"q":6,"section":"II","question_en":"What are the indications for the transfer of a patient with AP to a high-volume center?","question_ja":"急性膵炎患者をhigh-volume centerへ転送する適応は何か","statements":[{"kind":"gps","text_en":"If expertise is not available in the local setting, transfer of a patient to a high-volume center is recommended for patients with organ failure or infected necrotizing pancreatitis.","text_ja":"自施設に専門的な診療能力がない場合、臓器不全または感染性膵壊死を伴う患者はhigh-volume centerへの転送が推奨される。","strength":null,"quality":null}],"summary_ja":["病状は急速に進行しうる一方、転送自体にもリスクがあるため、転送の判断は慎重に行う。転送は予防的転送と反応的転送に分けて考えるとよい。","予防的転送は、持続SIRSなど重症化が予測され、自施設の設備や専門性が不足していて悪化リスクが高い患者で考慮する。初期治療に反応しない患者は、多職種の専門性を持つ三次施設への転送を検討する。","反応的転送は、臓器不全や、自施設では行えない侵襲的治療を要する感染性膵壊死などの合併症が生じた場合に考慮する。米国のデータではhigh-volume center（年間118例以上）の死亡リスクは25%低かった。地域の三次・二次施設のネットワーク構築が適切な判断を助ける。"],"summary_en":["The disease can progress quickly, yet transfer carries its own risk, so the decision must be careful. Transfer can be thought of as prophylactic or reactive.","Prophylactic transfer suits patients predicted to have severe AP, for example with persistent SIRS, at high risk of deterioration where local resources or expertise are lacking. Patients who do not respond to initial treatment should be considered for a tertiary center with multidisciplinary expertise.","Reactive transfer is for organ failure or complications such as infected necrosis needing interventions unavailable locally. In US data, high-volume centers (118 or more cases per year) had a 25 % lower risk of death. Regional networks of tertiary and secondary centers can support these decisions."],"evidence":[{"en":"US Nationwide Inpatient Sample: AP patients at high-volume centers (>=118 cases/year) had a 25 % lower risk of death","ja":"米国Nationwide Inpatient Sample：high-volume center（年間118例以上）では死亡リスクが25%低い"},{"en":"Large national study: older age, male sex, lower income, non-teaching hospital, gallstone pancreatitis, need for surgical intervention and severe AP predicted transfer to large centers","ja":"大規模全国研究：高齢、男性、低所得、非教育病院、胆石性膵炎、外科的介入の適応、重症急性膵炎が大規模施設への転送の予測因子"}],"note_ja":"予後スコアは転送判断の参考になる。地域の多職種ネットワークの整備が望ましい。","note_en":"Prognostic scores can help the decision. Establishing regional multidisciplinary networks is encouraged.","patients_ja":"患者は重症化が予測された場合に最善の医療を受けられる保証を求めている。早期に飲食できるかどうかにも関心が高く、高トリグリセリド血症関連の膵炎では必要以上に絶食が続いたという経験もある。施設間の早期かつ繰り返しの連携による確実な転送体制と、その受け入れ能力の確保を求めている。","patients_en":"Patients want assurance of the best possible care when severe AP is predicted. They care about being allowed to eat early, some having fasted longer than needed in hypertriglyceridemia-associated AP. They ask for early, repeated liaison between centers so transfer happens reliably, and for enough capacity in the system."},{"q":7,"section":"III","question_en":"What is the indication and timing of the initial CT assessment in AP?","question_ja":"急性膵炎における初回CT評価の適応とタイミングは何か","statements":[{"kind":"rec","text_en":"Initial CT assessment in AP should be done if there is (i) diagnostic uncertainty and (ii) failure to respond to conservative treatment or clinical deterioration. The optimal timing for initial conventional CT to assess severity is at least 72-96 hours after the onset of symptoms.","text_ja":"急性膵炎の初回CT評価は、(i) 診断が不確実な場合、(ii) 保存的治療に反応しない場合または臨床的に悪化した場合に行うべきである。重症度評価のための初回の通常CTの至適時期は、症状発現から少なくとも72〜96時間後である。","strength":"strong","quality":"moderate"}],"summary_ja":["造影CTは診断と重症度予測に正確であるが、48時間以内の早期ルーチンCTは推奨されない。理由は3つある。早期CTが臨床転帰を改善する根拠がない、CTスコアは臨床スコアより重症度・予後予測に優れない、膵および膵周囲壊死の全容は発症72〜96時間以降でないと明らかにならない。","したがってCTSIや改訂CTSIによる重症度評価のCTはこの時期以降に行う。","一方、急性腹症で診断が不確かな場合は、腸管虚血、急性胆嚢炎、外傷性膵損傷、癌関連膵炎、血管緊急症、腸閉塞や穿孔の除外のために早期CTが役立つ。"],"summary_en":["Contrast-enhanced CT is accurate for diagnosis and severity, but routine CT within 48 hours is not recommended for three reasons. Early CT has not been shown to improve outcomes, CT scores are not better than clinical scores for prognosis, and the full extent of necrosis appears only after 72 to 96 hours.","CT for severity grading with CTSI or modified CTSI should therefore be done after that window.","Early CT remains useful when the diagnosis is uncertain in an acute abdomen, to exclude bowel ischemia, acute cholecystitis, traumatic pancreatic injury, cancer-related pancreatitis, vascular emergencies, or bowel obstruction and perforation."],"evidence":[{"en":"No evidence that early CT improves clinical outcome or that early detection of necrosis changes treatment","ja":"早期CTが臨床転帰を改善する、または壊死の早期検出が治療を変えるという根拠はない"},{"en":"CT scoring systems are not superior to clinical scoring systems for predicting prognosis and severity","ja":"CTスコアは予後・重症度予測において臨床スコアに優らない"}],"note_ja":"入院時の「とりあえずCT」は避ける。重症度評価目的のCTは発症72〜96時間以降に撮る。","note_en":"Avoid reflex CT at admission. Time CT for severity grading to at least 72 to 96 hours after onset.","patients_ja":"","patients_en":""},{"q":8,"section":"III","question_en":"What is the indication for follow-up cross-sectional imaging with CT or MRI?","question_ja":"CTまたはMRIによる経過観察の断層画像検査の適応は何か","statements":[{"kind":"gps","text_en":"A follow-up CECT should be done when invasive intervention is considered for local complications or there is clinical deterioration in patients with AP.","text_ja":"急性膵炎患者において、局所合併症に対する侵襲的治療を検討する場合、または臨床的悪化がある場合には、経過観察の造影CTを行うべきである。","strength":null,"quality":null}],"summary_ja":["毎週のような定期的フォローアップCTを支持する根拠はない。多くの合併症は臨床評価で疑えるため、造影CTは侵襲的治療を考える時点か、保存的治療で改善しない時点で行う。","仮性動脈瘤は出血まで臨床的に明らかにならないことがあるが、頻度が低いため定期CTの理由にはならない。","CTは液体主体の貯留内の壊死を検出しにくく、仮性嚢胞と被包化壊死（WON）の区別には発症3〜4週後のMRIが必要となることがある。ヨード造影剤アレルギーや腎不全がある場合もT2強調像で造影なしに壊死を評価できるMRIが有用である。灌流CTやdual-energy CTは早期に膵壊死を予測しうるが、転帰改善への寄与は不明である。"],"summary_en":["There is no evidence for routine follow-up CT, for example weekly. Most complications can be suspected clinically, so CECT is reserved for when intervention is considered or the patient fails to improve.","Arterial pseudoaneurysm may stay silent until it bleeds, but it is uncommon and does not justify routine scanning.","CT is poor at detecting necrosis within fluid-predominant collections, and MRI 3 to 4 weeks after onset may be needed to separate pseudocyst from walled-off necrosis. MRI also helps with contrast allergy or renal failure, since T2-weighted images show necrosis without gadolinium. Perfusion or dual-energy CT may predict necrosis early, but its effect on outcomes is unknown."],"evidence":[{"en":"Routine (e.g., weekly) follow-up CT lacks supporting evidence","ja":"毎週などの定期的フォローアップCTを支持する根拠はない"},{"en":"MRI at least 3-4 weeks after onset may be required to distinguish pseudocyst from walled-off necrosis","ja":"仮性嚢胞と被包化壊死の鑑別には発症3〜4週以降のMRIが必要なことがある"}],"note_ja":"フォローアップ画像は「治療方針を変えるとき」に撮る。被曝や造影剤の負担も考慮する。","note_en":"Repeat imaging when it may change management. Consider radiation and contrast burden.","patients_ja":"","patients_en":""},{"q":9,"section":"III","question_en":"What is the optimal CT and MR protocol to detect local complications?","question_ja":"局所合併症を検出するための最適なCTおよびMRのプロトコルは何か","statements":[{"kind":"gps","text_en":"To detect local complications, it is recommended to perform a multidetector CT with thin collimation and slice thickness (i.e., 2 mm or less) during the pancreatic and portal venous phases (i.e., 50-70 s delay) after giving 100-150 ml of non-ionic intravenous contrast material at a rate of 3 ml/s. Only a portal venous phase (mono-phasic) CT is generally sufficient to assess fluid collections with or without necrosis during follow-up. If a pseudoaneurysm is suspected, dynamic CT or arterial phase contrast CT should be added.","text_ja":"局所合併症の検出には、非イオン性造影剤100〜150 mlを3 ml/sで静注した後、膵実質相と門脈相（遅延50〜70秒）で、薄いコリメーションとスライス厚（2 mm以下）のマルチディテクターCTを撮影することが推奨される。経過観察で壊死の有無を問わず液体貯留を評価するには、通常は門脈相のみ（単相）のCTで十分である。仮性動脈瘤が疑われる場合はダイナミックCTまたは動脈相造影CTを追加すべきである。","strength":null,"quality":null},{"kind":"gps","text_en":"For MRI, the recommendation is to perform axial FS-T2W and FS-T1W scanning, intravenous gadolinium contrast may be required if the MRI is being done instead of a contrast-enhanced CT. If an MRI is done to delineate necrotic and liquefied components of fluid collections, an axial FS-T2W sequence should suffice.","text_ja":"MRIでは、軸位断の脂肪抑制T2強調像および脂肪抑制T1強調像の撮影が推奨され、造影CTの代わりにMRIを行う場合はガドリニウム造影剤の静注が必要となることがある。液体貯留内の壊死成分と液状成分の描出を目的とする場合は、軸位断の脂肪抑制T2強調像で十分である。","strength":null,"quality":null}],"summary_ja":["CTとMRIの撮像法は文献によりばらつきが大きく、専用の放射線学的ガイドラインはない。膵実質相と門脈相はいずれも生存膵と非生存膵の区別に十分である。","出血、仮性動脈瘤、腸間膜虚血が疑われる場合は多相撮影が必要となる。膵壊死は造影CTで1 cm²超の非造影域で、CT値が30〜50 HU未満または造影による上昇が15 HU未満の領域とされる。急性腎障害では単純CTも選択肢となる。","T2強調MRIは、仮性嚢胞と壊死を含む貯留（急性壊死性貯留、WON）の区別やドレナージ前の壊死量の評価が必要な場合、また被曝を避けたい若年患者で勧められる。"],"summary_en":["CT and MRI protocols vary widely and no dedicated radiology guideline exists. Both pancreatic and portal venous phases are adequate to separate viable from non-viable tissue.","A multiphase protocol is needed for suspected hemorrhage, pseudoaneurysm or mesenteric ischemia. Necrosis is defined as a non-enhancing area over 1 cm² with attenuation below 30 to 50 HU or an increase below 15 HU after contrast. Non-contrast CT is an option in acute renal failure.","T2-weighted MRI is advised when pseudocysts must be separated from necrotic collections or necrosis quantified before drainage, and in young patients because of radiation."],"evidence":[{"en":"Pancreatic necrosis on CECT: non-enhancing area >1 cm² with CT value <30-50 HU or <15 HU increase after contrast","ja":"造影CTでの膵壊死：1 cm²超の非造影域で、CT値30〜50 HU未満または造影後の上昇15 HU未満"},{"en":"Multiphase protocol indications: hemorrhage, arterial pseudoaneurysm, mesenteric ischemia","ja":"多相撮影の適応：出血、動脈性仮性動脈瘤、腸間膜虚血"}],"note_ja":"経過観察は門脈相の単相CTで十分なことが多く、被曝を抑えられる。","note_en":"Follow-up can usually use a single portal venous phase, which limits radiation.","patients_ja":"患者は初回CTのタイミングについて明確な説明を求めている。診断目的なら入院当日にCTを撮ることがあるが、重症度評価には発症後少なくとも72〜96時間を要し、臨床的悪化時には後で追加撮影が必要となりうる点を伝えるべきとしている。","patients_en":"Patients want the timing of the first CT explained. A scan for diagnosis may be done on the day of admission, but severity assessment needs at least 72 to 96 hours after onset, and further scans may be needed if they deteriorate."},{"q":10,"section":"IV","question_en":"What is the preferred fluid type to use for fluid therapy in AP?","question_ja":"急性膵炎の輸液療法に用いるべき輸液の種類は何か","statements":[{"kind":"rec","text_en":"Lactated Ringer's solution should be used for fluid therapy in patients with AP.","text_ja":"急性膵炎患者の輸液療法には乳酸リンゲル液を用いるべきである。","strength":"strong","quality":"moderate"}],"summary_ja":["乳酸リンゲル液（LR）と生理食塩液を比較したRCTは6本あるが、多くは単施設の小規模試験である。","複数のメタアナリシスで、LRは重症度、ICU入室、局所合併症の低下と関連していた。個々の試験の結果は一致せず、多くは臨床的に重要なエンドポイントを検出する検出力がなかったため、大規模多施設試験が望まれる。","最近のRCTでは、バランス型多電解質液は生理食塩液と比べて血中クロール値が低く、SIRSが少なかった。生理食塩液の大量投与による高クロール血症を避ける意味でも、晶質液はバランス型が基本である。"],"summary_en":["Six fully published RCTs compared lactated Ringer's with normal saline, most of them small and single-center.","Several meta-analyses link LR with lower severity, fewer ICU admissions and fewer local complications. Individual trial results conflicted and most lacked power for clinically relevant endpoints, so large multicenter trials are still needed.","A recent RCT found that a balanced multi-electrolyte solution gave lower chloride levels and less SIRS than saline, supporting balanced crystalloids as the default."],"evidence":[{"en":"Six full-published RCTs of LR vs normal saline, mostly small single-center studies","ja":"LRと生理食塩液を比較した6本のRCT（多くは単施設小規模）"},{"en":"Meta-analyses: LR associated with lower severity, ICU admission and local complications","ja":"メタアナリシス：LRは重症度、ICU入室、局所合併症の低下と関連"},{"en":"RCT of balanced multi-electrolyte solution vs normal saline: lower chloride levels and less SIRS with the balanced solution","ja":"バランス型多電解質液と生理食塩液のRCT：バランス型で血中クロール低値、SIRS減少"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":11,"section":"IV","question_en":"What is the optimal fluid infusion strategy for fluid therapy in AP?","question_ja":"急性膵炎の輸液療法における最適な輸液戦略は何か","statements":[{"kind":"rec","text_en":"A moderate fluid infusion rate of 1.5 ml/kg/h is recommended. A fluid bolus is recommended if the patient has hypovolemia or hypotension at presentation. Additional fluids may be given depending on hematocrit and clinical signs of hypovolemia.","text_ja":"1.5 ml/kg/hの中等量の輸液速度が推奨される。来院時に循環血液量減少または低血圧がある場合はボーラス輸液が推奨される。ヘマトクリットと循環血液量減少の臨床徴候に応じて追加輸液を行ってもよい。","strength":"strong","quality":"moderate"}],"summary_ja":["輸液速度を比較したRCTは6本ある。1993年アトランタ分類で重症とされた患者を対象とした2本では、積極的輸液のほうが転帰が悪かった。SIRS改善に差がなかった試験や、発症24時間以降の登録で差がなかった試験もある。軽症例（n=60）で積極的輸液が臨床改善を早めたというオープンラベル試験もある。","最も新しい国際多施設オープンラベルRCTは、重症化の基準を持たない全急性膵炎を対象に、積極的輸液（20 mL/kgボーラス後3 mL/kg/h）と中等量輸液（1.5 mL/kg/h、循環血液量減少時に10 mL/kgボーラス）を比較した。n=249で早期中止となり、体液過剰は21%対6%（p<0.01）と積極的輸液群で多く、主要評価項目の中等症・重症への進展に有意差はなかった。","軽症では毛細血管の機能が保たれる一方、重症では毛細血管漏出が起こりうるため、重症予測例ではより慎重な輸液が必要である。積極的輸液は膵壊死や臓器不全を防がず、むしろ転帰悪化と関連する。","輸液は救命（ショック時のボーラス）、最適化（慎重に滴定）、安定化（維持のみ）、減量（体液過剰時の負のバランス）の4相で考えるとよい。"],"summary_en":["Six RCTs have tested infusion rates. Two trials in severe AP defined by the 1993 Atlanta criteria found worse outcomes with aggressive fluids. Another showed no difference in SIRS reduction, and one enrolling after 24 hours found no difference. An open-label trial in mild AP (n = 60) found faster improvement with aggressive fluids.","The latest international multicenter open-label RCT compared aggressive fluids (20 mL/kg bolus then 3 mL/kg/h) with moderate fluids (1.5 mL/kg/h, 10 mL/kg bolus if hypovolemic) in all-comers without baseline severity criteria. It stopped early at n = 249 because fluid overload occurred in 21 % vs 6 % (p < 0.01), with no significant difference in progression to moderate-severe AP.","Capillary function is preserved in mild AP, but severe AP may cause capillary leak, so fluids must be more guarded in predicted severe disease. Aggressive fluids do not prevent necrosis or organ failure and are linked to worse outcomes.","Fluid therapy can be framed in four phases: rescue with boluses in shock, cautious optimization, stabilization with maintenance only, and de-escalation with a negative balance if overloaded."],"evidence":[{"en":"International multicenter open-label RCT, stopped early (n = 249): aggressive (20 mL/kg bolus + 3 mL/kg/h) vs moderate (1.5 mL/kg/h) fluids, fluid overload 21 % vs 6 % (p < 0.01), no significant difference in moderate-severe AP","ja":"国際多施設オープンラベルRCT、早期中止（n=249）：積極的輸液（20 mL/kgボーラス＋3 mL/kg/h）対中等量輸液（1.5 mL/kg/h）、体液過剰21%対6%（p<0.01）、中等症・重症への進展に有意差なし"},{"en":"Two RCTs in severe AP (1993 Atlanta definition): worse outcomes with aggressive fluid therapy","ja":"重症急性膵炎（1993年アトランタ分類）を対象とした2本のRCT：積極的輸液で転帰悪化"},{"en":"Open-label RCT in mild AP (n = 60): aggressive fluids led to faster clinical improvement","ja":"軽症急性膵炎のオープンラベルRCT（n=60）：積極的輸液で臨床改善が早い"}],"note_ja":"かつて主流だった大量輸液から、中等量輸液への明確な方針転換である。専門家1名（JN）が具体的な輸液速度の推奨に異論を示している。","note_en":"This marks a clear shift from aggressive to moderate fluid resuscitation. One expert (JN) disagreed with recommending a specific infusion rate.","patients_ja":"","patients_en":""},{"q":12,"section":"IV","question_en":"How should response to optimal fluid therapy be measured?","question_ja":"最適な輸液療法への反応はどのように評価すべきか","statements":[{"kind":"gps","text_en":"Both clinical signs and laboratory parameters should be considered when assessing fluid status. A mean arterial pressure between 65 and 85 mm Hg (8.7-11.3 kPa), a urine output ≥0.5 ml/kg/h, a blood urea nitrogen (BUN) < 20 mg/dL (or blood urea <40), and a hematocrit <44 % are reasonable targets which may reflect adequate fluid status. Invasive monitoring should be reserved for patients in an intensive care unit setting.","text_ja":"体液状態の評価には臨床徴候と検査値の両方を考慮すべきである。平均動脈圧65〜85 mmHg（8.7〜11.3 kPa）、尿量0.5 ml/kg/h以上、BUN<20 mg/dL（または血中尿素<40）、ヘマトクリット<44%は、適切な体液状態を反映しうる妥当な目標値である。侵襲的モニタリングはICUの患者に限定すべきである。","strength":null,"quality":null}],"summary_ja":["入院患者の体液評価は難しく、単一の指標では複数指標の組み合わせに及ばない。心拍数100/分未満、平均動脈圧65〜85 mmHg、尿量0.5 ml/kg/h超、BUN<20 mg/dL、脱水や体液過剰の徴候がないことが臨床的な目標となる。","多施設観察研究ではBUNが転帰予測因子であり、入院時ヘマトクリット44%以上と24時間でのBUN上昇の組み合わせは、重症例のモニタリングで他の検査値より優れていた。","侵襲的モニタリングは、血行動態が不安定で輸液負荷の利益と害が不確かなICU患者に限る。中心静脈圧は輸液反応性の指標として不良である。重症壊死性膵炎では胸腔内血液容量係数が中心静脈圧やヘマトクリットより正確だった。超音波による下大静脈径と呼吸性変動、肺エコーも有用である。腹腔内圧上昇は特に人工呼吸中に偽陰性の原因となる。"],"summary_en":["Fluid status is hard to judge, and no single parameter matches a combination. Reasonable clinical targets are heart rate below 100/min, MAP 65 to 85 mm Hg, urine output above 0.5 ml/kg/h, BUN below 20 mg/dL, and no signs of dehydration or overload.","Multicenter observational studies show BUN predicts outcome, and admission hematocrit of 44 % or more plus a rise in BUN at 24 hours outperformed other laboratory parameters in severe disease.","Invasive monitoring belongs in the ICU, for unstable patients in whom further volume has uncertain benefit. Central venous pressure predicts fluid responsiveness poorly. In severe necrotizing pancreatitis, intrathoracic blood volume index was more accurate than CVP and hematocrit. Bedside ultrasound of the IVC and lung is helpful. Abdominal hypertension can give false negative readings, especially on a ventilator."],"evidence":[{"en":"Admission hematocrit >=44 % plus a rise in BUN at 24 hours outperformed other laboratory parameters in monitoring severe disease","ja":"入院時ヘマトクリット44%以上と24時間時点のBUN上昇の組み合わせは、重症例のモニタリングで他の検査値より優れる"},{"en":"Observational study in severe necrotizing pancreatitis: intrathoracic blood volume index more accurate than CVP and hematocrit for cardiac index assessment","ja":"重症壊死性膵炎の観察研究：心係数評価において胸腔内血液容量係数は中心静脈圧やヘマトクリットより正確"},{"en":"Central venous pressure is a poor predictor of fluid status and responsiveness","ja":"中心静脈圧は体液状態と輸液反応性の予測因子として不良"}],"note_ja":"単一の数値ではなく、バイタル、尿量、BUN、ヘマトクリットを組み合わせて判断する。体液過剰の徴候を見逃さない。","note_en":"Combine vital signs, urine output, BUN and hematocrit rather than chasing one number, and watch for fluid overload.","patients_ja":"患者は、尿量評価のための長期の尿道カテーテル留置など、モニタリング自体が負担になることを理解し、必要不可欠でない侵襲的モニタリングを避けられないか検討してほしいと求めている。","patients_en":"Patients ask clinicians to recognize that monitoring, such as prolonged urinary catheterization, can be a burden, and to avoid invasive monitoring unless essential."},{"q":13,"section":"V","question_en":"How should abdominal pain be assessed in AP?","question_ja":"急性膵炎の腹痛はどのように評価すべきか","statements":[{"kind":"gps","text_en":"Abdominal pain should be assessed periodically using a visual analog or numeric rating scale to judge the requirement of analgesics.","text_ja":"鎮痛薬の必要性を判断するため、腹痛は視覚的アナログスケールまたは数値評価スケールを用いて定期的に評価すべきである。","strength":null,"quality":null}],"summary_ja":["疼痛は急性膵炎の主症状であるが主観的で、客観的な定量化は難しい。鎮痛薬を検討したRCTでは、VAS（0〜100 mmまたは0〜10 cm）、NRS（0〜10）、自己申告スケールが用いられてきた。術後疼痛ではVASとNRSの妥当性が確立している。","各試験では入院時から最長5日間、2時間ごとから1日1回の頻度で評価していた。メタアナリシスでは疼痛強度、疼痛のある日数、鎮痛薬の必要量（種類、レジメン、総量）、有害事象が主な評価項目であった。","ただし鎮痛薬の必要量と疼痛スケールの相関は良くない。スケールは目安として使い、患者の訴えと合わせて判断する。"],"summary_en":["Pain is the cardinal symptom of AP but is subjective and hard to quantify. Analgesic RCTs have used the VAS (0 to 100 mm or 0 to 10 cm), the NRS (0 to 10) and self-reported scales, and VAS and NRS are well validated after surgery.","Studies assessed pain from admission for up to 5 days, from every 2 hours to daily. Meta-analyses mostly reported pain intensity, days with pain, analgesic needs (type, regimen, total dose) and adverse events.","Analgesic requirement, however, correlates poorly with pain scores. Use the scales as a guide alongside the patient's own account."],"evidence":[{"en":"VAS (0-100 mm or 0-10 cm) and NRS (0-10) were used in RCTs of analgesics in AP, assessed up to 5 days from admission at intervals of 2 hours to daily","ja":"急性膵炎の鎮痛薬RCTではVAS（0〜100 mmまたは0〜10 cm）とNRS（0〜10）が用いられ、入院から最長5日間、2時間ごとから1日1回評価された"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":14,"section":"V","question_en":"Which analgesic should be used for pain relief in patients with AP?","question_ja":"急性膵炎患者の疼痛緩和にはどの鎮痛薬を用いるべきか","statements":[{"kind":"rec","text_en":"Either opioid analgesics or non-steroidal anti-inflammatory drugs (NSAIDs) should be used for pain relief. Opioid analgesics provide better pain relief in patients with severe pain.","text_ja":"疼痛緩和にはオピオイド鎮痛薬または非ステロイド性抗炎症薬（NSAIDs）のいずれかを用いるべきである。強い疼痛のある患者ではオピオイド鎮痛薬のほうが良好な疼痛緩和が得られる。","strength":"strong","quality":"moderate"}],"summary_ja":["十分な鎮痛は基本である。2つのメタアナリシスでは、軽症例でオピオイドとNSAIDsの有効性と安全性は同等だったが、オピオイドではレスキュー鎮痛薬の必要が少なかった。初期治療はオピオイドかNSAIDsとし、必要に応じフェンタニルなど短時間作用型をレスキューとして併用する。静注PCAも選択肢である。","2本のRCTでは、オピオイド（ペンタゾシンまたはブプレノルフィン）はジクロフェナクより有効で同等に安全であり、中等症・重症のサブグループでも同様だった。呼吸抑制、意識障害、麻痺性イレウスではオピオイドを避ける。","入院後のオピオイド長期使用が中等症・重症と関連したとする観察研究（OR 2.07）があるが、重症例ほど痛みが強く長いという逆因果は考慮されていない。","硬膜外鎮痛は9研究（n=726）のメタアナリシスで有益とされたが、148例のRCTでは人工呼吸器非装着日数に利益がなく、侵襲的換気期間が延長した。強い疼痛があり心肺の併存症を持つ患者で考慮してよい。"],"summary_en":["Adequate analgesia is essential. Two meta-analyses found similar efficacy and safety for opioids and NSAIDs in mild AP, with less rescue analgesia needed with opioids. Start with an opioid or an NSAID, add short-acting rescue such as fentanyl as needed, and consider intravenous PCA.","Two RCTs found opioids (pentazocine or buprenorphine) more effective than diclofenac and equally safe, including in moderately severe or severe disease. Opioids should be avoided with respiratory depression, altered sensorium or paralytic ileus.","An observational study linked longer opioid use after admission to moderately severe or severe AP (OR 2.07), but reverse causation was not addressed.","Epidural analgesia looked beneficial in a meta-analysis of 9 studies (n = 726), but an RCT of 148 patients found no gain in ventilator-free days and longer invasive ventilation. It may be considered for severe pain with cardiac or respiratory comorbidity."],"evidence":[{"en":"Two meta-analyses: opioids and NSAIDs have similar efficacy and safety in mild AP, opioids reduce the need for rescue analgesics","ja":"2つのメタアナリシス：軽症例でオピオイドとNSAIDsの有効性と安全性は同等、オピオイドでレスキュー鎮痛薬が減少"},{"en":"Two RCTs: pentazocine or buprenorphine more effective and equally safe compared with diclofenac, including in moderately severe or severe AP","ja":"2本のRCT：ペンタゾシンまたはブプレノルフィンはジクロフェナクより有効で同等に安全、中等症・重症でも同様"},{"en":"Observational cohort: longer opioid use associated with moderately severe or severe AP (OR 2.07, 95 % CI 1.29-3.33, p = 0.003), reverse causation not addressed","ja":"観察コホート：オピオイドの長期使用は中等症・重症と関連（OR 2.07、95%CI 1.29〜3.33、p=0.003）、逆因果は未検討"},{"en":"Epidural analgesia: meta-analysis of 9 studies (n = 726) favourable, but RCT of 148 patients showed no benefit and longer invasive ventilation","ja":"硬膜外鎮痛：9研究（n=726）のメタアナリシスでは有益、148例のRCTでは利益なく侵襲的換気期間が延長"}],"note_ja":"オピオイドは呼吸抑制、意識障害、麻痺性イレウスのある患者では避ける。","note_en":"Avoid opioids with respiratory depression, altered sensorium or paralytic ileus.","patients_ja":"患者は疼痛スケールだけでは痛みの影響や程度を十分に表せないとし、スケールを補助として使い、主観的な訴えにも耳を傾けるよう求めている。幻覚や妄想など鎮痛薬の副作用を自ら言い出せない患者もいるため、医師から副作用を尋ねてほしいとしている。","patients_en":"Patients feel pain scales alone do not capture the impact of pain and want them used alongside their own descriptions. They ask clinicians to enquire about side effects such as hallucinations or paranoid delusions, since some patients do not raise them."},{"q":15,"section":"VI","question_en":"What are the indications for admission to an intensive care unit (ICU) in patients with AP?","question_ja":"急性膵炎患者における集中治療室（ICU）入室の適応は何か","statements":[{"kind":"gps","text_en":"Organ failure of grade 2 or more as per the modified Marshall's classification is an indication for the transfer of a patient with AP to an ICU. Patients with infected necrotizing pancreatitis with sepsis or other complications such as intra-abdominal hemorrhage or colonic fistulization also merit admission to a high-dependency unit or ICU.","text_ja":"修正Marshallスコアでグレード2以上の臓器不全は、急性膵炎患者のICU転床の適応である。敗血症を伴う感染性膵壊死や、腹腔内出血、結腸瘻形成などの合併症を有する患者も、高度治療室（HDU）またはICUへの入室が妥当である。","strength":null,"quality":null}],"summary_ja":["改訂アトランタ分類は持続性（48時間超）臓器不全を重症と定義する。2016年の米国集中治療医学会（SCCM）ガイドラインでは、臓器不全に対する生命維持や集中的モニタリングを要する患者はすべてICU入室の対象となる。","Charlson併存疾患指数3以上、病的肥満、高齢（65歳超）、集中的なモニタリングや治療を要する臓器障害のある患者など、急速な悪化リスクが高い患者はHDUまたはICUへの入室を検討する。","乳酸、CRP、ヘマトクリット、BUNなどの単一マーカーのみでICUへのトリアージを行うことは推奨されない。"],"summary_en":["The revised Atlanta classification defines severe AP as persistent organ failure over 48 hours. Per the 2016 SCCM guidelines, any patient needing life support for organ failure or intensive monitoring should be admitted to the ICU.","Patients at high risk of rapid deterioration, such as a Charlson comorbidity index of 3 or more, morbid obesity, age over 65, or organ dysfunction requiring intensive monitoring, should be assessed for HDU or ICU admission.","Single markers such as lactate, CRP, hematocrit or BUN should not be used alone to triage patients to the ICU."],"evidence":[{"en":"SCCM guidelines (2016): all patients requiring life support for organ failure and intensive monitoring require ICU admission","ja":"SCCMガイドライン（2016年）：臓器不全に対する生命維持と集中的モニタリングを要する患者はICU入室の対象"},{"en":"High-risk features for HDU/ICU assessment: Charlson comorbidity index >=3, morbid obesity, age >65 years","ja":"HDU/ICU入室を検討すべき高リスク因子：Charlson併存疾患指数3以上、病的肥満、65歳超"}],"note_ja":"単一の検査値でICU入室を決めない。臓器不全のグレードと全身状態で判断する。","note_en":"Do not decide ICU admission on a single laboratory value. Use organ failure grade and overall condition.","patients_ja":"","patients_en":""},{"q":16,"section":"VI","question_en":"How to provide specific organ support to patients with AP admitted to the ICU?","question_ja":"ICUに入室した急性膵炎患者に対し、臓器別の支持療法をどのように行うべきか","statements":[{"kind":"gps","text_en":"Patients with organ failure require organ support, similar to any other critically ill patient in the ICU.","text_ja":"臓器不全を有する患者には、ICUの他の重症患者と同様に臓器支持療法が必要である。","strength":null,"quality":null}],"summary_ja":["急性膵炎に特化した集中治療のRCTは乏しく、推奨は主に敗血症など一般的な重症患者の文献から導かれている。","呼吸、腎、循環の支持は他の重症疾患と同様に行い、平均動脈圧65 mmHg以上を維持する。","中等症・重症の患者では腹腔内圧をモニタリングすべきである。詳細な推奨は補足資料に示されている。"],"summary_en":["RCTs on critical care specific to AP are lacking, so the advice is drawn mainly from the general critical care literature, especially sepsis.","Respiratory, renal and cardiovascular support should be given as in other critical illnesses, maintaining a MAP of 65 mm Hg or more.","Intra-abdominal pressure should be monitored in moderately severe and severe AP. Detailed recommendations are in the Supplementary material."],"evidence":[{"en":"Recommendations derived mainly from critical care and sepsis literature because AP-specific RCTs are lacking","ja":"急性膵炎特異的なRCTがないため、推奨は主に集中治療・敗血症の文献に基づく"},{"en":"Target MAP >=65 mm Hg, and monitor intra-abdominal pressure in moderate-severe AP","ja":"平均動脈圧65 mmHg以上を目標とし、中等症・重症では腹腔内圧をモニタリング"}],"note_ja":"","note_en":"","patients_ja":"患者は、どこで治療を受けていてもできる限りのことがなされ、適切な場合には専門のhigh-volume centerへの転送に最大限の努力が払われるという保証を求めている。","patients_en":"Patients want assurance that everything possible will be done wherever they are treated, and that every effort will be made to transfer them to a specialist high-volume center when appropriate."},{"q":17,"section":"VII","question_en":"When should antibiotics be used in AP?","question_ja":"急性膵炎において抗菌薬はいつ使用すべきか","statements":[{"kind":"rec","text_en":"Antibiotics should be used if there is proven extrapancreatic infection or strong suspicion of infected necrotizing pancreatitis.","text_ja":"膵外感染が証明された場合、または感染性膵壊死が強く疑われる場合には抗菌薬を使用すべきである。","strength":"strong","quality":"moderate"}],"summary_ja":["膵壊死性貯留の感染は抗菌薬の主な適応だが、急性膵炎全体の約5%と頻度は高くない。胆管炎や肺炎などの膵外感染は14〜37.4%に生じる。これらから、正当化される抗菌薬投与率は20〜40%程度と見積もられる。","実際には抗菌薬は過剰に使われている。23か国9869例の国際多施設研究では、投与率は中国81.4%、台湾80.6%、アルバニア78.6%、ブルガリア78%と高く、スペイン31.8%、英国31.2%と低かった。","抗菌薬投与は死亡率や重症度の低下と関連しなかった。感染の根拠に基づいて開始し、漫然とした投与を避けることが求められる。"],"summary_en":["Infected necrotic collections are the main indication for antibiotics but occur in only about 5 % of AP. Extrapancreatic infections such as cholangitis or pneumonia occur in 14 to 37.4 %. A justified antibiotic rate would therefore be about 20 to 40 %.","In practice antibiotics are overused. An international study of 9869 patients in 23 countries found rates as high as 81.4 % in China, 80.6 % in Taiwan, 78.6 % in Albania and 78 % in Bulgaria, and as low as 31.8 % in Spain and 31.2 % in the UK.","Antibiotic therapy was not associated with lower mortality or severity. Start antibiotics on evidence of infection and avoid open-ended use."],"evidence":[{"en":"Infection of pancreatic necrosis occurs in about 5 % of all AP, extrapancreatic infections in 14-37.4 %, so justified antibiotic use should be 20-40 %","ja":"膵壊死感染は急性膵炎全体の約5%、膵外感染は14〜37.4%で、正当な抗菌薬投与率は20〜40%"},{"en":"International multicenter study (9869 patients, 23 countries): antibiotic use 81.4 % China, 80.6 % Taiwan vs 31.8 % Spain, 31.2 % UK, with no association with lower mortality or severity","ja":"国際多施設研究（9869例、23か国）：抗菌薬投与率は中国81.4%、台湾80.6%に対しスペイン31.8%、英国31.2%。死亡率や重症度の低下とは関連せず"}],"note_ja":"発熱や炎症反応上昇は膵炎自体でも生じるため、それだけで抗菌薬を開始しない。","note_en":"Fever and raised inflammatory markers can come from pancreatitis itself and alone do not justify antibiotics.","patients_ja":"","patients_en":""},{"q":18,"section":"VII","question_en":"What are the clinical indications or biomarkers for initiating antibiotic therapy in AP?","question_ja":"急性膵炎において抗菌薬治療を開始する臨床的適応またはバイオマーカーは何か","statements":[{"kind":"rec","text_en":"Positive microbiologic cultures from body fluids, e.g., blood, sputum, bile, urine, and drain fluid, are definite indications for antibiotic therapy.","text_ja":"血液、喀痰、胆汁、尿、ドレーン排液などの体液の微生物培養陽性は、抗菌薬治療の明確な適応である。","strength":"strong","quality":"moderate"},{"kind":"rec","text_en":"The presence of gas bubbles within the pancreatic/peri-pancreatic necrotic collection on a CT scan suggests infected pancreatic necrosis and is an indication for antibiotic therapy.","text_ja":"CTで膵または膵周囲の壊死性貯留内にガス像を認める場合は感染性膵壊死が示唆され、抗菌薬治療の適応である。","strength":"strong","quality":"moderate"},{"kind":"rec","text_en":"Elevated levels of C-reactive protein (CRP), white blood cell (WBC) count, or procalcitonin (PCT) alone should not be used as biomarkers to start antibiotic therapy.","text_ja":"CRP、白血球数、プロカルシトニン（PCT）の上昇のみを、抗菌薬治療開始のバイオマーカーとして用いるべきではない。","strength":"strong","quality":"moderate"}],"summary_ja":["微生物培養陽性は抗菌薬開始の明確な根拠であり、膵または膵周囲貯留内のガス像も感染性膵壊死を示唆する。","炎症マーカーは病勢や二次感染の評価に役立つが、急性膵炎の早期には誤解を招きやすい。感染性壊死の診断能はCRP（AUC 0.510）と白血球数（AUC 0.454）では低く、許容できる予測能を示したのはPCT（AUC 0.729）のみであった。","軽症例が中心の単施設RCT（260例）では、PCTガイドにより抗菌薬使用が63%から45%に減少した。PCTは開始判断の単独根拠ではなく、使用を減らす補助として位置づけられる。感染性膵壊死をより早く診断できるバイオマーカーの開発が求められる。"],"summary_en":["Positive cultures are a definite trigger for antibiotics, and gas within a pancreatic or peripancreatic collection also points to infected necrosis.","Inflammatory markers help track disease and secondary infection, but are misleading early in AP. For infected necrosis, CRP (AUC 0.510) and WBC (AUC 0.454) perform poorly, and only procalcitonin (AUC 0.729) has acceptable predictive value.","A single-center RCT of 260 mostly mild AP patients showed that procalcitonin guidance reduced antibiotic use from 63 % to 45 %. PCT is a tool to limit use rather than a sole trigger to start. Better biomarkers for early diagnosis of infected necrosis are needed."],"evidence":[{"en":"Diagnostic performance for infected necrosis: CRP AUC 0.510, WBC AUC 0.454, procalcitonin AUC 0.729","ja":"感染性壊死の診断能：CRP AUC 0.510、白血球数 AUC 0.454、プロカルシトニン AUC 0.729"},{"en":"Single-center RCT (n = 260, mostly mild AP): procalcitonin-guided strategy reduced antibiotic use from 63 % to 45 %","ja":"単施設RCT（n=260、主に軽症）：プロカルシトニンガイドで抗菌薬使用が63%から45%に減少"}],"note_ja":"Table 1では2項目目の「infected pancreatic necrosis」が「infected necrotizing pancreatitis」と表記されているが、内容は同じである。","note_en":"Table 1 words the second item as infected necrotizing pancreatitis rather than infected pancreatic necrosis, with the same meaning.","patients_ja":"","patients_en":""},{"q":19,"section":"VII","question_en":"Is systemic antibiotic prophylaxis effective in preventing infectious complications in AP?","question_ja":"急性膵炎において、全身的な抗菌薬の予防投与は感染性合併症の予防に有効か？","statements":[{"kind":"rec","text_en":"The use of antibiotic prophylaxis is not recommended for the prevention of infectious complications associated with AP.","text_ja":"急性膵炎に伴う感染性合併症の予防を目的とした抗菌薬の予防投与は推奨しない。","strength":"strong","quality":"high"}],"summary_ja":["重症化が予測される例や壊死性膵炎であっても、感染予防だけを目的に抗菌薬を投与する根拠はない。","メタ解析では予防投与で感染性膵壊死は減らなかった。死亡への影響を示唆する結果もあったが、RCTに限定すると差は消えており、質の低い研究の影響が疑われる。","日本からの報告でも重症例での有益性は示されていない。抗菌薬は感染が証明された、あるいは強く疑われる時点で開始するのが原則である（Q17、Q18参照）。"],"summary_en":["Even in predicted severe or necrotizing AP, there is no basis for giving antibiotics solely to prevent infection.","A meta-analysis found that prophylaxis did not reduce infected pancreatic necrosis. A possible effect on mortality disappeared when only RCTs were analyzed, suggesting bias from lower quality studies.","A recent Japanese study also showed no benefit in severe AP. Antibiotics should start when infection is proven or strongly suspected (see Q17 and Q18)."],"evidence":[{"en":"Meta-analysis (11 studies, 864 patients): prophylaxis did not reduce infected pancreatic necrosis, with a possible effect on all-cause mortality in necrotizing AP","ja":"メタ解析（11研究、864例）：予防投与は感染性膵壊死を減らさず、壊死性膵炎の全死亡には影響する可能性が示唆された"},{"en":"Meta-analysis restricted to RCTs: no difference in mortality","ja":"RCTに限定したメタ解析：死亡率に差なし"},{"en":"Recent Japanese study: no benefit of prophylactic antibiotics in severe AP","ja":"日本の最近の研究：重症急性膵炎における予防的抗菌薬の有益性なし"}],"note_ja":"高い質のエビデンスに基づく強い推奨である。重症例でも予防投与は行わない。","note_en":"This is a strong recommendation based on high quality evidence, and it applies to severe disease as well.","patients_ja":"","patients_en":""},{"q":20,"section":"VII","question_en":"Are probiotics effective in preventing infectious complications?","question_ja":"プロバイオティクスは感染性合併症の予防に有効か？","statements":[{"kind":"rec","text_en":"Probiotic use is not recommended to prevent infectious complications associated with AP.","text_ja":"急性膵炎に伴う感染性合併症の予防のためにプロバイオティクスを使用することは推奨しない。","strength":"strong","quality":"high"}],"summary_ja":["腸内細菌叢を調整して bacterial translocation を抑えるという理論的な期待はあるが、臨床的な効果は確認されていない。","最近のメタ解析では感染性膵壊死や感染症全体の減少は示されなかった。予測重症例を対象とした以前のRCTでは、プロバイオティクス群で腸管虚血による死亡が増加しており、安全性の懸念がある。"],"summary_en":["Modulating gut flora to limit bacterial translocation is theoretically attractive, but no clinical benefit has been shown.","A recent meta-analysis found no reduction in infected necrosis or overall infections. An older RCT in predicted severe AP reported higher mortality from bowel ischemia with probiotics, raising a safety concern."],"evidence":[{"en":"Meta-analysis of 13 RCTs: no reduction in infected pancreatic necrosis or total infections","ja":"13件のRCTのメタ解析：感染性膵壊死および感染症全体の減少なし"},{"en":"Older RCT in predicted severe AP: increased mortality due to bowel ischemia with probiotics","ja":"予測重症例を対象とした以前のRCT：プロバイオティクス群で腸管虚血による死亡が増加"}],"note_ja":"有効性がないだけでなく有害事象の報告があるため、重症例での使用は避けるべきである。","note_en":"Beyond lack of efficacy, harm has been reported, so probiotics should be avoided particularly in severe disease.","patients_ja":"","patients_en":""},{"q":21,"section":"VII","question_en":"Is selective gut decontamination effective in preventing infectious complications in AP?","question_ja":"急性膵炎において、選択的消化管除菌（SDD）は感染性合併症の予防に有効か？","statements":[{"kind":"rec","text_en":"Selective gut decontamination is not recommended to prevent infectious complications.","text_ja":"感染性合併症の予防を目的とした選択的消化管除菌は推奨しない。","strength":"conditional","quality":"low"}],"summary_ja":["急性膵炎での選択的消化管除菌のエビデンスは単一のRCTに限られる。","このRCTではグラム陰性菌による膵感染は減ったものの、全死亡には差がなかった。データが乏しく、日常診療として行う根拠は不十分である。"],"summary_en":["Evidence for selective gut decontamination in AP comes from a single RCT.","That trial reduced Gram-negative pancreatic infections but did not change overall mortality. The data are too limited to support routine use."],"evidence":[{"en":"Single RCT: selective decontamination reduced Gram-negative pancreatic infections, with no difference in overall mortality","ja":"単一のRCT：選択的消化管除菌でグラム陰性菌による膵感染は減少したが、全死亡に差はなかった"}],"note_ja":"エビデンスが単一試験のみのため条件付き推奨にとどまる。","note_en":"The recommendation is conditional because evidence rests on one trial.","patients_ja":"患者は、食欲不振、悪心、嘔吐、腹痛、腹部膨満などの症状が感染性合併症の手がかりになりうるので、医療者はこれらに注意してほしいと考えている。","patients_en":"Patients feel that symptoms such as anorexia, nausea, vomiting, abdominal pain and bloating may signal infectious complications and should prompt clinicians to consider infection."},{"q":22,"section":"VIII","question_en":"When should oral feeding be started in patients with predicted non-severe pancreatitis, and what feed should be given?","question_ja":"非重症が予測される急性膵炎では、いつ経口摂取を開始し、どのような食事を与えるべきか？","statements":[{"kind":"rec","text_en":"In patients with predicted mild to moderate pancreatitis, oral feeding can be started as soon as possible when patients have an appetite and there is no vomiting. It is safe to start oral feeding with a regular, low-fat, solid diet.","text_ja":"軽症から中等症が予測される急性膵炎では、食欲があり嘔吐がなければ、できるだけ早期に経口摂取を開始してよい。経口摂取は通常の低脂肪固形食から開始しても安全である。","strength":"strong","quality":"moderate"}],"summary_ja":["血清酵素の正常化や腹痛の完全消失を待つ必要はない。食欲があり嘔吐がないことが再開の目安となる。","複数のメタ解析で、早期再開は腹痛の再燃を増やさず、合併症と入院期間を減らすことが示された。オピオイド鎮痛と組み合わせた即時の経口摂取も有効であり、医療費も抑えられる。","食形態については、流動食から段階的に上げる必要はない。軟らかい低脂肪食や固形食から始めても腹痛の再燃は増えず、入院期間が短縮した。"],"summary_en":["There is no need to wait for normal enzymes or complete pain resolution. Appetite and absence of vomiting are the practical triggers for refeeding.","Several meta-analyses showed that early refeeding did not increase pain recurrence and reduced complications and length of stay. Immediate oral diet combined with opioid analgesia also worked well and lowered costs.","A stepwise start with clear liquids is unnecessary. Soft, low-fat or solid diets shortened hospital stay without more pain recurrence and appeared as safe as clear liquids."],"evidence":[{"en":"Five meta-analyses and other studies on timing: early refeeding did not affect pain recurrence, decreased complications and shortened hospital stay","ja":"再開時期に関する5件のメタ解析と他の研究：早期再開は腹痛再燃に影響せず、合併症を減らし入院期間を短縮"},{"en":"Conventional feeding: 16% pain relapse rate","ja":"従来型の食事再開：腹痛再燃率16%"},{"en":"Three meta-analyses on feed type: soft, low-fat, hypocaloric or solid diet shortened hospital stay without more pain recurrence, as safe as clear liquid diet","ja":"食形態に関する3件のメタ解析：軟食、低脂肪食、低カロリー食または固形食は腹痛再燃を増やさず入院期間を短縮し、流動食と同等に安全"}],"note_ja":"対象は予測軽症から中等症である。重症例の栄養はQ23、Q24を参照する。","note_en":"This applies to predicted mild to moderate AP. For severe disease see Q23 and Q24.","patients_ja":"","patients_en":""},{"q":23,"section":"VIII","question_en":"When should nutritional support be initiated, and what is the preferred route?","question_ja":"栄養療法はいつ開始すべきか、また望ましい投与経路は何か？","statements":[{"kind":"rec","text_en":"Early enteral tube feeding, preferably within 72 hours of onset of AP, is recommended if patients cannot tolerate oral feeding.","text_ja":"経口摂取に耐えられない場合は、早期の経管経腸栄養を、できれば発症から72時間以内に開始することを推奨する。","strength":"strong","quality":"high"}],"summary_ja":["経腸栄養は静脈栄養より優先される。腸管の統合性を保ち、臓器不全、感染性膵壊死、入院期間、死亡を減らすためである。静脈栄養にはカテーテル敗血症、代謝・電解質異常、高血糖、腸管萎縮、細菌異常増殖などの問題がある。","開始時期については、入院24時間以内や48時間以内の経腸栄養開始で、死亡、臓器不全、感染、外科的介入が減るというメタ解析が複数ある。","一方、予測重症例を対象とした多施設RCTでは、早期の経鼻経腸栄養は72時間後の経口摂取開始に勝らず、オンデマンド群の多くは経管栄養を必要としなかった。まず経口摂取を試し、耐えられない場合に経管栄養へ進むのが現実的である。"],"summary_en":["Enteral nutrition is preferred over parenteral nutrition because it maintains gut integrity and reduces organ failure, infected necrosis, length of stay and mortality. Parenteral nutrition carries risks such as catheter sepsis, metabolic and electrolyte disturbances, hyperglycemia, intestinal atrophy and bacterial overgrowth.","Regarding timing, several meta-analyses link enteral feeding started within 24 or 48 hours of admission to lower mortality, organ failure, infections and need for surgery.","However, a multicenter RCT in predicted severe AP found early nasoenteric feeding no better than an oral diet started after 72 hours, and most patients in the on-demand arm never needed tube feeding. A practical approach is to try oral intake first and move to tube feeding only if it fails."],"evidence":[{"en":"Meta-analysis of 8 RCTs (165 patients): enteral nutrition within 24 hours lowered a combined endpoint of mortality, infected necrosis and organ failure (45% vs 19%, OR 0.44, 95% CI 0.2 to 0.96)","ja":"8件のRCT（165例）のメタ解析：24時間以内の経腸栄養開始で死亡、感染性膵壊死、臓器不全の複合エンドポイントが低下（45%対19%、OR 0.44、95%CI 0.2〜0.96）"},{"en":"Multicenter RCT in predicted severe AP: early nasoenteric feeding not superior to oral diet after 72 hours, and 72 patients (69%) in the on-demand group tolerated oral diet","ja":"予測重症例の多施設RCT：早期経鼻経腸栄養は72時間後の経口摂取に勝らず、オンデマンド群の72例（69%）は経口摂取に耐えた"},{"en":"Meta-analysis of 17 studies: enteral feeding before 48 hours associated with lower mortality (3.9 fold), sepsis and hospital stay","ja":"17研究のメタ解析：48時間以内の経腸栄養開始で死亡（3.9倍の差）、敗血症、入院期間が減少"},{"en":"RCT of appetite-guided early enteral feeding in moderately severe or severe AP: feasible and shortened hospital stay","ja":"中等症から重症例での食欲に基づく早期経腸栄養のRCT：実施可能で入院期間を短縮"}],"note_ja":"「早期」の定義は研究によって24時間、48時間、72時間とばらつきがある。推奨文は72時間以内を目安としている。","note_en":"Definitions of early vary across studies (24, 48 or 72 hours). The recommendation uses 72 hours as the target.","patients_ja":"","patients_en":""},{"q":24,"section":"VIII","question_en":"What is the indication for nasoenteric tube feeding in predicted severe AP?","question_ja":"重症が予測される急性膵炎において、経鼻経腸栄養の適応は何か？","statements":[{"kind":"rec","text_en":"In the case of insufficient oral intake during the first 72 hours of hospital admission, nasoenteric tube feeding is indicated in patients with predicted severe or established acute necrotizing pancreatitis.","text_ja":"予測重症または壊死性膵炎が確立した患者で、入院後72時間の経口摂取が不十分な場合は、経鼻経腸栄養の適応である。","strength":"strong","quality":"high"}],"summary_ja":["予測重症例でも経口摂取が可能で経管栄養を要しない患者は少なくない。そのため一律に経管栄養を行うのではなく、72時間の経過で判断する。","72時間を過ぎても経口摂取に耐えられない場合や、必要な栄養量を満たせない場合に経鼻経腸栄養を開始する。早期の経腸栄養は死亡、臓器不全、感染、外科的介入の減少と関連する。"],"summary_en":["Many patients with predicted severe AP can eat and never need a feeding tube, so tube feeding should not be automatic. The decision is made over the first 72 hours.","If oral intake is not tolerated after 72 hours, or nutritional needs are not met, nasoenteric feeding is indicated. Early enteral feeding is linked to lower mortality, organ failure, infections and need for surgery."],"evidence":[{"en":"Multicenter RCT: only 31% of patients with predicted severe AP required nasoenteric tube feeding","ja":"多施設RCT：予測重症例のうち経鼻経腸栄養を要したのは31%のみ"},{"en":"Enteral feeding within 48 hours of admission: lower mortality, organ failure, local and systemic infections and need for surgical intervention","ja":"入院48時間以内の経腸栄養：死亡、臓器不全、局所および全身感染、外科的介入の必要性が減少"}],"note_ja":"","note_en":"","patients_ja":"","patients_en":""},{"q":25,"section":"VIII","question_en":"What type of enteral nutrition formulation should be used?","question_ja":"どのような経腸栄養剤を使用すべきか？","statements":[{"kind":"rec","text_en":"Polymeric enteral nutrition formulations are recommended for enteral tube feeding in patients with AP who do not tolerate oral intake.","text_ja":"経口摂取に耐えられない急性膵炎患者の経管経腸栄養には、半消化態（polymeric）栄養剤を推奨する。","strength":"conditional","quality":"moderate"}],"summary_ja":["経腸栄養剤には半消化態（標準）、消化態（semi-elemental）、成分栄養（elemental）、免疫賦活栄養剤がある。","メタ解析では消化態や成分栄養の優位性は示されず、半消化態は不耐、感染、死亡のいずれも同等で、より安価である。日本の大規模後ろ向き研究でも成分栄養剤に敗血症、死亡、コスト面の利点はなかった。","食物繊維添加の有用性は不明で、免疫賦活栄養やω3脂肪酸の補充はさらなる試験が必要であり現時点では推奨できない。"],"summary_en":["Formulations include standard polymeric, semi-elemental, elemental and immunonutrition products.","Meta-analyses found no advantage of elemental or semi-elemental feeds. Polymeric feeds have similar rates of intolerance, infection and mortality at lower cost. A large Japanese retrospective study also found no benefit of an elemental diet for sepsis, mortality or cost.","The value of fiber enrichment is unclear, and immunonutrition or omega-3 supplementation needs further trials before it can be recommended."],"evidence":[{"en":"Three meta-analyses: no evidence supporting elemental or semi-elemental formulations","ja":"3件のメタ解析：成分栄養や消化態栄養剤を支持するエビデンスなし"},{"en":"Large Japanese retrospective study: no clinical advantage of elemental diet in sepsis risk, mortality or cost","ja":"日本の大規模後ろ向き研究：成分栄養剤に敗血症リスク、死亡、コスト面での臨床的利点なし"}],"note_ja":"日本の大規模後ろ向き研究でも、成分栄養剤に敗血症・死亡・費用の面での利点は示されなかった。より安価な半消化態栄養剤で十分とされる。","note_en":"A large retrospective Japanese study also found no advantage of an elemental diet for sepsis, mortality or cost. Cheaper polymeric formulas are sufficient.","patients_ja":"","patients_en":""},{"q":26,"section":"VIII","question_en":"Should enteral tube feeding be administered via a nasojejunal or nasogastric route?","question_ja":"経管経腸栄養は経鼻空腸ルートと経鼻胃ルートのどちらで行うべきか？","statements":[{"kind":"rec","text_en":"Enteral tube feeding can be administered via either the nasogastric or nasojejunal route in patients with AP.","text_ja":"急性膵炎患者の経管経腸栄養は、経鼻胃ルートと経鼻空腸ルートのいずれで行ってもよい。","strength":"strong","quality":"high"}],"summary_ja":["RCTのメタ解析では、経鼻胃栄養は経鼻空腸栄養と同等に安全かつ有効であり、感染、臓器不全、死亡に差はなかった。","経鼻胃管の方が留置は容易である。ただし嘔吐や胃の麻痺性イレウスで経鼻胃栄養に耐えられない患者もおり、その場合は経鼻空腸栄養を選ぶ。"],"summary_en":["Meta-analyses of RCTs show nasogastric feeding to be as safe and effective as nasojejunal feeding, with no difference in infection, organ failure or mortality.","Nasogastric tubes are easier to place. Some patients cannot tolerate gastric feeding because of vomiting or gastric ileus, and these patients need nasojejunal feeding."],"evidence":[{"en":"Six meta-analyses of RCTs: nasogastric feeding as safe and effective as nasojejunal feeding, with no significant difference in infection, organ failure or mortality","ja":"RCTの6件のメタ解析：経鼻胃栄養は経鼻空腸栄養と同等に安全かつ有効で、感染、臓器不全、死亡に有意差なし"}],"note_ja":"まず経鼻胃栄養で開始し、不耐の場合に経鼻空腸栄養へ切り替えるのが実際的である。","note_en":"In practice, start with nasogastric feeding and switch to nasojejunal feeding if it is not tolerated.","patients_ja":"","patients_en":""},{"q":27,"section":"VIII","question_en":"When should parenteral nutrition be used in AP?","question_ja":"急性膵炎において、静脈栄養はいつ使用すべきか？","statements":[{"kind":"rec","text_en":"Parenteral nutrition should be administered to patients with AP if enteral nutrition cannot meet nutritional goals during the course of the disease.","text_ja":"経過中に経腸栄養で栄養目標を達成できない場合に、急性膵炎患者に静脈栄養を行うべきである。","strength":"strong","quality":"moderate"}],"summary_ja":["RCT、メタ解析、批判的レビューのいずれも、重症度を問わず経腸栄養が静脈栄養より優れ、感染、臓器不全、死亡を減らすことを示している。重症例に限ったRCTでも結果は同様である。","静脈栄養は、経口や経管栄養で目標に届かない場合、または腸閉塞、腹部コンパートメント症候群（ACS）、遷延する麻痺性イレウス、腸間膜虚血など経腸栄養が禁忌となる合併症がある場合に限って開始する。","急性膵炎に特化した栄養目標のエビデンスはなく、ICU患者のエネルギーと蛋白の一般的指針を用いる。多くの患者は経口か経腸で必要量を満たせるため、入院後1週間以内に静脈栄養を始める必要は通常ない。"],"summary_en":["RCTs, meta-analyses and a critical review consistently show enteral nutrition to be superior to parenteral nutrition across all severity grades, reducing infection, organ failure and mortality. RCTs in severe AP gave similar results.","Parenteral nutrition should be started only when goals cannot be met orally or enterally, or when complications contraindicate enteral feeding, such as bowel obstruction, abdominal compartment syndrome, prolonged paralytic ileus or mesenteric ischemia.","There is no AP specific evidence on nutritional targets, so general ICU energy and protein guidelines apply. Because most patients can meet needs orally or enterally, parenteral nutrition is usually not needed in the first week of admission."],"evidence":[{"en":"Multiple RCTs, three meta-analyses and a critical review: enteral nutrition superior to parenteral nutrition, reducing infection, organ failure and mortality across severity grades","ja":"複数のRCT、3件のメタ解析、批判的レビュー：重症度を問わず経腸栄養は静脈栄養より優れ、感染、臓器不全、死亡を減少"},{"en":"RCTs in severe AP: parenteral nutrition consistently less effective than enteral nutrition despite methodological heterogeneity","ja":"重症例のRCT：方法論的なばらつきはあるものの、静脈栄養は一貫して経腸栄養より劣る"}],"note_ja":"静脈栄養は経腸栄養の代替ではなく補完として位置づけられる。","note_en":"Parenteral nutrition is a supplement to, not a substitute for, enteral nutrition.","patients_ja":"患者は栄養療法を最も重要な事項の一つと考え、この領域に6つの設問が設けられたことを歓迎している。栄養は回復と生活の再建に欠かせないとみなしている。","patients_en":"Patients consider nutritional support among the most important topics and welcome the six questions on it, viewing nutrition as essential to recovery and rebuilding their lives."},{"q":28,"section":"IX","question_en":"What is the indication for early Endoscopic Retrograde Cholangiopancreatography (ERCP) and endoscopic sphincterotomy (ES) within 72 hours in the course of acute biliary pancreatitis?","question_ja":"胆石性膵炎の経過中、72時間以内の早期ERCPおよび内視鏡的乳頭括約筋切開術（ES）の適応は何か？","statements":[{"kind":"rec","text_en":"Early ERCP with ES within 72 hours is not recommended in the course of predicted mild biliary pancreatitis without acute cholangitis.","text_ja":"急性胆管炎を伴わない予測軽症の胆石性膵炎では、72時間以内の早期ERCP/ESは推奨しない。","strength":"strong","quality":"high"},{"kind":"rec","text_en":"Early ERCP/ES is not recommended in predicted severe acute biliary pancreatitis without acute cholangitis.","text_ja":"急性胆管炎を伴わない予測重症の胆石性膵炎では、早期ERCP/ESは推奨しない。","strength":"strong","quality":"moderate"},{"kind":"rec","text_en":"Early ERCP/ES is recommended in patients with acute biliary pancreatitis and acute cholangitis.","text_ja":"急性胆管炎を合併した胆石性膵炎では、早期ERCP/ESを推奨する。","strength":"strong","quality":"high"},{"kind":"rec","text_en":"ERCP/ES may be done to prevent recurrence of pancreatitis if cholecystectomy cannot be performed during the same hospital admission.","text_ja":"同一入院中に胆嚢摘出術を行えない場合は、膵炎再発予防のためにERCP/ESを行ってもよい。","strength":"conditional","quality":"low"}],"summary_ja":["胆石性膵炎でのERCPの目的は、総胆管結石の除去のためのES、胆管炎時の胆道減圧、胆道閉塞時のステント留置である。ここでの早期ERCPは発症24〜72時間以内の施行を指す。","胆管炎を伴わない場合、早期ERCPは死亡、臓器不全、膵壊死を改善しない。胆管炎のない胆石性膵炎を対象としたRCTでも、24時間以内の緊急ERCP/ESは転帰を改善しなかったが、胆管炎の発生は減少した。","SIRSを伴う急性膵炎では胆管炎の診断が難しい点に注意が必要である。胆管炎があれば早期ERCP/ESの適応となる。胆嚢摘出術を同一入院中に行えない高齢者や併存疾患の多い患者では、再発予防のESが選択肢となる。"],"summary_en":["In biliary AP, ERCP aims to perform sphincterotomy for stone extraction, decompress the bile duct in cholangitis and place a stent when there is biliary obstruction. Early ERCP here means within 24 to 72 hours of presentation.","Without cholangitis, early ERCP does not improve mortality, organ failure or necrosis. In an RCT of gallstone AP without cholangitis, urgent ERCP/ES within 24 hours did not improve outcomes, although it lowered the rate of cholangitis.","Diagnosing cholangitis can be difficult when SIRS is present. When cholangitis is present, early ERCP/ES is indicated. For patients who cannot have cholecystectomy during the same admission, sphincterotomy is an option to prevent recurrence."],"evidence":[{"en":"RCT of urgent ERCP within 24 hours in gallstone AP without cholangitis: no improvement in outcomes, but cholangitis 2% vs 10% with conservative treatment","ja":"胆管炎のない胆石性膵炎で24時間以内の緊急ERCPを検討したRCT：転帰の改善なし。ただし胆管炎は2%対10%（保存的治療）"},{"en":"In the same RCT, 41% of patients randomized to conservative treatment underwent ERCP/ES during the same admission","ja":"同RCTで保存的治療群の41%が同一入院中にERCP/ESを受けた"},{"en":"EUS-guided strategy reserving urgent ERCP for patients with bile duct stones: no benefit in the absence of cholangitis","ja":"総胆管結石例のみに緊急ERCPを行うEUSガイド戦略：胆管炎がなければ有益性なし"}],"note_ja":"胆管炎の有無が早期ERCPの判断の分岐点である。Table 1の語句には綴りの誤り（recurrecne）があり、本文の表記を採用した。","note_en":"Presence of cholangitis is the key decision point for early ERCP. Table 1 contains a typo (recurrecne), so the body text wording is used here.","patients_ja":"","patients_en":""},{"q":29,"section":"IX","question_en":"When should ERCP/ES be performed for a common bile duct stone in the setting of acute biliary pancreatitis without cholangitis?","question_ja":"胆管炎を伴わない胆石性膵炎で総胆管結石がある場合、ERCP/ESはいつ行うべきか？","statements":[{"kind":"rec","text_en":"In patients with acute biliary pancreatitis without cholangitis, elective ERCP/ES is indicated when a common bile duct stone is identified on imaging such as EUS or MRCP.","text_ja":"胆管炎を伴わない胆石性膵炎では、EUSやMRCPなどの画像検査で総胆管結石が確認された場合に待機的ERCP/ESの適応となる。","strength":"strong","quality":"high"}],"summary_ja":["肝胆道系酵素、腹部超音波、CTによる総胆管結石の検出能は低い。総胆管結石が疑われる場合はEUSかMRCPを行う。","胆石性膵炎の患者は総胆管結石の中等度リスクに相当するため、一次画像で結石が明らかでなければ、胆嚢摘出術の前にMRCP、EUS、術中胆道造影による追加評価が必要となりうる。","総胆管結石の存在だけでは早期ERCPの根拠にならない。確認された結石には待機的にERCP/ESで対応する。"],"summary_en":["Liver tests, transabdominal ultrasound and CT have poor sensitivity for common bile duct stones. EUS or MRCP should be used when choledocholithiasis is suspected.","Patients with biliary AP carry at least intermediate risk of choledocholithiasis, so further imaging (MRCP, EUS or intraoperative cholangiography) may be needed before cholecystectomy unless first line imaging has already shown a stone.","A bile duct stone alone does not justify early ERCP. A confirmed stone is managed with elective ERCP/ES."],"evidence":[{"en":"Liver chemistries, transabdominal ultrasound and CT: poor sensitivity for confirming common bile duct stones, so EUS or MRCP is preferred","ja":"肝機能検査、腹部超音波、CT：総胆管結石の確認には感度が低く、EUSまたはMRCPが望ましい"}],"note_ja":"本文の推奨文は箇条書きの短い表現で、Table 1の表記（胆管炎を伴わない胆石性膵炎という条件を含む）を採用した。","note_en":"The body text gives a shorter bullet, so the fuller Table 1 wording (which specifies biliary AP without cholangitis) is used.","patients_ja":"患者は、胆嚢摘出術の適応がない場合のERCP/ESの時期について明確にしてほしいと述べている。Q28は入院72時間以内の適応を扱っており、胆嚢摘出術が困難な患者ではERCP/ESは通常その後、できれば同一入院中に行うのが適切である。","patients_en":"Patients asked for clarity on ERCP/ES timing when they are not suitable for cholecystectomy. Q28 covers the first 72 hours, and in patients unfit for cholecystectomy ERCP/ES is usually better done later, preferably during the same admission."},{"q":30,"section":"X","question_en":"What is the management of sterile acute necrotizing pancreatitis in the early phase?","question_ja":"早期の無菌性壊死性膵炎はどのように管理すべきか？","statements":[{"kind":"rec","text_en":"Conservative management is recommended for sterile acute necrotizing pancreatitis in the early phase.","text_ja":"早期の無菌性壊死性膵炎には保存的治療を推奨する。","strength":"strong","quality":"low"}],"summary_ja":["壊死性膵炎の治療は発症1週以降も基本的に支持療法である。壊死の大部分（最大80%）は無菌のまま経過する。鎮痛、栄養療法、臓器不全例のICU管理が中心となる。","早期の画像所見は臨床経過と相関せず予後予測にも役立たない。ソマトスタチン、オクトレオチド、ガベキサートなどの抗分泌薬や蛋白分解酵素阻害薬の有効性は、持続動注を含め確認されていない。","発症2〜4週は主に壊死巣の感染に注意して経過観察する時期である。早期の壊死巣は被包化されておらず有効なドレナージが難しく、過去の手術成績では死亡率が高かった。"],"summary_en":["Management of necrotizing AP remains supportive beyond the first week. Most necrosis (up to 80%) stays sterile. Analgesia, nutrition and ICU support for organ failure are the mainstay.","Early imaging findings do not correlate with the clinical course or predict outcome. Antisecretory drugs and protease inhibitors (somatostatin, octreotide, gabexate mesilate), including continuous regional arterial infusion, have no confirmed benefit.","Weeks 2 to 4 are a period of watchful observation, mainly for infection of necrosis. Early collections are not walled off and are hard to drain, and earlier surgical series for sterile necrosis showed high mortality."],"evidence":[{"en":"Necrosis remains sterile in most patients (up to 80%)","ja":"壊死の大部分（最大80%）は無菌のまま経過"},{"en":"Antisecretory drugs and protease inhibitors, including continuous regional arterial infusion: benefit not confirmed","ja":"抗分泌薬および蛋白分解酵素阻害薬（持続動注を含む）：有効性は確認されていない"},{"en":"Earlier surgical studies in sterile necrotizing AP: high mortality","ja":"無菌性壊死に対する過去の外科治療の研究：高い死亡率"}],"note_ja":"蛋白分解酵素阻害薬の持続動注（CRAI）などの特異的治療は、本ガイドラインでは有効性が確認されていないとされる。","note_en":"Specific therapies such as continuous regional arterial infusion (CRAI) of protease inhibitors are considered unproven in this guideline.","patients_ja":"","patients_en":""},{"q":31,"section":"X","question_en":"How should infected necrotizing pancreatitis be diagnosed?","question_ja":"感染性壊死性膵炎はどのように診断すべきか？","statements":[{"kind":"rec","text_en":"A diagnosis of infected necrotizing pancreatitis should be established based on a combination of clinical, serologic, and radiological findings. Routine use of fine needle aspiration (FNA) to confirm infected necrotizing pancreatitis is not recommended.","text_ja":"感染性壊死性膵炎の診断は、臨床所見、血清学的所見、画像所見を組み合わせて行うべきである。感染性壊死性膵炎の確認のためにルーチンで穿刺吸引（FNA）を行うことは推奨しない。","strength":"strong","quality":"low"}],"summary_ja":["発症7〜10日を過ぎても改善しない、悪化する、新たな発熱、白血球増多、プロカルシトニン上昇、敗血症の所見がある場合に感染を疑う。","ゴールドスタンダードはCTまたは超音波ガイド下FNAによる培養であるが、偽陰性や偽陽性があり、穿刺による感染持ち込みの危険もあるためルーチンには行わない。広域抗菌薬に反応しない場合や多剤耐性菌、真菌感染が疑われる場合に限って考慮する。","CTで壊死巣内のガス像は特異度が高いが感度は中等度である。プロカルシトニンは有用だが、急性膵炎患者の最大20%に膵外感染（菌血症、肺炎、カテーテル感染、尿路感染）が起こるため、炎症マーカー上昇の解釈では膵外感染を除外する必要がある。"],"summary_en":["Infection should be suspected when a patient with necrosis fails to improve or deteriorates after 7 to 10 days, or develops new fever, rising leukocytes, raised procalcitonin or sepsis.","FNA with culture under CT or ultrasound guidance is the gold standard, but false negative and false positive results and the risk of introducing infection argue against routine use. It can be considered when there is no response to broad-spectrum antibiotics or when multidrug-resistant bacterial or fungal infection is suspected.","Gas in the necrotic collection on CT is highly specific but only moderately sensitive. Procalcitonin is useful, but up to 20% of AP patients develop extrapancreatic infections (bloodstream, pneumonia, catheter, urinary tract), which must be excluded when interpreting inflammatory markers."],"evidence":[{"en":"Routine FNA: false-negative rate 20 to 29% and false-positive results 4 to 10%","ja":"ルーチンのFNA：偽陰性20〜29%、偽陽性4〜10%"},{"en":"Serum procalcitonin cut-off 3.5 ng/mL: sensitivity 90% and specificity 89% for infected necrosis","ja":"血清プロカルシトニン カットオフ3.5 ng/mL：感染性膵壊死に対し感度90%、特異度89%"},{"en":"Gas bubbles in (peri)pancreatic necrotic collection: high specificity, moderate sensitivity","ja":"膵および膵周囲壊死巣内のガス像：特異度は高く、感度は中等度"},{"en":"Up to 20% of AP patients develop extrapancreatic infections","ja":"急性膵炎患者の最大20%に膵外感染が発生"}],"note_ja":"壊死巣内のガスは消化管との瘻孔によっても生じるため、ガス像の解釈には注意が必要である。","note_en":"Gas in a collection can also result from a fistula with the gastrointestinal tract, so it should be interpreted with care.","patients_ja":"","patients_en":""},{"q":32,"section":"X","question_en":"What should be the initial optimal treatment for suspected infected necrotizing pancreatitis?","question_ja":"感染性壊死性膵炎が疑われる場合、初期の最適な治療は何か？","statements":[{"kind":"rec","text_en":"The initial management of infected necrotizing pancreatitis should be medical ‘conservative first’ (non-interventional) treatment, ensuring optimal nutritional supplementation and intravenous administration of broad-spectrum antibiotics.","text_ja":"感
